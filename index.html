  // ---------- contract as a PDF (hand-rolled: no library, works offline) ----------
  const PDF_W = 595.28;
  const PDF_H = 841.89;
  const PDF_MARGIN = 56;
  const PDF_TEXT_W = PDF_W - PDF_MARGIN * 2;
  // WinAnsi covers Dutch; swap the typographic characters a coach actually types
  const PDF_SWAP = { '—': '-', '–': '-', '’': "'", '‘': "'", '“': '"', '”': '"', '×': 'x', '·': '-', '€': '\x80', '…': '...' };
  const pdfText = (s) => String(s ?? '').replace(/[^\x20-\x7E\xA0-\xFF]/g, (c) => PDF_SWAP[c] || '?');
  const pdfEsc = (s) => pdfText(s).replace(/[\\()]/g, (c) => '\\' + c);
  const pdfBytes = (s) => Uint8Array.from(String(s), (c) => c.charCodeAt(0) & 0xff);
  // Helvetica averages just under half an em; stay a touch wide so lines never overrun
  const pdfWidth = (s, size, bold) => pdfText(s).length * size * (bold ? 0.55 : 0.52);

  function pdfWrap(text, size, width, bold) {
    const out = [];
    for (const para of String(text || '').split('\n')) {
      if (!para.trim()) { out.push(''); continue; }
      let line = '';
      for (const word of para.split(/\s+/)) {
        const next = line ? line + ' ' + word : word;
        if (pdfWidth(next, size, bold) > width && line) { out.push(line); line = word; }
        else line = next;
      }
      out.push(line);
    }
    return out;
  }

  async function pdfJpeg(dataUrl, maxW = 460) {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error('afbeelding kon niet worden gelezen'));
      i.src = dataUrl;
    });
    const w = Math.min(maxW, img.width || maxW);
    const h = Math.max(1, Math.round((img.height / (img.width || 1)) * w));
    const cv = document.createElement('canvas');
    cv.width = w;
    cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    const b64 = cv.toDataURL('image/jpeg', 0.9).split(',')[1];
    return { w, h, bytes: Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)) };
  }

  // builds the page streams first, so the object numbers are known before writing
  function pdfLayout(blocks, imageCount) {
    const pages = [];
    let ops = [];
    let y = PDF_H - PDF_MARGIN;
    const newPage = () => { pages.push(ops); ops = []; y = PDF_H - PDF_MARGIN; };
    const room = (h) => { if (y - h < PDF_MARGIN + 24) newPage(); };
    const write = (s, x, size, bold, grey) => {
      ops.push(`BT /${bold ? 'F2' : 'F1'} ${size} Tf ${grey || 0.1} g 1 0 0 1 ${x.toFixed(2)} ${y.toFixed(2)} Tm (${pdfEsc(s)}) Tj ET`);
    };
    for (const bl of blocks) {
      if (bl.type === 'title') {
        room(30); write(bl.text, PDF_MARGIN, 18, true); y -= 24;
      } else if (bl.type === 'sub') {
        room(16); write(bl.text, PDF_MARGIN, 10, false, 0.42); y -= 18;
      } else if (bl.type === 'rule') {
        room(14);
        ops.push(`0.8 G 0.7 w ${PDF_MARGIN} ${y.toFixed(2)} m ${(PDF_W - PDF_MARGIN).toFixed(2)} ${y.toFixed(2)} l S`);
        y -= 18;
      } else if (bl.type === 'head') {
        room(26); y -= 8; write(bl.text, PDF_MARGIN, 11, true); y -= 16;
      } else if (bl.type === 'row') {
        room(16);
        write(bl.label, PDF_MARGIN, 10, false, 0.35);
        const vw = pdfWidth(bl.value, 10, true);
        write(bl.value, PDF_W - PDF_MARGIN - vw, 10, true);
        y -= 15;
      } else if (bl.type === 'para') {
        for (const line of pdfWrap(bl.text, 10, PDF_TEXT_W)) {
          room(14);
          if (line) write(line, PDF_MARGIN, 10, false, 0.2);
          y -= 13;
        }
        y -= 4;
      } else if (bl.type === 'signatures') {
        const boxW = (PDF_TEXT_W - 24) / 2;
        const boxH = Math.max(...bl.items.map((it) => Math.round((it.img.h / it.img.w) * boxW)));
        room(boxH + 40);
        bl.items.forEach((it, i) => {
          const x = PDF_MARGIN + i * (boxW + 24);
          const h = Math.round((it.img.h / it.img.w) * boxW);
          ops.push(`q ${boxW.toFixed(2)} 0 0 ${h} ${x.toFixed(2)} ${(y - h).toFixed(2)} cm /Im${it.index + 1} Do Q`);
          ops.push(`0.8 G 0.7 w ${x.toFixed(2)} ${(y - h).toFixed(2)} m ${(x + boxW).toFixed(2)} ${(y - h).toFixed(2)} l S`);
        });
        y -= boxH + 12;
        bl.items.forEach((it, i) => write(it.name, PDF_MARGIN + i * (boxW + 24), 9, false, 0.42));
        y -= 20;
      }
    }
    pages.push(ops);
    return pages.filter((ps, i) => ps.length || i === 0);
  }

  function pdfAssemble(pages, images) {
    const nImg = images.length;
    const catalog = 1;
    const pagesObj = 2;
    const fontR = 3;
    const fontB = 4;
    const imgObj = (i) => 5 + i;
    const pageObj = (i) => 5 + nImg + i * 2;
    const contObj = (i) => 6 + nImg + i * 2;
    const objects = [];
    const put = (...chunks) => { objects.push(chunks); };

    put(`<< /Type /Catalog /Pages ${pagesObj} 0 R >>`);
    put(`<< /Type /Pages /Count ${pages.length} /Kids [${pages.map((_, i) => `${pageObj(i)} 0 R`).join(' ')}] >>`);
    put('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    put('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    images.forEach((im) => put(
      `<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB `
      + `/BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`,
      im.bytes, '\nendstream'));
    pages.forEach((ops, i) => {
      const res = `<< /Font << /F1 ${fontR} 0 R /F2 ${fontB} 0 R >>`
        + (nImg ? ` /XObject << ${images.map((_, k) => `/Im${k + 1} ${imgObj(k)} 0 R`).join(' ')} >>` : '') + ' >>';
      put(`<< /Type /Page /Parent ${pagesObj} 0 R /MediaBox [0 0 ${PDF_W.toFixed(2)} ${PDF_H.toFixed(2)}] `
        + `/Resources ${res} /Contents ${contObj(i)} 0 R >>`);
      const stream = ops.join('\n');
      put(`<< /Length ${pdfBytes(stream).length} >>\nstream\n`, stream, '\nendstream');
    });

    const chunks = [];
    let len = 0;
    const push = (c) => { const b = typeof c === 'string' ? pdfBytes(c) : c; chunks.push(b); len += b.length; };
    push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    const offsets = [];
    objects.forEach((parts, i) => {
      offsets[i] = len;
      push(`${i + 1} 0 obj\n`);
      parts.forEach(push);
      push('\nendobj\n');
    });
    const xref = len;
    push(`xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`);
    offsets.forEach((off) => push(String(off).padStart(10, '0') + ' 00000 n \n'));
    push(`trailer\n<< /Size ${objects.length + 1} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    return new Blob(chunks, { type: 'application/pdf' });
  }

  async function contractPdf(s, client) {
    const sig = s.signature || {};
    const end = subEnd(s);
    const images = [];
    const items = [];
    for (const [key, name] of [['client', sig.clientName || client.name], ['coach', sig.coachName || 'Coach']]) {
      if (!sig[key]) continue;
      const img = await pdfJpeg(sig[key]);
      items.push({ name, img, index: images.length });
      images.push(img);
    }
    const blocks = [
      { type: 'title', text: 'Trainingsovereenkomst' },
      { type: 'sub', text: `${client.name} en ${sig.coachName || db.settings.coachName || 'de coach'}` },
      { type: 'rule' },
      { type: 'head', text: 'Afspraken' },
      { type: 'row', label: 'Klant', value: client.name },
      ...(client.email ? [{ type: 'row', label: 'E-mail', value: client.email }] : []),
      { type: 'row', label: 'Abonnement', value: s.name },
      { type: 'row', label: 'Prijs per maand', value: money(s.pricePerMonth || 0) },
      { type: 'row', label: 'Looptijd', value: s.months ? (s.months === 1 ? '1 maand' : s.months + ' maanden') : 'doorlopend' },
      { type: 'row', label: 'Ingangsdatum', value: fmtDateLong(s.startDate) },
      ...(end ? [{ type: 'row', label: 'Einddatum', value: fmtDateLong(end) }] : []),
      ...(s.sessionsPerWeek ? [{ type: 'row', label: 'Sessies per week', value: fmtNum(s.sessionsPerWeek) }] : []),
      ...(s.noticeMonths ? [{ type: 'row', label: 'Opzegtermijn', value: s.noticeMonths === 1 ? '1 maand' : s.noticeMonths + ' maanden' }] : []),
      ...(s.fields || []).filter((f) => f.value).map((f) => ({ type: 'row', label: f.label, value: f.value })),
    ];
    if (s.terms) blocks.push({ type: 'head', text: 'Voorwaarden' }, { type: 'para', text: s.terms });
    if (items.length) {
      blocks.push({ type: 'head', text: 'Handtekeningen' }, { type: 'signatures', items });
      blocks.push({ type: 'sub', text: `Ondertekend op ${fmtDateLong((sig.signedAt || '').slice(0, 10))}.` });
    }
    return pdfAssemble(pdfLayout(blocks, images.length), images);
  }

        + `Hierbij de ondertekende trainingsovereenkomst voor ${s.name}, ingaand op ${fmtDateLong(s.startDate)}.\n\n`
        + `Groet,\n${(s.signature || {}).coachName || db.settings.coachName || ''}`;
      const build = async () => {
        const blob = await contractPdf(s, c);
        return new File([blob], contractFileName(s, c), { type: 'application/pdf' });
      };
      const download = (file) => {
        const url = URL.createObjectURL(file);
        const a = document.createElement('a');
        a.href = url;
        a.download = file.name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      };
      const mailBtn = document.getElementById('sub-mail');
      if (mailBtn) mailBtn.addEventListener('click', async () => {
        if (!c.email) { msg.textContent = 'Deze klant heeft nog geen e-mailadres op zijn profiel.'; return; }
        mailBtn.disabled = true;
        msg.textContent = 'Versturen…';
        try {
          const file = await build();
          await cloud.invoke('send-contract', {
            to: c.email,
            subject: `Trainingsovereenkomst — ${c.name}`,
            text: mailBody(),
            filename: file.name,
            pdf: await blobBase64(file),
            copyTo: db.settings.mailCopy ? cloud.userEmail() : '',
          });
          s.sentAt = new Date().toISOString();
          save(); render();
        } catch (e) {
          msg.textContent = mailError(e);
          mailBtn.disabled = false;
        }
      });
      pdfBtn.addEventListener('click', async () => {
        msg.textContent = 'PDF maken…';
        try { download(await build()); msg.textContent = 'PDF opgeslagen.'; }
        catch (e) { msg.textContent = 'PDF maken mislukt: ' + e.message; }
      });
      sendBtn.addEventListener('click', async () => {
        msg.textContent = 'PDF maken…';
        let file;
        try { file = await build(); }
        catch (e) { msg.textContent = 'PDF maken mislukt: ' + e.message; return; }
        const subject = `Trainingsovereenkomst — ${c.name}`;
        const body = mailBody();
        // a PWA cannot send mail itself; hand the file to the tablet's share sheet
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: subject, text: body });
            s.sentAt = new Date().toISOString();
            save(); render();
            return;
          } catch (e) {
            if (e && e.name === 'AbortError') { msg.textContent = 'Versturen afgebroken.'; return; }
          }
        }
        // no share sheet: save the PDF and open a prefilled mail to attach it to
        download(file);
        const to = c.email ? encodeURIComponent(c.email) : '';
        location.href = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        s.sentAt = new Date().toISOString();
        save();
        msg.textContent = 'PDF opgeslagen en mail geopend — voeg het bestand toe als bijlage.';
      });
    }
    const cancelBtn = document.getElementById('sub-cancel');
    if (cancelBtn) cancelBtn.addEventListener('click', () => {
      const per = s.noticeMonths || 0;
      const until = addMonths(todayIso(), per);
      const term = per === 1 ? '1 maand' : `${per} maanden`;
      if (!confirm(`Opzeggen? Met ${term} opzegtermijn loopt het abonnement door tot ${fmtDate(until)}.`)) return;
      s.status = 'opgezegd';
      s.endDate = until;
      save(); render();
    });
  }

  // a finger on a tablet is the signature; keep it dark on white so it also prints
  function signaturePad(canvasId) {
    const cv = document.getElementById(canvasId);
    if (!cv) return null;
    const ctx = cv.getContext('2d');
    const scale = Math.min(2, window.devicePixelRatio || 1);
    const box = cv.getBoundingClientRect();
    cv.width = Math.max(1, Math.round(box.width * scale));
    cv.height = Math.max(1, Math.round(box.height * scale));
    ctx.scale(scale, scale);
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#111111';
    let drawing = false;
    let inked = false;
    const at = (ev) => {
      const r = cv.getBoundingClientRect();
      return [ev.clientX - r.left, ev.clientY - r.top];
    };
    cv.addEventListener('pointerdown', (ev) => {
      drawing = true;
      cv.setPointerCapture(ev.pointerId);
      const [x, y] = at(ev);
      ctx.beginPath();
      ctx.moveTo(x, y);
    });
    cv.addEventListener('pointermove', (ev) => {
      if (!drawing) return;
      ev.preventDefault();
      const [x, y] = at(ev);
      ctx.lineTo(x, y);
      ctx.stroke();
      inked = true;
    });
    const stop = () => { drawing = false; };
    cv.addEventListener('pointerup', stop);
    cv.addEventListener('pointercancel', stop);
    cv.addEventListener('pointerleave', stop);
    return {
      clear: () => { ctx.clearRect(0, 0, cv.width, cv.height); inked = false; },
      // shrink before storing: signatures ride along in every sync
      data: () => {
        if (!inked) return null;
        const w = 420;
        const out = document.createElement('canvas');
        out.width = w;
        out.height = Math.round((cv.height / cv.width) * w);
        out.getContext('2d').drawImage(cv, 0, 0, out.width, out.height);
        return out.toDataURL('image/png');
      },
    };
  }

        ? `<hr class="divider"><div class="card">
            <div class="title">Standaardlijst</div>
            <p class="sub">Voeg circa 50 gangbare oefeningen toe, netjes ingedeeld op spiergroep en materiaal. Je kunt ze altijd archiveren.</p>
            <button id="lib-starter">Standaardlijst toevoegen</button>
          </div>` : '');

    bindNav();
    const qIn = document.getElementById('lib-q');
    qIn.addEventListener('input', () => {
      uiState.libQuery = qIn.value;
      const pos = qIn.selectionStart;
      render();
      const again = document.getElementById('lib-q');
      again.focus();
      again.setSelectionRange(pos, pos);
    });
    document.getElementById('lib-kind').addEventListener('change', (ev) => { uiState.libKind = ev.target.value; render(); });
    document.getElementById('lib-equip').addEventListener('change', (ev) => { uiState.libEquipment = ev.target.value; render(); });
    document.getElementById('lib-sort').addEventListener('change', (ev) => { uiState.libSort = ev.target.value; render(); });
    document.getElementById('lib-archived').addEventListener('click', () => { uiState.libShowArchived = !uiState.libShowArchived; render(); });
    const libClear = document.getElementById('lib-clear');
    if (libClear) libClear.addEventListener('click', () => {
      uiState.libQuery = ''; uiState.libKind = ''; uiState.libEquipment = '';
      render();
    });
    const libDrop = document.getElementById('lib-drop-import');
    if (libDrop) libDrop.addEventListener('click', () => {
      const unused = db.exercises.filter((e) => e.fromCatalog && !exerciseUsage(e.name).sessions);
      if (!unused.length) { alert('Er staat niets ongebruikts uit de fotolijst meer in.'); return; }
      if (!confirm(`${unused.length} ongebruikte oefeningen uit de fotolijst verwijderen? Wat je hebt getraind blijft staan.`)) return;
      const drop = new Set(unused.map((e) => e.id));
      db.exercises = db.exercises.filter((e) => !drop.has(e.id));
      save(); render();
    });
    document.getElementById('lib-add-toggle').addEventListener('click', () => {
      uiState.libEditing = uiState.libEditing === 'new' ? null : 'new';
      render();
    });
    document.getElementById('lib-new').addEventListener('submit', (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const name = String(f.get('name')).trim();
      if (!name) return;
      if (exerciseByName(name)) { alert('Deze oefening bestaat al.'); return; }
      const rec = ensureExercise(name, String(f.get('kind')));
      rec.group = String(f.get('group'));
      rec.equipment = String(f.get('equipment'));
      uiState.libEditing = null;
      save(); render();
    });
    document.querySelectorAll('[data-edit]').forEach((b) => b.addEventListener('click', () => {
      uiState.libEditing = b.dataset.edit; render();
    }));
    document.querySelectorAll('[data-cancel-edit]').forEach((b) => b.addEventListener('click', () => {
      uiState.libEditing = null; render();
    }));
    document.querySelectorAll('[data-archive]').forEach((b) => b.addEventListener('click', () => {
      const rec = exerciseById(b.dataset.archive);
      rec.archived = !rec.archived;
      uiState.libEditing = null;
      save(); render();
    }));
    document.querySelectorAll('[data-edit-form]').forEach((form) => form.addEventListener('submit', (ev) => {
      ev.preventDefault();
      const rec = exerciseById(form.dataset.editForm);
      const f = new FormData(form);
      const newName = String(f.get('name')).trim();
      if (newName && exKey(newName) !== exKey(rec.name)) {
        const res = renameExercise(rec.id, newName);
        if (!res.ok) { alert(res.reason); return; }
      }
      rec.kind = String(f.get('kind'));
      rec.group = String(f.get('group'));
      rec.equipment = String(f.get('equipment'));
      rec.restSeconds = num(f.get('rest')) > 0 ? num(f.get('rest')) : null;
      rec.progressStep = num(f.get('progressStep')) > 0 ? num(f.get('progressStep')) : null;
      rec.instructions = String(f.get('instructions')).trim();
      rec.cues = String(f.get('cues')).trim();
      rec.videoUrl = safeUrl(f.get('videoUrl'));
      rec.imageUrl = safeUrl(f.get('imageUrl'));
      rec.aliases = String(f.get('aliases')).split(',').map((a) => a.trim()).filter(Boolean);
      db.muscleGroups[exKey(rec.name)] = rec.group;
      uiState.libEditing = null;
      save(); render();
    }));
    document.querySelectorAll('[data-merge]').forEach((b) => b.addEventListener('click', () => {
      const sourceId = b.dataset.merge;
      const targetId = document.querySelector(`[data-merge-target="${sourceId}"]`).value;
      if (!targetId) { alert('Kies eerst een oefening om in op te gaan.'); return; }
      const src = exerciseById(sourceId), dst = exerciseById(targetId);
      const n = usageOf(src.name).sessions;
      if (!confirm(`"${src.name}" samenvoegen met "${dst.name}"? ${n} sessie${n === 1 ? '' : 's'} worden overgezet. Dit kun je niet ongedaan maken.`)) return;
      const res = mergeExercises(sourceId, targetId);
      if (!res.ok) { alert(res.reason); return; }
      uiState.libEditing = null;
      render();
    }));
    const starter = document.getElementById('lib-starter');
    if (starter) starter.addEventListener('click', () => {
      const n = addStarterExercises();
      alert(`${n} oefeningen toegevoegd.`);
      render();
    });
  }

    });
    const shareUpdate = document.getElementById('share-update');
    if (shareUpdate) shareUpdate.addEventListener('click', async () => {
      try { await shareClient(clientId); alert('Bijgewerkt.'); }
      catch (e) { alert('Bijwerken mislukt: ' + e.message); }
    });
    const shareCopy = document.getElementById('share-copy');
    if (shareCopy) shareCopy.addEventListener('click', async () => {
      const input = document.getElementById('share-link');
      input.select();
      try { await navigator.clipboard.writeText(input.value); shareCopy.textContent = 'Gekopieerd'; }
      catch { document.execCommand('copy'); }
    });
    const shareStop = document.getElementById('share-stop');
    if (shareStop) shareStop.addEventListener('click', async () => {
      if (!confirm('Stoppen met delen? De link werkt daarna niet meer.')) return;
      await stopSharing(clientId);
      render();
    });
    document.getElementById('archive-client').addEventListener('click', () => {
      c.archived = !c.archived;
      save(); render();
    });
    document.getElementById('delete-client').addEventListener('click', () => {
      if (!confirm(`${c.name} en alle bijbehorende schema's en trainingen verwijderen?`)) return;
      db.clients = db.clients.filter((x) => x.id !== clientId);
      db.schemas = db.schemas.filter((x) => x.clientId !== clientId);
      db.workouts = db.workouts.filter((w) => w.clientId !== clientId);
      db.duos = db.duos.filter((d) => !d.clientIds.includes(clientId));
      db.measurements = db.measurements.filter((m) => m.clientId !== clientId);
      save(); location.hash = '/';
    });
  }

  // --- nutrition diary, modelled on how the mainstream nutrition apps work ---
  function viewNutrition(clientId, date) {
    const c = clientById(clientId);
    if (!c) { location.hash = '/'; return; }
    const plan = planOf(clientId);
    const meals = mealsOn(clientId, date);
    const totals = dayTotals(clientId, date);
    const rem = remainingKcal(clientId, date);
    const week = nutritionAverages(clientId, 7);
    const suggestion = suggestPlan(clientId);
    const water = waterOn(clientId, date);
    const waterTarget = db.settings.waterTargetMl || 2000;
    const freq = frequentFoods(clientId);
    const ui = uiState.nutri;

    const macroLine = () => MACROS.filter((m) => m.key !== 'kcal').map((m) => {
      const value = totals[m.key];
      const target = plan ? plan[m.key] : 0;
      const pct = target > 0 ? Math.min(100, Math.round((value / target) * 100)) : 0;
      return `<div class="bar-row">
        <span>${m.label}</span>
        <span class="track"><span class="fill" style="width:${pct}%"></span></span>
        <span class="val">${Math.round(value)}${target ? ' / ' + Math.round(target) : ''} ${m.unit}</span>
      </div>`;
    }).join('');

    const mealGroup = (moment) => {
      const items = meals.filter((m) => m.moment === moment);
      const kcal = items.reduce((t, m) => t + (m.kcal || 0), 0);
      return `<div class="card">
        <div class="row" style="margin-bottom:6px">
          <div class="title grow">${moment}</div>
          <div class="mut">${Math.round(kcal)} kcal</div>
          <button class="small" data-add-to="${moment}">+</button>
        </div>
        ${items.length ? items.map((m) => `<div class="row" style="margin-bottom:4px">
            <div class="grow">
              <div class="sub">${esc(m.name)}${m.amount ? ` <span class="mut">${fmtNum(m.amount)}${m.per === 'portie' ? '×' : ' g'}</span>` : ''}</div>

  // --- data that clients logged themselves ---
  // put this client's schemas where their sporter app can read them; replaces what was there
  async function publishSchemas(localClient, cloudClientId) {
    const prog = programOf(localClient.id);
    const ordered = prog
      ? prog.schemaIds.map(schemaById).filter(Boolean)
      : schemasOf(localClient.id);
    const rows = ordered.map((sc, i) => ({
      client_id: cloudClientId,
      coach_id: cloud.userId(),
      name: sc.name,
      day_order: i,
      exercises: sc.exercises.map((e) => ({
        name: e.name,
        kind: e.kind || kindFor(localClient.id, e.name),
        // the client's app has no settings screen, so send your rest time along
        rest: restFor(e.name),
        targets: (e.targets || []).map((t) => ({ ...t })),
      })),
    }));
    await cloud.remove('client_schemas', `client_id=eq.${cloudClientId}`);
    if (rows.length) await cloud.insert('client_schemas', rows);
    if (localClient.cloudId !== cloudClientId) { localClient.cloudId = cloudClientId; save(); }
    return rows.length;
  }

  // the coming weeks of this client's agenda, so they can see when they are expected
  async function publishAppointments(localClient, cloudClientId) {
    const from = todayIso();
    const until = addDays(from, 56);
    const rows = db.appointments
      .filter((a) => a.date >= from && a.date <= until && apptClientIds(a).includes(localClient.id))
      .sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')))
      .map((a) => ({
        client_id: cloudClientId,
        coach_id: cloud.userId(),
        date: a.date,
        time: a.time || '',
        duration_min: a.durationMin || null,
        status: a.status || 'gepland',
        note: a.note || '',
      }));
    // the table only exists once the extra SQL was run; skip quietly if it is not there
    try {
      await cloud.remove('client_appointments', `client_id=eq.${cloudClientId}`);
      if (rows.length) await cloud.insert('client_appointments', rows);
      return rows.length;
    } catch (e) {
      if (/client_appointments|not exist|schema cache/i.test(e.message)) return null;
      throw e;
    }
  }

          const pick = document.getElementById('link-client').value;
          const target = db.clients.find((c) => c.id === pick);
          if (!target) { alert('Kies eerst een klant.'); return; }
          db.clients.forEach((c) => { if (c.cloudId === active.id) delete c.cloudId; });
          target.cloudId = active.id;
          save();
          render();
        });
        const unlink = document.getElementById('unlink-client');
        if (unlink) unlink.addEventListener('click', () => {
          db.clients.forEach((c) => { if (c.cloudId === active.id) delete c.cloudId; });
          if (localClient) localClient.cloudId = '__none__'; // stops the name match until a new pick
          save();
          render();
        });
        const pushBtn = document.getElementById('push-schemas');
        if (pushBtn) pushBtn.addEventListener('click', async () => {
          pushBtn.disabled = true;
          pushBtn.textContent = 'Bezig…';
          try {
            const n = await publishSchemas(localClient, active.id);
            const appts = await publishAppointments(localClient, active.id);
            const agendaLine = appts === null
              ? '\n\nAfspraken zijn niet meegestuurd: de tabel client_appointments bestaat nog niet (zie SUPABASE.md).'
              : `\n\nOok ${appts} ${appts === 1 ? 'afspraak' : 'afspraken'} uit je agenda meegestuurd.`;
            alert(`${n} schema${n === 1 ? '' : "'s"} klaargezet voor ${active.name || 'deze klant'}.${agendaLine}`);
          } catch (e) {
            alert('Klaarzetten mislukt: ' + e.message);
          }
          pushBtn.disabled = false;
          pushBtn.textContent = 'Klaarzetten';
        });
        document.querySelectorAll('[data-import]').forEach((b) => b.addEventListener('click', () => {
          const day = byDate.get(b.dataset.import);
          if (!day || !localClient) return;
          let added = 0;
          for (const w of day.workouts) {
            const entries = (w.entries || [])
              .map((e) => ({
                name: e.name, exerciseId: ensureExercise(e.name, e.kind || 'kracht').id,
                kind: e.kind || 'kracht', superset: null,
                sets: (e.sets || []).filter((x) => filledSet(x, e.kind || 'kracht')),
              }))
              .filter((e) => e.sets.length);
            if (!entries.length) continue;
            if (db.workouts.some((x) => x.clientId === localClient.id && x.date === w.date && x.fromCloudId === w.id)) continue;
            db.workouts.push({
              id: uid(), clientId: localClient.id, schemaId: null, date: w.date,
              notes: w.notes || '', durationMin: w.duration_min || undefined,
              fromCloudId: w.id, coach: 'klant zelf', entries,
            });
            added++;
          }
          save();
          alert(added ? `${added} training${added === 1 ? '' : 'en'} overgenomen in ${localClient.name}.` : 'Deze training stond er al in.');
          render();
        }));
      } catch (e) {
        $app.innerHTML = topbar('Van klanten', '/') + `<p class="mut">Ophalen mislukt: ${esc(e.message)}</p>`;
        bindNav();
      }
    })();
  }

    }), { sessions: 0, sets: 0, prs: 0, minutes: 0 });
    const streak = weekStreak(clientId);
    const groups = groupTotals(clientId, period);
    const maxMinutes = Math.max(1, ...groups.map((g) => g.minutes));
    const maxSets = Math.max(1, ...groups.map((g) => g.sets));
    const barPct = (g) => Math.round(100 * (g.sets ? g.sets / maxSets : g.minutes / maxMinutes));

    // attendance: last 12 weeks of days
    const days = [];
    const trained = new Set(workoutsOf(clientId).map((w) => w.date));
    const cursor = new Date();
    cursor.setDate(cursor.getDate() - ((cursor.getDay() + 6) % 7) + 6); // end of this week (sunday)

      </table></div>
      <div class="eyebrow">Sets per maand</div>
      <div class="card"><div class="chart-wrap" id="month-chart"></div></div>` : `<p class="mut">Nog geen trainingen in deze periode.</p>`) +

      `<div class="eyebrow">Aanwezigheid (12 weken)</div>

        <div class="cal">${['m', 'd', 'w', 'd', 'v', 'z', 'z'].map((d) => `<div class="head">${d}</div>`).join('')}

          <span class="val">${g.sets ? g.sets + ' sets' : fmtNum(g.minutes) + ' min'}</span>

  // --- printable client report ---
  function viewReport(clientId) {
    const c = clientById(clientId);
    if (!c) { location.hash = '/'; return; }
    const period = uiState.period;
    const months = monthlyStats(clientId, period);
    const totals = months.reduce((t, m) => ({ sessions: t.sessions + m.sessions, sets: t.sets + m.sets, prs: t.prs + m.prs }), { sessions: 0, sets: 0, prs: 0 });
    const exercises = loggedExercises(clientId).map((name) => {
      const ss = exerciseSessions(clientId, name).filter((s) => inPeriod(s.date, period));
      if (!ss.length) return null;
      const kind = ss[ss.length - 1].kind || 'kracht';
      const repsOnly = kind === 'lichaamsgewicht' && ss.every((s) => !s.extra);
      const topOf = (s) => repsOnly ? s.bestReps : s.top;
      const fmt = kind === 'cardio' ? (v) => fmtNum(v) + ' km' : repsOnly ? (v) => `${Math.round(v)} herh.` : fmtKg;
      const best = Math.max(...ss.map(topOf));
      const delta = topOf(ss[ss.length - 1]) - topOf(ss[0]);
      return { name, kind, sessions: ss.length, best: fmt(best), first: fmt(topOf(ss[0])), last: fmt(topOf(ss[ss.length - 1])), delta: (delta > 0 ? '+' : '') + fmt(delta), up: delta > 0 };
    }).filter(Boolean);
    const meas = db.measurements.filter((m) => m.clientId === clientId && inPeriod(m.date, period)).sort((a, b) => a.date.localeCompare(b.date));

      `<div class="eyebrow">Progressie per oefening</div>

        <thead><tr><th>Oefening</th><th class="num">Sessies</th><th class="num">Beste</th><th class="num">Verloop</th></tr></thead>
        <tbody>${exercises.map((e) => `<tr>
          <td>${esc(e.name)}</td>
          <td class="num">${e.sessions}</td>
          <td class="num">${esc(e.best)}</td>
          <td class="num"><span class="${e.up ? 'delta up' : 'mut'}">${esc(e.first)} → ${esc(e.last)} (${esc(e.delta)})</span></td>
        </tr>`).join('') || '<tr><td colspan="4">Geen trainingen in deze periode.</td></tr>'}</tbody>
      </table></div>` +
      (meas.length ? `<div class="eyebrow">Metingen</div>
      <div class="card table-wrap"><table class="data">
        <thead><tr><th>Datum</th>${MEAS_FIELDS.map((f) => `<th class="num">${f.label}</th>`).join('')}</tr></thead>
        <tbody>${meas.map((m) => `<tr><td>${esc(fmtDate(m.date))}</td>${MEAS_FIELDS.map((f) =>
          `<td class="num">${m[f.key] != null ? esc(fmtNum(m[f.key]) + ' ' + f.unit()) : '–'}</td>`).join('')}</tr>`).join('')}</tbody>

  // --- exercise progress page ---
  function viewExercise(clientId, encName) {
    const c = clientById(clientId);
    if (!c) { location.hash = '/'; return; }
    const wanted = decodeURIComponent(encName).toLowerCase();
    const name = loggedExercises(clientId).find((n) => n.toLowerCase() === wanted);
    if (!name) { location.hash = `/klant/${clientId}`; return; }
    const allSessions = exerciseSessions(clientId, name);
    const sessions = allSessions.filter((s) => inPeriod(s.date, uiState.period));
    if (!sessions.length) {
      $app.innerHTML = topbar(name, `/klant/${clientId}`) + periodBar() +
        `<div class="empty"><p>Geen sessies in deze periode.</p></div>`;
      bindNav(); bindPeriodBar();
      return;
    }
    const first = sessions[0], last = sessions[sessions.length - 1];

    const kind = last.kind || 'kracht';
    const cfg = {
      kracht: {
        metrics: { top: 'Zwaarste set', e1rm: 'Geschat 1RM' },
        fmt: fmtKg, unit: 'kg',
        lineTitle: 'Gewicht per training',
        prLabel: 'PR · zwaarste set', pr2Label: 'PR · geschat 1RM', pr2: (ss) => fmtKg(Math.max(...ss.map((x) => x.e1rm))), pr2Note: 'Epley-formule',
      },
      lichaamsgewicht: {
        metrics: { extra: 'Extra gewicht', bestReps: 'Beste set (herh.)' },
        fmt: fmtKg, unit: 'kg',
        lineTitle: 'Belasting per training',
        barKey: 'totalReps', barUnit: 'herh.', barTitle: 'Totaal herhalingen per training',
        barNote: 'Som van alle herhalingen per training.',
        prLabel: 'PR · extra gewicht', pr2Label: 'PR · meeste herhalingen', pr2: (ss) => `${Math.max(...ss.map((x) => x.bestReps))} herh.`, pr2Note: 'beste set',
      },
      cardio: {
        metrics: { distance: 'Afstand (km)', pace: 'Tempo (min/km)' },
        fmt: (v) => fmtNum(v) + ' km', unit: 'km',
        lineTitle: 'Afstand en tempo',
        barKey: 'minutes', barUnit: 'min', barTitle: 'Tijd per training',
        barNote: 'Totale tijd per training in minuten.',
        prLabel: 'PR · langste afstand', pr2Label: 'PR · beste tempo',
        pr2: (ss) => { const p = ss.filter((x) => x.pace > 0); return p.length ? fmtNum(Math.min(...p.map((x) => x.pace))) + ' min/km' : '—'; }, pr2Note: 'min per km',
      },
    }[kind];

    const metricKeys = Object.keys(cfg.metrics);
    if (!metricKeys.includes(uiState.metric)) uiState.metric = metricKeys[0];
    // bodyweight work without added weight: progress is in reps, not kilos
    const repsOnly = kind === 'lichaamsgewicht' && sessions.every((s) => !s.extra);
    if (repsOnly) {
      cfg.fmt = (v) => `${Math.round(v)} herh.`;
      cfg.prLabel = 'PR · meeste herhalingen';
      cfg.pr2Label = 'Meeste herhalingen in één sessie';
      cfg.pr2 = (ss) => `${Math.max(...ss.map((x) => x.totalReps))} herh.`;
      cfg.pr2Note = 'alle sets samen';
      if (uiState.metric === 'extra') uiState.metric = 'bestReps';
    }
    const topOf = (s) => repsOnly ? s.bestReps : s.top;
    const prTop = Math.max(...sessions.map(topOf));
    const prDate = sessions.find((s) => topOf(s) === prTop).date;
    const delta = topOf(last) - topOf(first);
    const deltaCls = delta > 0 ? 'up' : delta < 0 ? 'down' : '';
    const deltaSign = delta > 0 ? '+' : '';
    const deltaPct = topOf(first) > 0 ? ` (${deltaSign}${Math.round((delta / topOf(first)) * 100)}%)` : '';
    const lineUnit = uiState.metric === 'pace' ? 'min/km' : uiState.metric === 'bestReps' ? 'herh.' : cfg.unit;

    $app.innerHTML = topbar(name, `/klant/${clientId}`) +
      `<div class="row no-print" style="margin-bottom:12px">
        <span class="mg-dot" style="background:${groupColour(name, kind)}"></span>
        <span class="mut">Spiergroep</span>
        <select id="mg-select" style="max-width:200px">
          ${MUSCLE_GROUPS.map((g) => `<option value="${g}" ${groupOf(name, kind) === g ? 'selected' : ''}>${g}</option>`).join('')}
        </select>
        ${kind !== 'kracht' ? `<span class="badge">${KIND_LABELS[kind]}</span>` : ''}
      </div>` +
      periodBar() +
      `<div class="card">
        <div class="row" style="margin-bottom:8px"><div class="title grow">Uitleg</div>
          <button class="small ghost no-print" data-nav="/bibliotheek">Bibliotheek ›</button></div>
        ${exerciseInfoHtml(name, clientId)}
        <label class="field no-print" style="margin:10px 0 0"><span>Technieknotitie voor ${esc(c.name)}</span>
          <textarea id="client-note" rows="2" placeholder="bijv. let op onderrug bij de laatste herhalingen">${esc(clientNote(clientId, name))}</textarea></label>
        <button type="button" class="small no-print" id="save-note">Notitie opslaan</button>
      </div>` +
      `<div class="stat-grid cols2">
        <div class="stat"><div class="lbl">${cfg.prLabel}</div><div class="val">${esc(cfg.fmt(prTop))}</div><div class="mut">op ${esc(fmtDateFull(prDate))}</div></div>
        <div class="stat"><div class="lbl">${cfg.pr2Label}</div><div class="val">${esc(cfg.pr2(sessions))}</div><div class="mut">${cfg.pr2Note}</div></div>
        <div class="stat"><div class="lbl">Laatst gedaan</div><div class="val">${esc(fmtDate(last.date))}</div><div class="mut">${sessions.length} sessie${sessions.length === 1 ? '' : 's'} sinds ${esc(fmtDate(first.date))}</div></div>
        <div class="stat"><div class="lbl">Totale progressie</div><div class="val">${deltaSign}${esc(cfg.fmt(delta))}</div><div class="delta ${deltaCls}">${esc(cfg.fmt(topOf(first)))} → ${esc(cfg.fmt(topOf(last)))}${deltaPct}</div></div>
      </div>` +

      `<div class="eyebrow">${cfg.lineTitle}</div>
      <div class="card">
        <div class="seg" role="group" aria-label="Meetwaarde">
          ${metricKeys.map((m) => `<button data-metric="${m}" aria-pressed="${uiState.metric === m}">${cfg.metrics[m]}</button>`).join('')}
        </div>
        <div class="chart-wrap" id="line-chart" style="margin-top:12px"></div>
        <p class="mut" style="margin:6px 0 0">${uiState.metric === 'e1rm' ? 'Geschat 1RM via de Epley-formule op basis van de beste set.' : cfg.metrics[uiState.metric] + ' per training.'} Warming-upsets tellen niet mee.</p>
      </div>` +

      (cfg.barKey ? `<div class="eyebrow">${cfg.barTitle}</div>
      <div class="card">
        <div class="chart-wrap" id="bar-chart"></div>
        <p class="mut" style="margin:6px 0 0">${cfg.barNote}</p>
      </div>` : '') +

      `<div class="eyebrow">Alle sessies</div><div class="cards-2">` +
      [...sessions].reverse().map((s) => `<div class="card">
        <div class="row"><div class="grow">
          <div class="title">${esc(fmtDateFull(s.date))} ${s.isPr ? '<span class="badge pr">🏆 PR</span>' : ''}</div>
          <div class="sub">${s.sets.map((st) => setText(st, kind) + (st.rir != null ? ` <span class="mut">RIR ${st.rir}</span>` : '')).join(' · ')}</div>
        </div>
        <div class="mut" style="font-variant-numeric:tabular-nums">${esc(cfg.fmt(topOf(s)))}</div></div>
      </div>`).join('') + '</div>';

    bindNav();
    bindPeriodBar();
    document.getElementById('mg-select').addEventListener('change', (ev) => { setGroup(name, ev.target.value); render(); });
    document.getElementById('save-note').addEventListener('click', () => {
      setClientNote(clientId, name, document.getElementById('client-note').value);
      render();
    });
    const linePts = sessions
      .map((s) => ({ date: s.date, value: s[uiState.metric] }))
      .filter((p) => Number.isFinite(p.value) && p.value > 0);
    const lineBox = document.getElementById('line-chart');
    if (linePts.length) renderChart(lineBox, linePts, lineUnit);
    else lineBox.innerHTML = '<p class="mut">Nog geen waarden voor deze meetwaarde.</p>';
    if (cfg.barKey) {
      renderBarChart(document.getElementById('bar-chart'), sessions.map((s) => ({ date: s.date, value: s[cfg.barKey] || 0 })), cfg.barUnit);
    }
    document.querySelectorAll('[data-metric]').forEach((b) => b.addEventListener('click', () => {
      uiState.metric = b.dataset.metric; render();
    }));
  }

  // --- free workout: pick exercises for this session ---
  function viewPickExercises(clientId) {
    const c = clientById(clientId);
    if (!c) { location.hash = '/'; return; }
    const known = [...new Set([...knownExercises(clientId), ...libraryNames()])];
    const selected = new Set(pendingFree.filter((n) => known.some((k) => k.toLowerCase() === n.toLowerCase())));

    const paint = () => {
      $app.innerHTML = topbar('Vrije training', `/klant/${clientId}`) +
        `<p class="sub" style="margin:0 0 12px">Kies de oefeningen voor deze sessie — elke training kan anders zijn.</p>` +
        (known.length ? `<div class="chips">${known.map((n) =>
          `<button type="button" class="chip" data-ex-name="${esc(n)}" aria-pressed="${selected.has(n)}">${esc(n)}</button>`
        ).join('')}</div>` : '') +
        `<form class="card" id="new-ex" style="margin-top:16px">
          <label class="field"><span>Nieuwe oefening</span><input name="name" placeholder="bijv. Lat pulldown"></label>
          <button type="submit">+ Toevoegen en selecteren</button>
        </form>
        <button class="primary wide" id="start-free" ${selected.size ? '' : 'disabled'} style="margin-top:8px">Start training (${selected.size} oefening${selected.size === 1 ? '' : 'en'})</button>`;

      bindNav();
      document.querySelectorAll('[data-ex-name]').forEach((b) => b.addEventListener('click', () => {
        const n = b.dataset.exName;
        if (selected.has(n)) selected.delete(n); else selected.add(n);
        paint();
      }));
      document.getElementById('new-ex').addEventListener('submit', (ev) => {
        ev.preventDefault();
        const n = String(new FormData(ev.target).get('name')).trim();
        if (!n) return;
        if (!known.some((k) => k.toLowerCase() === n.toLowerCase())) known.push(n);
        selected.add(known.find((k) => k.toLowerCase() === n.toLowerCase()));
        paint();
      });
      document.getElementById('start-free').addEventListener('click', () => {
        pendingFree = known.filter((n) => selected.has(n));
        location.hash = `/klant/${clientId}/training/vrij`;
      });
    };
    paint();
  }

  // --- schema template editor (global, linkable to clients and duos) ---
  function viewTemplate(tid) {
    const isNew = tid === 'nieuw';
    const tpl = isNew ? { id: uid(), name: '', exercises: [] } : templateById(tid);
    if (!tpl) { location.hash = '/'; return; }
    const newTarget = () => ({ reps: 10, weight: 0 });
    const newExercise = () => ({ id: uid(), name: '', targets: [newTarget(), newTarget(), newTarget()] });
    const draft = JSON.parse(JSON.stringify(tpl));
    draft.exercises.forEach((e) => { if (!e.targets || !e.targets.length) e.targets = [newTarget(), newTarget(), newTarget()]; });
    if (!draft.exercises.length) draft.exercises.push(newExercise());

    const paint = () => {
      $app.innerHTML = topbar(isNew ? 'Nieuw sjabloon' : 'Sjabloon bewerken', '/') +
        `<p class="sub" style="margin:0 0 12px">Een sjabloon koppel je via de klant- of duo-pagina ("+ Schema uit sjabloon"); daar wordt het een eigen kopie die je per klant kunt aanpassen.</p>
        <form id="schema-form">
          <label class="field"><span>Naam sjabloon</span><input name="name" required placeholder="bijv. Full body beginner" value="${esc(draft.name)}"></label>
          <datalist id="lib-names">${libraryNames().map((n) => `<option value="${esc(n)}">`).join('')}</datalist>
          <div class="eyebrow">Oefeningen — elke set apart</div>
          ${draft.exercises.map((e, i) => `<div class="card">
            <div class="row" style="margin-bottom:8px">
              <input data-exname="${i}" class="grow" list="lib-names" required placeholder="bijv. Squat" value="${esc(e.name)}">
              <button type="button" class="small ghost" data-ex-up="${i}" aria-label="Omhoog" ${i === 0 ? 'disabled' : ''}>↑</button>
              <button type="button" class="small ghost" data-ex-down="${i}" aria-label="Omlaag" ${i === draft.exercises.length - 1 ? 'disabled' : ''}>↓</button>
              <button type="button" class="small danger ghost" data-rm-ex="${i}" aria-label="Verwijder oefening">✕</button>
            </div>
            <label class="field"><span>Soort</span>
              <select data-exkind="${i}">${Object.entries(KIND_LABELS).map(([k, l]) => `<option value="${k}" ${(e.kind || 'kracht') === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
            </label>
            ${targetRowsHtml(String(i), e.targets, e.kind || 'kracht', 'rm-tgt')}
            <button type="button" class="small" data-add-tgt="${i}">+ Set</button>
          </div>`).join('')}
          <button type="button" id="add-ex" class="small" style="margin:4px 0 16px">+ Oefening</button>
          <button class="primary wide" type="submit">Sjabloon opslaan</button>
        </form>` +
        (!isNew ? `<hr class="divider"><button class="danger ghost" id="del-template">Sjabloon verwijderen</button>` : '');

      bindNav();
      const syncDraft = () => {
        draft.name = document.querySelector('[name="name"]').value;
        document.querySelectorAll('[data-exname]').forEach((inp) => {
          draft.exercises[+inp.dataset.exname].name = inp.value;
        });
        document.querySelectorAll('[data-exkind]').forEach((sel) => {
          draft.exercises[+sel.dataset.exkind].kind = sel.value;
        });
        document.querySelectorAll('[data-tgt]').forEach((inp) => {
          const [i, si] = inp.dataset.tgt.split('.').map(Number);
          draft.exercises[i].targets[si][inp.dataset.f] = num(inp.value);
        });
      };
      document.querySelectorAll('[data-exkind]').forEach((sel) => sel.addEventListener('change', () => {
        syncDraft();
        paint();
      }));
      document.querySelectorAll('[data-ex-up], [data-ex-down]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        const up = b.dataset.exUp !== undefined;
        const i = +(up ? b.dataset.exUp : b.dataset.exDown);
        const to = up ? i - 1 : i + 1;
        if (to < 0 || to >= draft.exercises.length) return;
        [draft.exercises[i], draft.exercises[to]] = [draft.exercises[to], draft.exercises[i]];
        paint();
      }));
      document.getElementById('add-ex').addEventListener('click', () => {
        syncDraft();
        draft.exercises.push(newExercise());
        paint();
      });
      document.querySelectorAll('[data-rm-ex]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        draft.exercises.splice(+b.dataset.rmEx, 1);
        if (!draft.exercises.length) draft.exercises.push(newExercise());
        paint();
      }));
      document.querySelectorAll('[data-add-tgt]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        const targets = draft.exercises[+b.dataset.addTgt].targets;
        targets.push(targets.length ? { ...targets[targets.length - 1] } : newTarget());
        paint();
      }));
      document.querySelectorAll('[data-rm-tgt]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        const [i, si] = b.dataset.rmTgt.split('.').map(Number);
        draft.exercises[i].targets.splice(si, 1);
        if (!draft.exercises[i].targets.length) draft.exercises[i].targets.push(newTarget());
        paint();
      }));
      document.getElementById('schema-form').addEventListener('submit', (ev) => {
        ev.preventDefault();
        syncDraft();
        draft.name = draft.name.trim();
        draft.exercises = draft.exercises
          .filter((e) => e.name.trim())
          .map((e) => ({ id: e.id, name: e.name.trim(), kind: ensureExercise(e.name.trim(), e.kind || 'kracht').kind, targets: e.targets }));
        if (!draft.name || !draft.exercises.length) return;
        if (isNew) db.templates.push(draft);
        else db.templates[db.templates.findIndex((t) => t.id === tid)] = draft;
        save(); location.hash = `/sjabloon/${draft.id}`; render();
      });
      const del = document.getElementById('del-template');
      if (del) del.addEventListener('click', () => {
        if (!confirm('Dit sjabloon verwijderen? Reeds gekoppelde schema\'s blijven bestaan.')) return;
        db.templates = db.templates.filter((t) => t.id !== tid);
        save(); location.hash = '/';
      });
    };
    paint();
  }

  // --- pick a template to link as a schema for a client or duo ---
  function viewTemplatePick(kind, id) {
    const target = kind === 'klant' ? clientById(id) : duoById(id);
    if (!target) { location.hash = '/'; return; }
    const backHash = `/${kind}/${id}`;
    const title = kind === 'klant' ? `Schema uit sjabloon — ${target.name}` : `Duo-schema uit sjabloon — ${duoName(target)}`;

    $app.innerHTML = topbar(title, backHash) +
      (db.templates.length
        ? `<p class="sub" style="margin:0 0 12px">Kies een sjabloon; het wordt een eigen kopie die je daarna kunt aanpassen.</p>` +
          [...db.templates].sort((a, b) => byName(a.name, b.name)).map((t) => `<div class="card tappable" data-apply-tpl="${t.id}" role="button" tabindex="0">
            <div class="row"><div class="grow">
              <div class="title">${esc(t.name)}</div>
              <div class="sub">${t.exercises.map((e) => `${esc(e.name)} (${e.targets.length})`).join(' · ')}</div>
            </div><span class="mut">›</span></div>
          </div>`).join('')
        : `<div class="empty"><p>Nog geen sjablonen. Maak er eerst één via de zijbalk: Sjablonen → + Nieuw sjabloon.</p><button class="primary" data-nav="/sjabloon/nieuw">+ Nieuw sjabloon</button></div>`);

    bindNav();
    document.querySelectorAll('[data-apply-tpl]').forEach((el) => el.addEventListener('click', () => {
      const tpl = templateById(el.dataset.applyTpl);
      if (!tpl) return;
      if (kind === 'klant') {
        const schema = { id: uid(), clientId: id, name: tpl.name, exercises: copyExercises(tpl.exercises) };
        db.schemas.push(schema);
        save(); location.hash = `/klant/${id}/schema/${schema.id}`;
      } else {
        const plans = {};
        for (const cid of target.clientIds) plans[cid] = copyExercises(tpl.exercises);
        const schema = { id: uid(), duoId: id, name: tpl.name, plans };
        db.duoSchemas.push(schema);
        save(); location.hash = `/duo/${id}/schema/${schema.id}`;
      }
    }));
  }

  // --- duo page: members + duo session history ---
  function viewDuo(duoId) {
    const duo = duoById(duoId);
    const members = duo ? duo.clientIds.map(clientById) : [];
    if (!duo || members.some((m) => !m)) { location.hash = '/'; return; }

    const duoWorkouts = db.workouts.filter((w) => w.duoId === duoId);
    const dates = [...new Set(duoWorkouts.map((w) => w.date))].sort().reverse();

    $app.innerHTML = topbar(duoName(duo), '/') +
      draftResumeHtml(`/duo/${duoId}/training`) +
      `<div class="actions">` +
      duoSchemasOf(duoId).map((s) => `<button class="primary" data-nav="/duo/${duoId}/training/${s.id}">Start: ${esc(s.name)}</button>`).join('') +
      `<button class="primary" data-nav="/duo/${duoId}/vrij">+ Vrije duo-training</button></div>` +

      `<div class="eyebrow">Schema's</div>` +
      duoSchemasOf(duoId).map((s) => `<div class="card tappable" data-nav="/duo/${duoId}/schema/${s.id}" role="link" tabindex="0">
        <div class="row"><div class="grow">
          <div class="title">${esc(s.name)}</div>
          <div class="sub">${members.map((m) => `${esc(m.name)}: ${(s.plans[m.id] || []).map((e) => esc(e.name)).join(', ') || '—'}`).join(' · ')}</div>
        </div><span class="mut">›</span></div>
      </div>`).join('') +
      `<div class="actions" style="margin-top:2px"><button data-nav="/duo/${duoId}/schema/nieuw">+ Nieuw duo-schema</button><button data-nav="/duo/${duoId}/sjabloon">+ Schema uit sjabloon</button></div>` +

      `<div class="eyebrow">Leden</div>` +
      members.map((m) => {
        const ws = workoutsOf(m.id);
        const lastW = ws[ws.length - 1];
        return `<div class="card tappable" data-nav="/klant/${m.id}" role="link" tabindex="0">
          <div class="row"><div class="grow">
            <div class="title">${esc(m.name)}</div>
            <div class="sub">${ws.length} training${ws.length === 1 ? '' : 'en'}${lastW ? ' · laatste: ' + esc(fmtDate(lastW.date)) : ''} · schema's en progressie ›</div>
          </div><span class="mut">›</span></div>
        </div>`;
      }).join('') +

      `<div class="eyebrow">Deze maand</div>` +
      (() => {
        const month = todayIso().slice(0, 7);
        const rows = members.map((m) => {
          const ws = workoutsOf(m.id).filter((w) => w.date.slice(0, 7) === month);
          const sets = ws.reduce((t, w) => t + w.entries.reduce((x, e) => x + entrySetCount(e), 0), 0);
          let prs = 0;
          for (const name of loggedExercises(m.id)) {
            prs += exerciseSessions(m.id, name).filter((s) => s.isPr && s.date.slice(0, 7) === month).length;
          }
          return { name: m.name, sessions: ws.length, sets, prs };
        });
        const best = Math.max(...rows.map((r) => r.prs));
        return `<div class="card table-wrap"><table class="data">
          <thead><tr><th></th><th class="num">Trainingen</th><th class="num">Sets</th><th class="num">PR's</th></tr></thead>
          <tbody>${rows.map((r) => `<tr>
            <td>${esc(r.name)}${best > 0 && r.prs === best ? ' 🏆' : ''}</td>
            <td class="num">${r.sessions}</td>
            <td class="num">${r.sets}</td>
            <td class="num">${r.prs}</td>
          </tr>`).join('')}</tbody>
        </table></div>` +
        `<div class="eyebrow">Duo-trainingen</div>`;
      })() +
      (dates.length ? dates.slice(0, 20).map((date) => {
        const lines = duoWorkouts.filter((w) => w.date === date).map((w) => {
          const m = clientById(w.clientId);
          return `<div class="sub">${esc(m ? m.name : '?')}: ${w.entries.map((e) => esc(e.name)).join(', ')}</div>`;
        }).join('');
        return `<div class="card"><div class="title">${esc(fmtDateFull(date))}</div>${lines}</div>`;
      }).join('') : `<p class="mut">Nog geen duo-trainingen gelogd.</p>`) +

      `<hr class="divider">
      <button class="danger ghost" id="del-duo">Duo verwijderen</button>`;

    bindNav();
    bindDraftDiscard();
    document.getElementById('del-duo').addEventListener('click', () => {
      if (!confirm('Dit duo verwijderen? De klanten en hun trainingen blijven bewaard.')) return;
      db.duos = db.duos.filter((d) => d.id !== duoId);
      db.duoSchemas = db.duoSchemas.filter((s) => s.duoId !== duoId);
      save(); location.hash = '/';
    });
  }

  // --- duo schema editor: per member, per-set targets ---
  function viewDuoSchema(duoId, sid) {
    const duo = duoById(duoId);
    const members = duo ? duo.clientIds.map(clientById) : [];
    if (!duo || members.some((m) => !m)) { location.hash = '/'; return; }
    const isNew = sid === 'nieuw';
    const schema = isNew ? { id: uid(), duoId, name: '', plans: {} } : duoSchemaById(sid);
    if (!schema || schema.duoId !== duoId) { location.hash = `/duo/${duoId}`; return; }
    const newTarget = () => ({ reps: 10, weight: 0 });
    const newExercise = () => ({ id: uid(), name: '', targets: [newTarget(), newTarget(), newTarget()] });
    const draft = JSON.parse(JSON.stringify(schema));
    for (const m of members) {
      draft.plans[m.id] = (draft.plans[m.id] || []).map((e) => ({ ...e, targets: e.targets && e.targets.length ? e.targets : [newTarget(), newTarget(), newTarget()] }));
      if (!draft.plans[m.id].length) draft.plans[m.id].push(newExercise());
    }

    const paint = () => {
      $app.innerHTML = topbar(isNew ? 'Nieuw duo-schema' : 'Duo-schema bewerken', `/duo/${duoId}`) +
        `<form id="dschema-form">
          <label class="field"><span>Naam schema</span><input name="name" required placeholder="bijv. Duo full body" value="${esc(draft.name)}"></label>
          <div class="duo-cols">` +
          members.map((m, mi) =>
            `<div><datalist id="lib-names">${libraryNames().map((n) => `<option value="${esc(n)}">`).join('')}</datalist><div class="eyebrow">${esc(m.name)} — elke set apart</div>` +
            draft.plans[m.id].map((e, i) => `<div class="card">
              <div class="row" style="margin-bottom:8px">
                <input data-dexname="${mi}.${i}" class="grow" list="lib-names" required placeholder="bijv. Squat" value="${esc(e.name)}">
                <button type="button" class="small ghost" data-dex-up="${mi}.${i}" aria-label="Omhoog" ${i === 0 ? 'disabled' : ''}>↑</button>
                <button type="button" class="small ghost" data-dex-down="${mi}.${i}" aria-label="Omlaag" ${i === draft.plans[m.id].length - 1 ? 'disabled' : ''}>↓</button>
                <button type="button" class="small danger ghost" data-drm-ex="${mi}.${i}" aria-label="Verwijder oefening">✕</button>
              </div>
              <label class="field"><span>Soort</span>
                <select data-dexkind="${mi}.${i}">${Object.entries(KIND_LABELS).map(([k, l]) => `<option value="${k}" ${(e.kind || 'kracht') === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
              </label>
              ${targetRowsHtml(`${mi}.${i}`, e.targets, e.kind || 'kracht', 'drm-tgt')}
              <button type="button" class="small" data-dadd-tgt="${mi}.${i}">+ Set</button>
            </div>`).join('') +
            `<button type="button" class="small" data-dadd-ex="${mi}" style="margin:4px 0 16px">+ Oefening voor ${esc(m.name)}</button></div>`
          ).join('') +
          `</div>
          <button class="primary wide" type="submit">Duo-schema opslaan</button>
        </form>` +
        (!isNew ? `<hr class="divider"><button class="danger ghost" id="del-dschema">Duo-schema verwijderen</button>` : '');

      bindNav();
      const planOf = (mi) => draft.plans[members[mi].id];
      const syncDraft = () => {
        draft.name = document.querySelector('[name="name"]').value;
        document.querySelectorAll('[data-dexname]').forEach((inp) => {
          const [mi, i] = inp.dataset.dexname.split('.').map(Number);
          planOf(mi)[i].name = inp.value;
        });
        document.querySelectorAll('[data-dexkind]').forEach((sel) => {
          const [mi, i] = sel.dataset.dexkind.split('.').map(Number);
          planOf(mi)[i].kind = sel.value;
        });
        document.querySelectorAll('[data-tgt]').forEach((inp) => {
          const [mi, i, si] = inp.dataset.tgt.split('.').map(Number);
          planOf(mi)[i].targets[si][inp.dataset.f] = num(inp.value);
        });
      };
      document.querySelectorAll('[data-dexkind]').forEach((sel) => sel.addEventListener('change', () => {
        syncDraft();
        paint();
      }));
      document.querySelectorAll('[data-dex-up], [data-dex-down]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        const up = b.dataset.dexUp !== undefined;
        const [mi, i] = (up ? b.dataset.dexUp : b.dataset.dexDown).split('.').map(Number);
        const list = planOf(mi);
        const to = up ? i - 1 : i + 1;
        if (to < 0 || to >= list.length) return;
        [list[i], list[to]] = [list[to], list[i]];
        paint();
      }));
      document.querySelectorAll('[data-dadd-ex]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        planOf(+b.dataset.daddEx).push(newExercise());
        paint();
      }));
      document.querySelectorAll('[data-drm-ex]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        const [mi, i] = b.dataset.drmEx.split('.').map(Number);
        planOf(mi).splice(i, 1);
        if (!planOf(mi).length) planOf(mi).push(newExercise());
        paint();
      }));
      document.querySelectorAll('[data-dadd-tgt]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        const [mi, i] = b.dataset.daddTgt.split('.').map(Number);
        const targets = planOf(mi)[i].targets;
        targets.push(targets.length ? { ...targets[targets.length - 1] } : newTarget());
        paint();
      }));
      document.querySelectorAll('[data-drm-tgt]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        const [mi, i, si] = b.dataset.drmTgt.split('.').map(Number);
        planOf(mi)[i].targets.splice(si, 1);
        if (!planOf(mi)[i].targets.length) planOf(mi)[i].targets.push(newTarget());
        paint();
      }));
      document.getElementById('dschema-form').addEventListener('submit', (ev) => {
        ev.preventDefault();
        syncDraft();
        draft.name = draft.name.trim();
        for (const m of members) {
          draft.plans[m.id] = draft.plans[m.id]
            .filter((e) => e.name.trim())
            .map((e) => ({ id: e.id, name: e.name.trim(), kind: ensureExercise(e.name.trim(), e.kind || 'kracht').kind, targets: e.targets }));
        }
        if (!draft.name || members.some((m) => !draft.plans[m.id].length)) {
          alert('Geef het schema een naam en minstens één oefening per persoon.');
          return;
        }
        if (isNew) db.duoSchemas.push(draft);
        else db.duoSchemas[db.duoSchemas.findIndex((s) => s.id === sid)] = draft;
        save(); location.hash = `/duo/${duoId}`;
      });
      const del = document.getElementById('del-dschema');
      if (del) del.addEventListener('click', () => {
        if (!confirm('Dit duo-schema verwijderen? Gelogde trainingen blijven bewaard.')) return;
        db.duoSchemas = db.duoSchemas.filter((s) => s.id !== sid);
        save(); location.hash = `/duo/${duoId}`;
      });
    };
    paint();
  }

  // --- duo free workout: pick exercises per member ---
  function viewDuoPick(duoId) {
    const duo = duoById(duoId);
    const members = duo ? duo.clientIds.map(clientById) : [];
    if (!duo || members.some((m) => !m)) { location.hash = '/'; return; }
    const known = members.map((m) => [...new Set([...knownExercises(m.id), ...libraryNames()])]);
    const selected = members.map(() => new Set());

    const paint = () => {
      $app.innerHTML = topbar(`Duo-training — ${duoName(duo)}`, `/duo/${duoId}`) +
        `<p class="sub" style="margin:0 0 12px">Kies per persoon de oefeningen voor deze sessie.</p>
        <div class="duo-cols">` +
        members.map((m, mi) =>
          `<div><div class="eyebrow">${esc(m.name)}</div>` +
          (schemasOf(m.id).length ? `<div class="actions" style="margin-bottom:10px">${schemasOf(m.id).map((s) =>
            `<button type="button" class="small" data-schema-pick="${mi}.${s.id}">Schema: ${esc(s.name)}</button>`
          ).join('')}</div>` : '') +
          (known[mi].length ? `<div class="chips">${known[mi].map((n) =>
            `<button type="button" class="chip" data-pick="${mi}" data-ex-name="${esc(n)}" aria-pressed="${selected[mi].has(n)}">${esc(n)}</button>`
          ).join('')}</div>` : '') +
          `<form class="card" data-new-ex="${mi}" style="margin-top:10px">
            <label class="field"><span>Nieuwe oefening voor ${esc(m.name)}</span><input name="name" placeholder="bijv. Lat pulldown"></label>
            <button type="submit">+ Toevoegen en selecteren</button>
          </form></div>`
        ).join('') +
        `</div>
        <button class="primary wide" id="start-duo" ${selected.every((s) => s.size) ? '' : 'disabled'} style="margin-top:8px">Start duo-training</button>` +
        (selected.every((s) => s.size) ? '' : `<p class="mut">Kies voor beide personen minstens één oefening.</p>`);

      bindNav();
      document.querySelectorAll('[data-pick]').forEach((b) => b.addEventListener('click', () => {
        const mi = +b.dataset.pick, n = b.dataset.exName;
        if (selected[mi].has(n)) selected[mi].delete(n); else selected[mi].add(n);
        paint();
      }));
      document.querySelectorAll('[data-schema-pick]').forEach((b) => b.addEventListener('click', () => {
        const dot = b.dataset.schemaPick.indexOf('.');
        const mi = +b.dataset.schemaPick.slice(0, dot);
        const schema = schemaById(b.dataset.schemaPick.slice(dot + 1));
        if (!schema) return;
        for (const ex of schema.exercises) {
          const existing = known[mi].find((k) => k.toLowerCase() === ex.name.toLowerCase());
          if (!existing) known[mi].push(ex.name);
          selected[mi].add(existing || ex.name);
        }
        paint();
      }));
      document.querySelectorAll('[data-new-ex]').forEach((form) => form.addEventListener('submit', (ev) => {
        ev.preventDefault();
        const mi = +form.dataset.newEx;
        const n = String(new FormData(form).get('name')).trim();
        if (!n) return;
        const existing = known[mi].find((k) => k.toLowerCase() === n.toLowerCase());
        if (!existing) known[mi].push(n);
        selected[mi].add(existing || n);
        paint();
      }));
      document.getElementById('start-duo').addEventListener('click', () => {
        pendingDuo = { duoId, picks: {} };
        members.forEach((m, mi) => { pendingDuo.picks[m.id] = known[mi].filter((n) => selected[mi].has(n)); });
        location.hash = `/duo/${duoId}/training`;
      });
    };
    paint();
  }

  // --- duo workout logging: both members on one screen ---
  function viewDuoWorkout(duoId, duoSchemaId) {
    const duo = duoById(duoId);
    const members = duo ? duo.clientIds.map(clientById) : [];
    if (!duo || members.some((m) => !m)) { location.hash = '/'; return; }
    const duoSchema = duoSchemaId ? duoSchemaById(duoSchemaId) : null;
    if (duoSchemaId && (!duoSchema || duoSchema.duoId !== duoId)) { location.hash = `/duo/${duoId}`; return; }
    const draftRef = `/duo/${duoId}/training` + (duoSchemaId ? `/${duoSchemaId}` : '');
    const storedRaw = readTrainingDraft(draftRef);
    const stored = storedRaw && Array.isArray(storedRaw.members) && storedRaw.members.length === members.length
      && storedRaw.members.every((sm, i) => sm.clientId === members[i].id) ? storedRaw : null;
    if (!duoSchema && (!pendingDuo || pendingDuo.duoId !== duoId) && !stored) { location.hash = `/duo/${duoId}/vrij`; return; }

    const prefill = (clientId, name, kind, targets) => {
      const prev = lastEntryFor(clientId, name);
      const step = progressSuggestion(clientId, name, kind, targets);
      if (prev && step) {
        return prev.entry.sets.map((s) => ({
          ...s, note: '', type: setType(s) === 'warmup' ? 'warmup' : 'normaal',
          weight: setType(s) === 'warmup' ? s.weight : step.to,
        }));
      }
      if (prev) return prev.entry.sets.map((s) => ({ ...s, note: '', type: setType(s) === 'warmup' ? 'warmup' : 'normaal' }));
      const t = (targets && targets.length ? targets : null) || targetsFor(clientId, name);
      if (t) return t.map((x) => ({ ...x }));
      return kind === 'cardio' ? [{ distance: 0, minutes: 0 }] : Array.from({ length: 3 }, () => ({ reps: 10, weight: 0 }));
    };
    const mkExercise = (clientId, ex) => {
      const kind = ex.kind || kindFor(clientId, ex.name);
      return { name: ex.name, kind, superset: ex.superset || null, sets: prefill(clientId, ex.name, kind, ex.targets) };
    };
    const draft = stored
      ? stored.members.map((sm, i) => ({
          client: members[i],
          exercises: sm.exercises.map((e) => ({ name: e.name, kind: e.kind || kindFor(members[i].id, e.name), superset: e.superset || null, sets: e.sets.map((s) => ({ ...s })) })),
        }))
      : members.map((m) => ({
          client: m,
          exercises: duoSchema
            ? (duoSchema.plans[m.id] || []).map((ex) => mkExercise(m.id, ex))
            : (pendingDuo.picks[m.id] || []).map((n) => mkExercise(m.id, { name: n })),
        }));
    const initDate = stored ? stored.date : todayIso();
    const initNotes = stored ? stored.notes : '';
    const restoredAt = stored ? stored.savedAt : null;
    let swapping = null; // "mi.xi" of exercise currently in swap mode
    let infoOpen = null; // "mi.xi" of the exercise whose explanation is open
    let menuOpen = null; // "mi.xi" of the exercise whose ⋯ menu is open
    let openMore = null; // "mi.xi.si" of the set whose options are open
    let tool = null;
    const startedAt = (stored && stored.startedAt) || Date.now();

    const paint = () => {
      $app.innerHTML = topbar(`Duo-training — ${duoName(duo)}`, `/duo/${duoId}`) +
        `<p style="margin:0 0 12px"><span class="badge">${duoSchema ? esc(duoSchema.name) : 'Vrije training'}</span></p>` +
        (restoredAt ? `<div class="note-box">Automatisch bewaarde invoer hersteld (${esc(fmtDraftTime(restoredAt))}). <button type="button" class="small" id="discard-draft">Opnieuw beginnen</button></div>` : '') +
        `<form id="duo-form">
          <div class="actions" style="margin-bottom:12px">
            <button type="button" class="small" data-rest-dset="all">⏱ Rust</button>
            <button type="button" class="small" id="tool-plates">🧮 Schijven</button>
            <button type="button" class="small" id="tool-interval">⏲ Interval</button>
          </div>
          ${toolPanelHtml(tool)}
          ${sessionBarHtml()}
          <label class="field"><span>Datum</span><input type="date" name="date" value="${esc(initDate)}" required></label>
          <div class="duo-cols">
          ${draft.map((mem, mi) =>
            `<div><div class="eyebrow">${esc(mem.client.name)}</div>` +
            ((mem.client.injuries || mem.client.medical) ? `<div class="note-box"><strong>Let op:</strong> ${esc([mem.client.injuries, mem.client.medical].filter(Boolean).join(' · '))}</div>` : '') +
            mem.exercises.map((ex, xi) => {
              const prev = lastEntryFor(mem.client.id, ex.name);
              const key = `${mi}.${xi}`;
              const linked = ex.superset && mem.exercises.some((d, i) => i !== xi && d.superset === ex.superset);
              return `<div class="card mg-edge${linked ? ' ss-mark' : ''}" style="--mg:${groupColour(ex.name, ex.kind)}">
              <div class="row" style="margin-bottom:2px">
                <div class="title grow">${esc(ex.name)}${linked ? ` <span class="badge">Superset ${esc(ex.superset)}</span>` : ''}${ex.kind !== 'kracht' ? ` <span class="badge">${KIND_LABELS[ex.kind]}</span>` : ''}</div>
                <button type="button" class="small ghost" data-dchart="${key}" aria-label="Progressiegrafiek" ${prev ? '' : 'disabled'}>📈</button>
                <button type="button" class="small ghost" data-dinfo="${key}" aria-label="Uitleg">${hasInfo(exerciseByName(ex.name)) || clientNote(mem.client.id, ex.name) ? 'ℹ️' : 'ℹ'}</button>
                <button type="button" class="small ghost" data-dexmenu="${key}" aria-label="Meer voor deze oefening" aria-expanded="${menuOpen === key}">⋯</button>
              </div>
              ${menuOpen === key ? `<div class="ex-menu">
                <button type="button" class="small" data-dup="${key}" ${xi === 0 ? 'disabled' : ''}>↑ Omhoog</button>
                <button type="button" class="small" data-ddown="${key}" ${xi === mem.exercises.length - 1 ? 'disabled' : ''}>↓ Omlaag</button>
                <button type="button" class="small" data-dlink="${key}" ${xi === 0 ? 'disabled' : ''}>⛓ Superset</button>
                <button type="button" class="small" data-rest-dset="${key}">⏱ Rust</button>
                <button type="button" class="small" data-dswap="${key}">⇄ Vervangen</button>
              </div>` : ''}
              ${infoOpen === key ? `<div class="info-panel">${exerciseInfoHtml(ex.name, mem.client.id)}</div>` : ''}
              <div class="mut" style="margin-bottom:8px">${esc(prevSummary(prev, ex.kind))}</div>
              ${progressHintHtml(mem.client.id, ex, null)}
              ${swapping === key ? `<div class="row" style="margin-bottom:10px">
                <input id="swap-input" class="grow" list="swap-list" placeholder="Vervangende oefening">
                <button type="button" class="small primary" id="swap-ok">OK</button>
                <datalist id="swap-list">${[...new Set([...knownExercises(mem.client.id), ...libraryNames()])]
                  .filter((n) => !mem.exercises.some((e) => e.name.toLowerCase() === n.toLowerCase()))
                  .map((n) => `<option value="${esc(n)}">`).join('')}</datalist>
              </div>` : ''}
              <div class="pr-live" data-pr-live="${key}" hidden></div>
              ${setRowsHtml('dset', key, ex.sets, prev && prev.entry.sets, ex.kind, openMore)}
              <button type="button" class="small" data-dadd-set="${key}">+ Set</button>
            </div>`;
            }).join('') +
            `<div class="card">
              <label class="field"><span>Oefening toevoegen voor ${esc(mem.client.name)}</span>
                <input data-extra-input="${mi}" list="dex-list-${mi}" placeholder="bijv. Lat pulldown"></label>
              <datalist id="dex-list-${mi}">${[...new Set([...knownExercises(mem.client.id), ...libraryNames()])]
                .filter((n) => !mem.exercises.some((e) => e.name.toLowerCase() === n.toLowerCase()))
                .map((n) => `<option value="${esc(n)}">`).join('')}</datalist>
              <div class="row">
                <select data-extra-kind="${mi}" class="grow">${Object.entries(KIND_LABELS).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select>
                <button type="button" class="small" data-extra-add="${mi}">+ Oefening</button>
              </div>
            </div></div>`
          ).join('')}
          </div>
          <label class="field"><span>Notities (optioneel)</span><textarea name="notes" rows="2" placeholder="bijv. samen circuit gedaan">${esc(initNotes)}</textarea></label>
          <button class="primary wide" type="submit">Duo-training opslaan</button>
        </form>`;

      bindNav();
      const syncDraft = () => {
        document.querySelectorAll('[data-dset]').forEach((inp) => {
          const [mi, xi, si] = inp.dataset.dset.split('.').map(Number);
          const f = inp.dataset.f;
          const set = draft[mi].exercises[xi].sets[si];
          if (f === 'note') set.note = inp.value;
          else set[f] = f === 'rir' && inp.value.trim() === '' ? undefined : num(inp.value);
        });
      };
      // see the solo screen: never re-read the DOM here, the draft is already up to date
      const persistDraft = () => {
        writeTrainingDraft({
          ref: draftRef, startedAt,
          date: document.querySelector('[name="date"]').value,
          notes: document.querySelector('[name="notes"]').value,
          members: draft.map((mem) => ({ clientId: mem.client.id, exercises: mem.exercises })),
        });
      };
      const syncAndPersist = () => { syncDraft(); persistDraft(); };
      const repaintKeeping = () => {
        persistDraft();
        const dateVal = document.querySelector('[name="date"]').value;
        const notesVal = document.querySelector('[name="notes"]').value;
        paint();
        document.querySelector('[name="date"]').value = dateVal;
        document.querySelector('[name="notes"]').value = notesVal;
      };
      const form = document.getElementById('duo-form');
      form.addEventListener('input', syncAndPersist);
      form.addEventListener('change', syncAndPersist);
      const disc = document.getElementById('discard-draft');
      if (disc) disc.addEventListener('click', () => { clearTrainingDraft(draftRef); render(); });
      draft.forEach((mem, mi) => mem.exercises.forEach((ex, xi) => {
        if (ex.kind !== 'cardio') bindPrLive('dset', `${mi}.${xi}`, mem.client.id, ex.name);
      }));
      bindSetControls('dset', {
        syncDraft,
        repaint: repaintKeeping,
        openMore: () => openMore,
        setOpenMore: (v) => { openMore = v; },
        getSet: (key) => { const [mi, xi, si] = key.split('.').map(Number); return draft[mi].exercises[xi].sets[si]; },
        removeSet: (key) => { const [mi, xi, si] = key.split('.').map(Number); draft[mi].exercises[xi].sets.splice(si, 1); },
        restFor: (key) => { const [mi, xi] = String(key).split('.').map(Number); const ex = draft[mi] && draft[mi].exercises[xi]; return ex ? restFor(ex.name) : null; },
      });
      bindToolPanel(() => tool, (v) => { tool = v; }, repaintKeeping);

      document.querySelectorAll('[data-dup], [data-ddown]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        const up = b.dataset.dup !== undefined;
        const [mi, xi] = (up ? b.dataset.dup : b.dataset.ddown).split('.').map(Number);
        const list = draft[mi].exercises;
        const to = up ? xi - 1 : xi + 1;
        if (to < 0 || to >= list.length) return;
        [list[xi], list[to]] = [list[to], list[xi]];
        openMore = null;
        repaintKeeping();
      }));
      document.querySelectorAll('[data-dlink]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        const [mi, xi] = b.dataset.dlink.split('.').map(Number);
        const list = draft[mi].exercises;
        const prevEx = list[xi - 1];
        if (list[xi].superset && list[xi].superset === prevEx.superset) {
          list[xi].superset = null;
        } else {
          const group = prevEx.superset || String.fromCharCode(65 + list.filter((d, i) => i < xi && d.superset).length);
          prevEx.superset = group;
          list[xi].superset = group;
        }
        repaintKeeping();
      }));
      document.querySelectorAll('[data-dchart]').forEach((b) => b.addEventListener('click', () => {
        const [mi, xi] = b.dataset.dchart.split('.').map(Number);
        openSessionChart(draft[mi].client.id, draft[mi].exercises[xi].name);
      }));
      document.querySelectorAll('[data-dexmenu]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        menuOpen = menuOpen === b.dataset.dexmenu ? null : b.dataset.dexmenu;
        repaintKeeping();
      }));
      runSessionClock(startedAt, () => draft.flatMap((mem) => mem.exercises.flatMap((ex) => ex.sets)));
      document.querySelectorAll('[data-dinfo]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        infoOpen = infoOpen === b.dataset.dinfo ? null : b.dataset.dinfo;
        repaintKeeping();
      }));
      document.querySelectorAll('[data-dswap]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        swapping = swapping === b.dataset.dswap ? null : b.dataset.dswap;
        repaintKeeping();
        const inp = document.getElementById('swap-input');
        if (inp) inp.focus();
      }));
      const swapOk = document.getElementById('swap-ok');
      if (swapOk) swapOk.addEventListener('click', () => {
        const name = document.getElementById('swap-input').value.trim();
        const [mi, xi] = swapping.split('.').map(Number);
        if (!name || draft[mi].exercises.some((e) => e.name.toLowerCase() === name.toLowerCase())) return;
        syncDraft();
        draft[mi].exercises[xi] = mkExercise(draft[mi].client.id, { name });
        swapping = null;
        repaintKeeping();
      });
      document.querySelectorAll('[data-dadd-set]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        const [mi, xi] = b.dataset.daddSet.split('.').map(Number);
        const sets = draft[mi].exercises[xi].sets;
        const lastSet = sets[sets.length - 1];
        sets.push(lastSet ? { ...lastSet, note: '' } : { reps: 10, weight: 0 });
        repaintKeeping();
      }));
      document.querySelectorAll('[data-extra-add]').forEach((b) => b.addEventListener('click', () => {
        const mi = +b.dataset.extraAdd;
        const inp = document.querySelector(`[data-extra-input="${mi}"]`);
        const name = inp.value.trim();
        if (!name || draft[mi].exercises.some((e) => e.name.toLowerCase() === name.toLowerCase())) return;
