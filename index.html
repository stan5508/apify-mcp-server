  // wire up the per-set controls shared by solo and duo logging
  function bindSetControls(attr, o) {
    const camel = (p) => p + attr.charAt(0).toUpperCase() + attr.slice(1);
    const restSecondsFor = (key) => (o.restFor && key ? o.restFor(key) : db.settings.restSeconds) || 90;
    document.querySelectorAll(`[data-more-${attr}]`).forEach((b) => b.addEventListener('click', () => {
      o.syncDraft();
      const key = b.dataset[camel('more')];
      o.setOpenMore(o.openMore() === key ? null : key);
      o.repaint();
    }));
    document.querySelectorAll(`[data-settype-${attr}]`).forEach((b) => b.addEventListener('click', () => {
      o.syncDraft();
      const raw = b.dataset[camel('settype')];
      const type = raw.slice(raw.lastIndexOf('.') + 1);
      o.getSet(raw.slice(0, raw.lastIndexOf('.'))).type = type;
      o.repaint();
    }));
    document.querySelectorAll(`[data-setside-${attr}]`).forEach((b) => b.addEventListener('click', () => {
      o.syncDraft();
      const raw = b.dataset[camel('setside')];
      const side = raw.slice(raw.lastIndexOf('.') + 1);
      o.getSet(raw.slice(0, raw.lastIndexOf('.'))).side = side;
      o.repaint();
    }));
    // ticking a set off: green row, short buzz, rest timer starts by itself
    document.querySelectorAll(`[data-tick-${attr}]`).forEach((b) => b.addEventListener('click', () => {
      o.syncDraft();
      const key = b.dataset[camel('tick')];
      const set = o.getSet(key);
      set.done = !set.done;
      if (set.done) {
        tick();
        if (db.settings.autoRest !== false) startRest(restSecondsFor(key.slice(0, key.lastIndexOf('.'))));
      }
      o.repaint();
    }));
    document.querySelectorAll(`[data-rm-${attr}]`).forEach((b) => b.addEventListener('click', () => {
      o.syncDraft();
      o.removeSet(b.dataset[camel('rm')]);
      o.setOpenMore(null);
      o.repaint();
    }));
    document.querySelectorAll(`[data-rest-${attr}]`).forEach((b) => b.addEventListener('click', () => {
      const key = b.dataset[camel('rest')];
      startRest(restSecondsFor(key === 'all' ? null : key));
    }));
    // the rest timer now hangs off the tick, so filling in reps only buzzes
    document.querySelectorAll(`[data-${attr}][data-f="reps"], [data-${attr}][data-f="minutes"]`).forEach((inp) => {
      inp.addEventListener('change', () => { if (num(inp.value) > 0) tick(); });
    });
  }

  // live PR badge: show while typed weight beats the client's best for that exercise
  function bindPrLive(attr, key, clientId, exName, excludeId) {
    const badge = document.querySelector(`[data-pr-live="${key}"]`);
    if (!badge) return;
    const best = bestTopFor(clientId, exName, excludeId);
    if (best == null) return;
    const inputs = [...document.querySelectorAll(`[data-${attr}^="${key}."][data-f="weight"]`)];
    const update = () => {
      const cur = Math.max(0, ...inputs.map((i) => num(i.value)));
      if (cur > best) {
        badge.hidden = false;
        badge.innerHTML = `🏆 Nieuw PR! ${esc(fmtKg(cur))} <span style="font-weight:400">(was ${esc(fmtKg(best))})</span>`;
      } else {
        badge.hidden = true;
      }
    };
    inputs.forEach((i) => i.addEventListener('input', update));
    update();
  }

  // all sessions of one exercise, chronological, with metrics and PR markers
  function exerciseSessions(clientId, name, excludeId) {
    const key = name.trim().toLowerCase();
    const sessions = [];
    for (const w of workoutsOf(clientId).filter((x) => x.id !== excludeId)) {
      for (const e of w.entries) {
        if (e.name.trim().toLowerCase() !== key) continue;
        const m = exerciseMetrics(e);
        if (m) sessions.push({ date: w.date, sets: e.sets, ...m });
      }
    }
    let best = -Infinity;
    for (let i = 0; i < sessions.length; i++) {
      sessions[i].isPr = i > 0 && sessions[i].top > best;
      if (sessions[i].top > best) best = sessions[i].top;
    }
    return sessions;
  }

  // ---------- clients: goals, photos, storage ----------
  const activeClients = () => db.clients.filter((c) => !c.archived);

  // a goal tracks an exercise towards a target; progress comes from the logged history
  function goalProgress(client, goal) {
    if (!goal.exercise || !(goal.target > 0)) return null;
    const sessions = exerciseSessions(client.id, goal.exercise);
    const current = sessions.length ? Math.max(...sessions.map((s) => s.top)) : 0;
    const start = goal.start != null ? goal.start : (sessions.length ? sessions[0].top : 0);
    const span = goal.target - start;
    const pct = span > 0 ? Math.round(((current - start) / span) * 100) : (current >= goal.target ? 100 : 0);
    return { current, start, pct: Math.max(0, Math.min(100, pct)), reached: current >= goal.target };
  }
  const daysUntil = (iso) => Math.ceil((new Date(iso + 'T12:00:00') - new Date()) / 86400000);

  // photos are stored inline, so shrink them hard before they hit local storage
  function readPhoto(file, maxSize = 640, quality = 0.55) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('kan bestand niet lezen'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('geen geldige afbeelding'));
        img.onload = () => {
          const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  const dbSizeKb = () => Math.round(JSON.stringify(db).length / 1024);

  // ---------- nutrition ----------
  const MOMENTS = ['Ontbijt', 'Lunch', 'Diner', 'Snack'];
  const MACROS = [
    { key: 'kcal', label: 'Calorieën', unit: 'kcal' },
    { key: 'protein', label: 'Eiwit', unit: 'g' },
    { key: 'carbs', label: 'Koolhydraten', unit: 'g' },
    { key: 'fat', label: 'Vet', unit: 'g' },
  ];
  const planOf = (clientId) => db.nutritionPlans[clientId] || null;
  const mealsOn = (clientId, date) => db.meals
    .filter((m) => m.clientId === clientId && m.date === date)
    .sort((a, b) => MOMENTS.indexOf(a.moment) - MOMENTS.indexOf(b.moment));
  const emptyTotals = () => ({ kcal: 0, protein: 0, carbs: 0, fat: 0 });
  function dayTotals(clientId, date) {
    return mealsOn(clientId, date).reduce((t, m) => {
      for (const { key } of MACROS) t[key] += m[key] || 0;
      return t;
    }, emptyTotals());
  }
  // averages over the days that actually have something logged
  function nutritionAverages(clientId, days = 7) {
    const today = todayIso();
    let logged = 0;
    const sum = emptyTotals();
    for (let i = 0; i < days; i++) {
      const date = addDays(today, -i);
      if (!mealsOn(clientId, date).length) continue;
      logged++;
      const t = dayTotals(clientId, date);
      for (const { key } of MACROS) sum[key] += t[key];
    }
    if (!logged) return null;
    const avg = emptyTotals();
    for (const { key } of MACROS) avg[key] = Math.round(sum[key] / logged);
    return { avg, days: logged };
  }
  // rough starting point; the coach adjusts from there
  function suggestPlan(clientId) {
    const meas = db.measurements.filter((m) => m.clientId === clientId && m.weight > 0).sort((a, b) => a.date.localeCompare(b.date));
    const weight = meas.length ? meas[meas.length - 1].weight : null;
    if (!weight) return null;
    const protein = Math.round(weight * 1.8);
    const kcal = Math.round(weight * 33);
    const fat = Math.round(weight * 0.9);
    const carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
    return { weight, kcal, protein, carbs, fat };
  }
  const foodByName = (name) => db.foods.find((f) => f.name.trim().toLowerCase() === String(name).trim().toLowerCase()) || null;
  const foodById = (id) => db.foods.find((f) => f.id === id) || null;

  // calories burned that day, estimated from logged training time
  function burnedOn(clientId, date) {
    if (!db.settings.countTrainingBurn) return 0;
    const perMin = db.settings.kcalPerMin || 6;
    return workoutsOf(clientId)
      .filter((w) => w.date === date)
      .reduce((t, w) => t + Math.round((w.durationMin || 0) * perMin), 0);
  }
  // the number MyFitnessPal leads with: target minus food plus exercise
  function remainingKcal(clientId, date) {
    const plan = planOf(clientId);
    if (!plan || !plan.kcal) return null;
    const eaten = dayTotals(clientId, date).kcal;
    const burned = burnedOn(clientId, date);
    return { target: plan.kcal, eaten: Math.round(eaten), burned, remaining: Math.round(plan.kcal - eaten + burned) };
  }
  const waterOn = (clientId, date) => ((db.water[clientId] || {})[date] || 0);
  function addWater(clientId, date, ml) {
    const perClient = db.water[clientId] || (db.water[clientId] = {});
    perClient[date] = Math.max(0, (perClient[date] || 0) + ml);
    if (!perClient[date]) delete perClient[date];
    save();
  }
  // foods used most often, for one-tap logging
  function frequentFoods(clientId, limit = 8) {
    const counts = new Map();
    for (const m of db.meals) {
      if (m.clientId !== clientId) continue;
      const key = m.name.trim().toLowerCase();
      const cur = counts.get(key) || { name: m.name, uses: 0, last: m, date: m.date };
      cur.uses++;
      if (m.date >= cur.date) { cur.last = m; cur.date = m.date; }
      counts.set(key, cur);
    }
    return [...counts.values()].sort((a, b) => (b.uses - a.uses) || b.date.localeCompare(a.date)).slice(0, limit);
  }
  function copyDay(clientId, fromDate, toDate) {
    const source = mealsOn(clientId, fromDate);
    for (const m of source) {
      db.meals.push({ ...m, id: uid(), date: toDate });
    }
    save();
    return source.length;
  }
  // macro targets from a percentage split, the way most nutrition apps do it
  function planFromPercents(kcal, pProtein, pCarbs, pFat) {
    return {
      kcal: Math.round(kcal),
      protein: Math.round((kcal * pProtein / 100) / 4),
      carbs: Math.round((kcal * pCarbs / 100) / 4),
      fat: Math.round((kcal * pFat / 100) / 9),
    };
  }

  // ---------- product lookup (Open Food Facts) ----------
  const OFF_FIELDS = 'code,product_name,brands,serving_size,nutriments';
  function offToFood(p) {
    const n = p.nutriments || {};
    const name = [p.product_name, p.brands ? p.brands.split(',')[0].trim() : ''].filter(Boolean).join(' — ');
    if (!name) return null;
    return {
      name, code: p.code || '', per: '100g', servingSize: p.serving_size || '',
      kcal: Math.round(n['energy-kcal_100g'] || (n.energy_100g ? n.energy_100g / 4.184 : 0)),
      protein: Math.round((n.proteins_100g || 0) * 10) / 10,
      carbs: Math.round((n.carbohydrates_100g || 0) * 10) / 10,
      fat: Math.round((n.fat_100g || 0) * 10) / 10,
    };
  }
  async function searchProducts(term) {
    const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(term)}` +
      `&search_simple=1&action=process&json=1&page_size=15&fields=${OFF_FIELDS}`;
    const res = await fetch(url, { signal: AbortSignal.timeout(12000) });
    if (!res.ok) throw new Error('zoeken mislukt (' + res.status + ')');
    const data = await res.json();
    return (data.products || []).map(offToFood).filter((f) => f && f.kcal > 0);
  }
  async function productByBarcode(code) {
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`, { signal: AbortSignal.timeout(12000) });
    if (!res.ok) throw new Error('product niet gevonden');
    const data = await res.json();
    if (!data.product) throw new Error('product niet gevonden');
    return offToFood(data.product);
  }
  const barcodeSupported = () => 'BarcodeDetector' in window;
  async function scanBarcode(videoEl) {
    const detector = new window.BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'] });
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    videoEl.srcObject = stream;
    await videoEl.play();
    const stop = () => stream.getTracks().forEach((t) => t.stop());
    const deadline = Date.now() + 20000;
    while (Date.now() < deadline) {
      try {
        const found = await detector.detect(videoEl);
        if (found.length) { stop(); return found[0].rawValue; }
      } catch { /* keep trying */ }
      await new Promise((r) => setTimeout(r, 300));
    }
    stop();
    throw new Error('geen barcode herkend');
  }
  // amount is grams for per-100g foods, or a number of portions
  function macrosFor(food, amount) {
    const factor = food.per === 'portie' ? amount : amount / 100;
    const out = {};
    for (const { key } of MACROS) out[key] = Math.round((food[key] || 0) * factor * 10) / 10;
    return out;
  }

  // ---------- backups and sharing ----------
  async function listBackups() {
    if (!syncCfg || !syncCfg.gistId) return [];
    const g = await gh('/gists/' + syncCfg.gistId);
    return Object.keys(g.files || {}).filter((n) => n.startsWith('backup-')).sort().reverse();
  }
  async function restoreBackup(name) {
    const g = await gh('/gists/' + syncCfg.gistId);
    const file = g.files[name];
    const content = file.truncated ? await (await fetch(file.raw_url)).text() : file.content;
    db = normalizeDb(JSON.parse(content));
    delete db._needsSave;
    save();
    render();
  }

  // a read-only snapshot for one client, published as a secret gist
  function clientSnapshot(clientId) {
    const c = clientById(clientId);
    const exercises = loggedExercises(clientId).map((name) => {
      const ss = exerciseSessions(clientId, name);
      const kind = ss[ss.length - 1].kind || 'kracht';
      return {
        name, kind,
        sessions: ss.map((x) => ({ date: x.date, top: x.top, sets: x.sets })),
      };
    });
    return {
      version: 1, generated: todayIso(), unit: unitLbl(), coach: db.settings.coachName || '',
      client: { name: c.name, goal: c.goal || '' },
      goals: (c.goals || []).map((g) => ({ text: g.text, exercise: g.exercise, target: g.target, date: g.date, done: g.done })),
      measurements: db.measurements.filter((m) => m.clientId === clientId),
      nutrition: (() => {
        const plan = planOf(clientId);
        const week = nutritionAverages(clientId, 7);
        return plan || week ? { plan, week } : null;
      })(),
      workouts: workoutsOf(clientId).map((w) => ({ date: w.date, durationMin: w.durationMin, entries: w.entries })),
      exercises,
    };
  }
  async function shareClient(clientId) {
    const c = clientById(clientId);
    const content = JSON.stringify(clientSnapshot(clientId));
    if (c.shareGistId) {
      await gh('/gists/' + c.shareGistId, { method: 'PATCH', body: JSON.stringify({ files: { 'client.json': { content } } }) });
    } else {
      const g = await gh('/gists', {
        method: 'POST',
        body: JSON.stringify({ description: `Coachlog inzage — ${c.name}`, public: false, files: { 'client.json': { content } } }),
      });
      c.shareGistId = g.id;
    }
    c.sharedAt = todayIso();
    save();
    return shareLink(c);
  }
  const shareLink = (c) => `${location.origin}${location.pathname.replace(/[^/]*$/, '')}klant.html#${c.shareGistId}`;
  async function stopSharing(clientId) {
    const c = clientById(clientId);
    if (!c.shareGistId) return;
    try { await gh('/gists/' + c.shareGistId, { method: 'DELETE' }); } catch { /* already gone */ }
    delete c.shareGistId;
    delete c.sharedAt;
    save();
  }

  // ---------- theme ----------
  function applyTheme() {
    const t = db.settings.theme || 'system';
    if (t === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
  }

  // ---------- screen lock ----------
  // A PIN keeps the app closed to whoever picks up the tablet. It is a screen
  // lock, not encryption: the data itself stays readable in browser storage.
  async function hashPin(pin, salt) {
    const buf = new TextEncoder().encode(salt + ':' + pin);
    const digest = await crypto.subtle.digest('SHA-256', buf);
    return [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, '0')).join('');
  }
  let unlocked = false;
  let hiddenSince = null;
  const lockNeeded = () => !!(db.settings.pin && !unlocked);

  function showLock() {
    const el = document.getElementById('lock-screen');
    el.hidden = false;
    el.innerHTML = `<div class="lock-box">
      <div class="brand"><svg class="brand-mark" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="96" fill="#15181c"/><g stroke="#f5f7f8" stroke-width="46" stroke-linecap="round"><line x1="178" y1="164" x2="178" y2="348"/><line x1="256" y1="164" x2="256" y2="348"/><line x1="334" y1="164" x2="334" y2="348"/></g><line x1="146" y1="366" x2="366" y2="146" stroke="#f2a93b" stroke-width="46" stroke-linecap="round"/></svg><span>Coach<i>log</i></span></div>
      <p class="sub">Voer je pincode in.</p>
      <input id="lock-pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••" maxlength="12">
      <p class="mut" id="lock-msg"></p>
      <button class="primary wide" id="lock-ok">Ontgrendelen</button>
    </div>`;
    const input = document.getElementById('lock-pin');
    input.focus();
    const tryUnlock = async () => {
      const ok = await hashPin(input.value, db.settings.pin.salt) === db.settings.pin.hash;
      if (ok) {
        unlocked = true;
        el.hidden = true;
        render();
      } else {
        document.getElementById('lock-msg').textContent = 'Onjuiste pincode.';
        input.value = '';
        input.focus();
      }
    };
    document.getElementById('lock-ok').addEventListener('click', tryUnlock);
    input.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') tryUnlock(); });
  }

  function watchIdleLock() {
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { hiddenSince = Date.now(); return; }
      const mins = db.settings.lockMinutes || 0;
      if (db.settings.pin && mins > 0 && hiddenSince && Date.now() - hiddenSince > mins * 60000) {
        unlocked = false;
        showLock();
      }
      hiddenSince = null;
    });
  }

  // ---------- appointments, credits and payments ----------
  const APPT_STATUS = { gepland: 'Gepland', geweest: 'Geweest', noshow: 'No-show', geannuleerd: 'Geannuleerd' };
  const money = (n) => `${db.settings.currency || '€'} ${(Math.round(n * 100) / 100).toLocaleString('nl-NL', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  const apptTitle = (a) => a.duoId ? (duoById(a.duoId) ? duoName(duoById(a.duoId)) : 'Duo') : (clientById(a.clientId) || { name: '?' }).name;
  const apptClientIds = (a) => a.duoId ? ((duoById(a.duoId) || {}).clientIds || []) : [a.clientId];
  const sortedAppointments = () => [...db.appointments].sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
  const appointmentsOn = (date) => sortedAppointments().filter((a) => a.date === date);
  const appointmentsFor = (clientId) => sortedAppointments().filter((a) => apptClientIds(a).includes(clientId));
  const packagesOf = (clientId) => db.packages.filter((p) => p.clientId === clientId).sort((a, b) => a.date.localeCompare(b.date));
  const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };

  // one credit per training; a no-show costs a credit too unless switched off
  function creditLedger(clientId) {
    const packs = packagesOf(clientId);
    if (!packs.length) return null;
    const from = packs[0].date;
    const bought = packs.reduce((t, p) => t + (p.sessions || 0), 0);
    const trainings = workoutsOf(clientId).filter((w) => w.date >= from).length;
    const noShows = db.settings.noShowCounts
      ? appointmentsFor(clientId).filter((a) => a.status === 'noshow' && a.date >= from).length
      : 0;
    const used = trainings + noShows;
    return { from, bought, used, trainings, noShows, remaining: bought - used, low: bought - used <= 2 };
  }
  // ---------- subscriptions ----------
  const SUB_STATUS = { concept: 'Concept', getekend: 'Getekend', opgezegd: 'Opgezegd', afgelopen: 'Afgelopen' };
  const addMonths = (iso, n) => {
    const d = new Date(iso + 'T12:00:00');
    const day = d.getDate();
    d.setMonth(d.getMonth() + n);
    if (d.getDate() < day) d.setDate(0); // 31 jan + 1 maand blijft in februari
    return d.toISOString().slice(0, 10);
  };
  const subTypeById = (id) => db.subTypes.find((t) => t.id === id);
  const subById = (id) => db.subscriptions.find((s) => s.id === id);
  const subsOf = (clientId) => db.subscriptions.filter((s) => s.clientId === clientId)
    .sort((a, b) => (b.startDate || '').localeCompare(a.startDate || ''));
  const subEnd = (s) => s.endDate || (s.months > 0 && s.startDate ? addMonths(s.startDate, s.months) : '');
  const subRunning = (s) => {
    if (s.status !== 'getekend') return false;
    const end = subEnd(s);
    return !end || end >= todayIso();
  };
  const subStatusLabel = (s) => {
    const end = subEnd(s);
    if (s.status === 'getekend' && end && end < todayIso()) return SUB_STATUS.afgelopen;
    return SUB_STATUS[s.status];
  };
  const subMonthlyTotal = () => db.subscriptions.filter(subRunning).reduce((t, s) => t + (s.pricePerMonth || 0), 0);
  const activeSubTypes = () => db.subTypes.filter((t) => !t.archived).sort((a, b) => byName(a.name, b.name));

  const openInvoices = () => db.packages.filter((p) => !p.paid).sort((a, b) => a.date.localeCompare(b.date));
  // one termijn per calendar month a signed contract runs, never into the future
  function subInstalments() {
    const now = todayIso().slice(0, 7);
    const out = [];
    for (const s of db.subscriptions) {
      if (s.status === 'concept' || !s.startDate || !(s.pricePerMonth > 0)) continue;
      const end = subEnd(s);
      const last = end ? end.slice(0, 7) : now;
      let m = s.startDate.slice(0, 7);
      while (m <= last && m <= now) {
        out.push({
          subId: s.id, clientId: s.clientId, name: s.name, month: m,
          amount: s.pricePerMonth, paid: (s.paidMonths || []).includes(m),
        });
        m = addMonths(m + '-01', 1).slice(0, 7);
      }
    }
    return out.sort((a, b) => a.month.localeCompare(b.month));
  }
  const openInstalments = () => subInstalments().filter((t) => !t.paid);

  function revenueByMonth() {
    const months = new Map();
    const bucket = (m) => {
      const cur = months.get(m) || { month: m, invoiced: 0, paid: 0 };
      months.set(m, cur);
      return cur;
    };
    for (const p of db.packages) {
      const cur = bucket(p.date.slice(0, 7));
      cur.invoiced += p.price || 0;
      if (p.paid) cur.paid += p.price || 0;
    }
    for (const t of subInstalments()) {
      const cur = bucket(t.month);
      cur.invoiced += t.amount;
      if (t.paid) cur.paid += t.amount;
    }
    return [...months.values()].sort((a, b) => b.month.localeCompare(a.month));
  }

  // reminders only fire while the app is open — a closed PWA cannot be woken here
  function scheduleReminders() {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const now = Date.now();
    for (const a of appointmentsOn(todayIso())) {
      if (a.status !== 'gepland' || !a.time) continue;
      const ms = new Date(`${a.date}T${a.time}:00`).getTime() - 15 * 60000 - now;
      if (ms <= 0 || ms > 12 * 3600000) continue;
      setTimeout(() => {
        try { new Notification('Over 15 minuten', { body: `${apptTitle(a)} om ${a.time}` }); } catch { /* blocked */ }
      }, ms);
    }
  }

  // ---------- analysis helpers ----------
  const PERIODS = { '3m': '3 mnd', '6m': '6 mnd', '1j': 'Jaar', all: 'Alles' };
  function periodStart(period) {
    if (period === 'all') return null;
    const d = new Date();
    if (period === '3m') d.setMonth(d.getMonth() - 3);
    else if (period === '6m') d.setMonth(d.getMonth() - 6);
    else d.setFullYear(d.getFullYear() - 1);
    return d.toISOString().slice(0, 10);
  }
  const inPeriod = (iso, period) => { const s = periodStart(period); return !s || iso >= s; };

  const MUSCLE_GROUPS = [
    'Pectoralis major', 'Deltoideus', 'Triceps brachii',
    'Latissimus dorsi', 'Trapezius', 'Biceps brachii', 'Erector spinae',
    'Quadriceps', 'Hamstrings', 'Gluteus maximus', 'Triceps surae',
    'Rectus abdominis', 'Cardio', 'Overig',
  ];
  // fixed colour per muscle group, straight off the weight plates: red 25, blue 20, yellow 15, green 10.
  // groups without a plate colour stay neutral rather than inventing a fifth hue.
  const GROUP_COLOURS = {
    'Pectoralis major': 'var(--series-1)',
    Deltoideus: 'var(--series-1)',
    'Triceps brachii': 'var(--series-1)',
    'Latissimus dorsi': 'var(--series-2)',
    Trapezius: 'var(--series-2)',
    'Biceps brachii': 'var(--series-2)',
    'Erector spinae': 'var(--series-2)',
    Quadriceps: 'var(--series-4)',
    Hamstrings: 'var(--series-4)',
    'Gluteus maximus': 'var(--series-4)',
    'Triceps surae': 'var(--series-4)',
    'Rectus abdominis': 'var(--series-3)',
  };
  const groupColor = (group) => GROUP_COLOURS[group] || 'var(--baseline)';
  const groupColour = (name, kind) => groupColor(groupOf(name, kind));
  const groupKey = (name) => name.trim().toLowerCase();
  const groupOf = (name, kind) => {
    const rec = exerciseByName(name);
    if (rec) return rec.group;
    return db.muscleGroups[groupKey(name)] || (kind === 'cardio' ? 'Cardio' : 'Overig');
  };
  function setGroup(name, group) {
    const rec = exerciseByName(name);
    if (rec) rec.group = group;
    if (group) db.muscleGroups[groupKey(name)] = group;
    else delete db.muscleGroups[groupKey(name)];
    save();
  }

  // working sets in one logged entry: warming-up and empty rows do not count
  const entrySetCount = (entry) =>
    entry.sets.filter((x) => setType(x) !== 'warmup' && filledSet(x, entryKind(entry))).length;

  // per-month totals for a client: sessions, sets, PR count
  function monthlyStats(clientId, period) {
    const ws = workoutsOf(clientId).filter((w) => inPeriod(w.date, period));
    const prDates = new Map(); // month -> count
    for (const name of loggedExercises(clientId)) {
      for (const s of exerciseSessions(clientId, name)) {
        if (!s.isPr || !inPeriod(s.date, period)) continue;
        const m = s.date.slice(0, 7);
        prDates.set(m, (prDates.get(m) || 0) + 1);
      }
    }
    const months = new Map();
    for (const w of ws) {
      const m = w.date.slice(0, 7);
      const cur = months.get(m) || { month: m, sessions: 0, sets: 0, minutes: 0, prs: 0 };
      cur.sessions++;
      cur.minutes += w.durationMin || 0;
      cur.sets += w.entries.reduce((t, e) => t + entrySetCount(e), 0);
      months.set(m, cur);
    }
    for (const [m, n] of prDates) {
      const cur = months.get(m) || { month: m, sessions: 0, sets: 0, minutes: 0, prs: 0 };
      cur.prs = n;
      months.set(m, cur);
    }
    return [...months.values()].sort((a, b) => a.month.localeCompare(b.month));
  }
  const monthLabel = (m) => new Date(m + '-01T12:00:00').toLocaleDateString('nl-NL', { month: 'long', year: 'numeric' });

  // training weeks in a row, counting back from this week
  function weekStreak(clientId) {
    const weeks = new Set(workoutsOf(clientId).map((w) => isoWeek(w.date)));
    let streak = 0;
    const d = new Date();
    for (let i = 0; i < 260; i++) {
      const key = isoWeek(d.toISOString().slice(0, 10));
      if (weeks.has(key)) streak++;
      else if (i > 0) break; // the current week may still be empty
      d.setDate(d.getDate() - 7);
    }
    return streak;
  }
  function isoWeek(iso) {
    const d = new Date(iso + 'T12:00:00');
    const day = (d.getDay() + 6) % 7; // monday = 0
    d.setDate(d.getDate() - day);
    return d.toISOString().slice(0, 10);
  }

  // best guess at the muscle a lift trains, from its name. First match wins, so the
  // narrow patterns sit above the broad ones ("leg curl" before "curl", "face pull" before "pull").
  const GROUP_HINTS = [
    [/kuit|calf|calve|seated calf/, 'Triceps surae'],
    [/leg ?curl|hamstring|romanian|rdl|nordic|good ?morning/, 'Hamstrings'],
    [/hip thrust|glute|bil(len)?|bridge|kickback|abduct/, 'Gluteus maximus'],
    [/squat|leg ?press|beenpers|lunge|uitval|leg ?extension|beenstrek|step ?up|hack/, 'Quadriceps'],
    [/deadlift|back ?extension|hyperextension|rugstrek|erector/, 'Erector spinae'],
    [/shrug|face ?pull|upright row|trapez/, 'Trapezius'],
    [/triceps|pushdown|skull|french press|kop ?over/, 'Triceps brachii'],
    [/pulldown|pull ?up|pull-up|chin ?up|chin-up|optrekken|\brow\b|roei(en)?machine|barbell row|dumbbell row|seated row|\blat\b/, 'Latissimus dorsi'],
    [/curl|biceps/, 'Biceps brachii'],
    [/shoulder press|overhead press|\bohp\b|lateral raise|zijwaarts|arnold|reverse fly|front raise|delt|schouderdrukken/, 'Deltoideus'],
    [/bench|bank(druk|en)|chest|borst|\bfly\b|push ?up|push-up|opdruk|\bdip/, 'Pectoralis major'],
    [/crunch|plank|sit ?up|sit-up|leg raise|buik|russian twist|hollow|\babs?\b|abdomin/, 'Rectus abdominis'],
  ];
  function suggestGroup(name, kind) {
    if (kind === 'cardio') return 'Cardio';
    const n = String(name || '').toLowerCase();
    for (const [re, group] of GROUP_HINTS) if (re.test(n)) return group;
    return null;
  }

  // sets per muscle group for a client in a period
  function groupTotals(clientId, period) {
    const totals = new Map();
    for (const w of workoutsOf(clientId)) {
      if (!inPeriod(w.date, period)) continue;
      for (const e of w.entries) {
        const m = exerciseMetrics(e);
        if (!m) continue;
        const g = groupOf(e.name, m.kind);
        const cur = totals.get(g) || { group: g, sets: 0, minutes: 0 };
        cur.sets += entrySetCount(e);
        cur.minutes += m.kind === 'cardio' ? m.minutes : 0;
        totals.set(g, cur);
      }
    }
    return [...totals.values()].sort((a, b) => (b.sets - a.sets) || (b.minutes - a.minutes));
  }

  // ---------- CSV export ----------
  function workoutsCsv(clientId) {
    const rows = [['klant', 'datum', 'duur_min', 'oefening', 'soort', 'superset', 'set', 'gewicht', 'herhalingen', 'rir', 'type', 'kant', 'afstand_km', 'tijd_min', 'notitie']];
    const list = clientId ? workoutsOf(clientId) : [...db.workouts].sort((a, b) => a.date.localeCompare(b.date));
    for (const w of list) {
      const client = clientById(w.clientId);
      w.entries.forEach((e) => e.sets.forEach((s, i) => rows.push([
        client ? client.name : '', w.date, w.durationMin || '', e.name, entryKind(e), e.superset || '',
        i + 1, s.weight ?? '', s.reps ?? '', s.rir ?? '', setType(s), setSide(s), s.distance ?? '', s.minutes ?? '', s.note || '',
      ])));
    }
    return rows.map((r) => r.map((v) => {
      const t = String(v ?? '');
      return /[";\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
    }).join(';')).join('\n');
  }
  function downloadCsv(clientId) {
    const name = clientId ? (clientById(clientId) || {}).name : 'alle-klanten';
    const blob = new Blob(['\ufeff' + workoutsCsv(clientId)], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `coachlog-${String(name).toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${todayIso()}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // ---------- timers (rest + interval) ----------
  const timer = { mode: null, endsAt: 0, tick: null, interval: null, paused: false, left: 0 };
  let audioCtx = null;
  function beep(times = 1) {
    if (!db.settings.sound) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      for (let i = 0; i < times; i++) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        const start = audioCtx.currentTime + i * 0.25;
        gain.gain.setValueAtTime(0.001, start);
        gain.gain.exponentialRampToValueAtTime(0.4, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.18);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.2);
      }
    } catch { /* audio unavailable */ }
    if (navigator.vibrate) navigator.vibrate(times > 1 ? [200, 100, 200] : 300);
  }
  // short buzz when a set is filled in; you feel it without looking
  const tick = () => { if (db.settings.sound && navigator.vibrate) navigator.vibrate(35); };

  const mmss = (sec) => {
    const total = Math.max(0, Math.round(sec));
    return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
  };

  function stopTimer() {
    clearInterval(timer.tick);
    timer.mode = null; timer.interval = null; timer.tick = null; timer.paused = false;
    document.getElementById('timer-bar').hidden = true;
    document.body.classList.remove('timer-on');
  }
  function startRest(seconds) {
    clearInterval(timer.tick);
    timer.mode = 'rest'; timer.interval = null; timer.paused = false;
    timer.endsAt = Date.now() + seconds * 1000;
    runTimer();
  }
  function startInterval(work, rest, rounds) {
    clearInterval(timer.tick);
    timer.mode = 'interval'; timer.paused = false;
    timer.interval = { work, rest, rounds, round: 1, phase: 'work' };
    timer.endsAt = Date.now() + work * 1000;
    beep();
    runTimer();
  }
  function runTimer() {
    const bar = document.getElementById('timer-bar');
    bar.hidden = false;
    document.body.classList.add('timer-on');
    const paint = () => {
      const left = timer.paused ? timer.left : (timer.endsAt - Date.now()) / 1000;
      const iv = timer.interval;
      const label = iv ? `${iv.phase === 'work' ? '💪 Werk' : '😮‍💨 Rust'} · ronde ${iv.round}/${iv.rounds}` : '⏱ Rust';
      bar.querySelector('.t-label').textContent = label;
      bar.querySelector('.t-time').textContent = mmss(left);
      bar.querySelector('.t-pause').textContent = timer.paused ? '▶' : '⏸';
      if (!timer.paused && left <= 0) {
        if (!iv) { beep(2); stopTimer(); return; }
        if (iv.phase === 'work') {
          if (iv.rest > 0) { iv.phase = 'rest'; timer.endsAt = Date.now() + iv.rest * 1000; beep(); return; }
          iv.round++;
        } else {
          iv.phase = 'work'; iv.round++;
        }
        if (iv.round > iv.rounds) { beep(2); stopTimer(); return; }
        iv.phase = 'work';
        timer.endsAt = Date.now() + iv.work * 1000;
        beep();
      }
    };
    paint();
    timer.tick = setInterval(paint, 250);
  }
  function bindTimerBar() {
    const bar = document.getElementById('timer-bar');
    bar.querySelector('.t-plus').addEventListener('click', () => {
      if (timer.paused) timer.left += 30; else timer.endsAt += 30000;
    });
    bar.querySelector('.t-pause').addEventListener('click', () => {
      if (timer.paused) { timer.endsAt = Date.now() + timer.left * 1000; timer.paused = false; }
      else { timer.left = (timer.endsAt - Date.now()) / 1000; timer.paused = true; }
    });
    bar.querySelector('.t-stop').addEventListener('click', stopTimer);
  }

  // ---------- plate calculator ----------
  const PLATES = [25, 20, 15, 10, 5, 2.5, 1.25];
  function platesFor(total, bar) {
    let perSide = (total - bar) / 2;
    if (perSide <= 0) return { ok: total >= bar, plates: [], rest: 0 };
    const out = [];
    for (const p of PLATES) {
      const n = Math.floor((perSide + 1e-9) / p);
      if (n > 0) { out.push({ plate: p, n }); perSide -= n * p; }
    }
    return { ok: true, plates: out, rest: Math.round(perSide * 100) / 100 };
  }
  const PLATE_COLORS = {
    25: ['#c8102e', '#ffffff'], 20: ['#0057b8', '#ffffff'], 15: ['#f2c200', '#17130a'],
    10: ['#009639', '#17130a'], 5: ['#f2f2f0', '#17130a'], 2.5: ['#c8102e', '#ffffff'], 1.25: ['#a8adb4', '#17130a'],
  };
  function plateHtml(total) {
    const bar = db.settings.barWeight || 20;
    const r = platesFor(total, bar);
    if (!total) return 'Vul een gewicht in.';
    if (!r.ok) return `${esc(fmtKg(total))} is lichter dan de stang (${esc(fmtKg(bar))}).`;
    if (!r.plates.length) return `Alleen de stang (${esc(fmtKg(bar))}).`;
    const fmtP = (v) => v.toLocaleString('nl-NL', { maximumFractionDigits: 2 });
    const pill = (pl) => {
      const [bg, fg] = PLATE_COLORS[pl.plate] || ['var(--raised)', 'var(--ink)'];
      return `<span class="plate" style="background:${bg};color:${fg}">${pl.n}×${fmtP(pl.plate)}</span>`;
    };
    return `Per kant: ${r.plates.map(pill).join(' ')}` +
      (r.rest > 0 ? ` <span class="mut">(${fmtP(r.rest)} ${esc(unitLbl())} rest)</span>` : '');
  }

  // ---------- session tools panel (plates + interval timer) ----------
  let plateWeight = 100;
  const intervalCfg = { work: 40, rest: 20, rounds: 8 };
  function toolPanelHtml(tool) {
    if (tool === 'plates') {
      return `<div class="tool-panel">
        <div class="row">
          <label class="field grow" style="margin:0"><span>Totaalgewicht incl. stang (${unitLbl()})</span>
            <input id="plate-weight" type="text" inputmode="decimal" value="${plateWeight || ''}"></label>
          <label class="field" style="margin:0;width:120px"><span>Stang (${unitLbl()})</span>
            <input id="bar-weight" type="text" inputmode="decimal" value="${db.settings.barWeight}"></label>
        </div>
        <div class="tool-out" id="plate-out">${plateHtml(plateWeight)}</div>
      </div>`;
    }
    if (tool === 'interval') {
      return `<div class="tool-panel">
        <div class="row">
          <label class="field grow" style="margin:0"><span>Werk (sec)</span><input id="iv-work" type="number" min="5" value="${intervalCfg.work}"></label>
          <label class="field grow" style="margin:0"><span>Rust (sec)</span><input id="iv-rest" type="number" min="0" value="${intervalCfg.rest}"></label>
          <label class="field grow" style="margin:0"><span>Rondes</span><input id="iv-rounds" type="number" min="1" value="${intervalCfg.rounds}"></label>
        </div>
        <div class="row"><button type="button" class="primary" id="iv-start">Start interval</button></div>
      </div>`;
    }
    return '';
  }
  function bindToolPanel(getTool, setTool, repaint) {
    const toggle = (name) => { setTool(getTool() === name ? null : name); repaint(); };
    const p = document.getElementById('tool-plates');
    if (p) p.addEventListener('click', () => toggle('plates'));
    const i = document.getElementById('tool-interval');
    if (i) i.addEventListener('click', () => toggle('interval'));

    const pw = document.getElementById('plate-weight');
    const bw = document.getElementById('bar-weight');
    const out = document.getElementById('plate-out');
    const recalc = () => {
      plateWeight = num(pw.value);
      const bar = num(bw.value);
      if (bar > 0 && bar !== db.settings.barWeight) { db.settings.barWeight = bar; save(); }
      out.innerHTML = plateHtml(plateWeight);
    };
    if (pw && bw && out) { pw.addEventListener('input', recalc); bw.addEventListener('input', recalc); }

    const start = document.getElementById('iv-start');
    if (start) start.addEventListener('click', () => {
      intervalCfg.work = Math.max(5, num(document.getElementById('iv-work').value));
      intervalCfg.rest = Math.max(0, num(document.getElementById('iv-rest').value));
      intervalCfg.rounds = Math.max(1, num(document.getElementById('iv-rounds').value));
      startInterval(intervalCfg.work, intervalCfg.rest, intervalCfg.rounds);
    });
  }

  // ---------- chart ----------
  const motionOk = () => !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // wipe a line path on from left to right
  function animateLine(path, seconds, delay) {
    if (!path || !motionOk()) return;
    const len = path.getTotalLength();
    path.style.strokeDasharray = `${len}`;
    path.style.strokeDashoffset = `${len}`;
    path.getBoundingClientRect(); // force a reflow so the transition runs
    path.style.transition = `stroke-dashoffset ${seconds}s cubic-bezier(0.4, 0, 0.2, 1) ${delay}s`;
    path.style.strokeDashoffset = '0';
  }
  // spread point animations across the line wipe so dots land as the line reaches them
  const dotDelay = (i, n) => (0.12 + (n > 1 ? (i / (n - 1)) * 0.7 : 0)).toFixed(3);

  function niceTicks(min, max, count) {
    if (min === max) { min = Math.max(0, min - 1); max = max + 1; }
    const span = max - min;
    const step0 = span / count;
    const mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= step0) || 10 * mag;
    const lo = Math.floor(min / step) * step;
    const hi = Math.ceil(max / step) * step;
    const ticks = [];
    for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.round(v * 100) / 100);
    return ticks;
  }

  function renderChart(container, points, unit) {
    const W = 600, H = 260, padL = 44, padR = 16, padT = 14, padB = 30;
    const iw = W - padL - padR, ih = H - padT - padB;
    const vals = points.map((p) => p.value);
    const ticks = niceTicks(Math.min(...vals), Math.max(...vals), 4);
    const yMin = ticks[0], yMax = ticks[ticks.length - 1];
    const x = (i) => points.length === 1 ? padL + iw / 2 : padL + (i / (points.length - 1)) * iw;
    const y = (v) => padT + ih - ((v - yMin) / (yMax - yMin || 1)) * ih;
    const fmtVal = (v) => unit === 'kg' ? fmtKg(v)
      : unit === 'vol' ? Math.round(v).toLocaleString('nl-NL') + ' ' + unitLbl()
      : (Math.round(v * 10) / 10).toLocaleString('nl-NL') + ' ' + unit;

    const grid = ticks.map((t) =>
      `<line x1="${padL}" y1="${y(t)}" x2="${W - padR}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/>` +
      `<text x="${padL - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${t.toLocaleString('nl-NL')}</text>`
    ).join('');

    const lineD = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
    const areaD = points.length > 1
      ? `${lineD} L${x(points.length - 1).toFixed(1)},${(padT + ih).toFixed(1)} L${x(0).toFixed(1)},${(padT + ih).toFixed(1)} Z`
      : '';

    // x labels: first, last, and up to 2 in between
    const labelIdx = new Set([0, points.length - 1]);
    if (points.length > 4) { labelIdx.add(Math.round((points.length - 1) / 3)); labelIdx.add(Math.round(2 * (points.length - 1) / 3)); }
    const xLabels = [...labelIdx].map((i) =>
      `<text x="${x(i)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === points.length - 1 ? 'end' : 'middle'}" font-size="11" fill="var(--muted)">${esc(fmtDate(points[i].date))}</text>`
    ).join('');

    const dots = points.map((p, i) =>
      `<circle class="dot" style="animation-delay:${dotDelay(i, points.length)}s" cx="${x(i)}" cy="${y(p.value)}" r="4" fill="var(--data)" stroke="var(--surface)" stroke-width="2"/>`
    ).join('');

    const last = points[points.length - 1];
    const endLabel = `<text class="end-label" x="${x(points.length - 1) - 8}" y="${y(last.value) - 10}" text-anchor="end" font-size="12" font-weight="650" fill="var(--ink)" style="font-variant-numeric:tabular-nums;animation-delay:0.75s">${esc(fmtVal(last.value))}</text>`;

    container.innerHTML =
      `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progressiegrafiek">` +
      grid +
      `<line x1="${padL}" y1="${padT + ih}" x2="${W - padR}" y2="${padT + ih}" stroke="var(--baseline)" stroke-width="1"/>` +
      (areaD ? `<path class="wash" style="animation-delay:0.25s" d="${areaD}" fill="var(--data-wash)"/>` : '') +
      (points.length > 1 ? `<path class="line" d="${lineD}" fill="none" stroke="var(--data)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : '') +
      `<line class="xh" x1="0" y1="${padT}" x2="0" y2="${padT + ih}" stroke="var(--baseline)" stroke-width="1" visibility="hidden"/>` +
      dots + endLabel + xLabels +
      `</svg><div class="tooltip"></div>`;

    const svg = container.querySelector('svg');
    animateLine(svg.querySelector('.line'), 0.85, 0);

    // hover: nearest point -> crosshair + tooltip
    const tip = container.querySelector('.tooltip');
    const xh = svg.querySelector('.xh');
    const onMove = (ev) => {
      const rect = svg.getBoundingClientRect();
      const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const px = ((cx - rect.left) / rect.width) * W;
      let best = 0, bd = Infinity;
      points.forEach((_, i) => { const d = Math.abs(x(i) - px); if (d < bd) { bd = d; best = i; } });
      const p = points[best];
      xh.setAttribute('x1', x(best)); xh.setAttribute('x2', x(best));
      xh.setAttribute('visibility', 'visible');
      tip.style.display = 'block';
      tip.style.left = (x(best) / W * rect.width) + 'px';
      tip.style.top = (y(p.value) / H * rect.height) + 'px';
      tip.innerHTML = `${esc(fmtDate(p.date))}<br><span class="tv">${esc(fmtVal(p.value))}</span>`;
    };
    const onLeave = () => { tip.style.display = 'none'; xh.setAttribute('visibility', 'hidden'); };
    svg.addEventListener('mousemove', onMove);
    svg.addEventListener('touchstart', onMove, { passive: true });
    svg.addEventListener('touchmove', onMove, { passive: true });
    svg.addEventListener('mouseleave', onLeave);
  }

  // full-screen progress chart during a session; separate element on top of the form so typed input stays
  function openSessionChart(clientId, name, excludeId) {
    const sessions = exerciseSessions(clientId, name, excludeId);
    const kind = sessions.length ? sessions[0].kind : 'kracht';
    const repsOnly = kind === 'lichaamsgewicht' && sessions.every((s) => !s.extra);
    const valueOf = (s) => kind === 'cardio' ? s.distance : repsOnly ? s.bestReps : s.top;
    const unit = kind === 'cardio' ? 'km' : repsOnly ? 'herh.' : 'kg';
    const title = kind === 'cardio' ? 'Afstand per training'
      : repsOnly ? 'Meeste herhalingen per training'
      : kind === 'lichaamsgewicht' ? 'Extra gewicht per training' : 'Beste gewicht per training';
    const points = sessions.map((s) => ({ date: s.date, value: valueOf(s) })).filter((p) => Number.isFinite(p.value) && p.value > 0);
    const el = document.createElement('div');
    el.className = 'chart-overlay';
    el.innerHTML = `<div class="inner">
      <div class="topbar"><button class="back" id="chart-close" aria-label="Sluiten">←</button><h1>${esc(name)}</h1></div>
      <div class="eyebrow" style="margin-top:0">${title}</div>
      <div class="card">
        <div class="chart-wrap" id="session-chart"></div>
        <p class="mut" style="margin:6px 0 0">Warming-upsets tellen niet mee.</p>
      </div>
      ${sessions.length ? `<div class="eyebrow">Laatste sessies</div>` + [...sessions].slice(-5).reverse().map((s) => `<div class="card">
        <div class="title">${esc(fmtDateFull(s.date))}${s.isPr ? ' <span class="badge pr">🏆 PR</span>' : ''}</div>
        <div class="sub">${s.sets.map((st) => setText(st, kind)).join(' · ')}</div>
      </div>`).join('') : ''}
    </div>`;
    document.body.appendChild(el);
    const onKey = (ev) => { if (ev.key === 'Escape') close(); };
    const close = () => { el.remove(); document.removeEventListener('keydown', onKey); };
    el.querySelector('#chart-close').addEventListener('click', close);
    document.addEventListener('keydown', onKey);
    const box = el.querySelector('#session-chart');
    if (points.length) renderChart(box, points, unit);
    else box.innerHTML = '<p class="mut">Nog geen eerdere sessies voor deze oefening.</p>';
  }

  // tiny inline trend line for a list row: no axes, just the shape and where it ends
  function sparklineHtml(values, colour) {
    if (values.length < 2) return '<span class="spark-empty"></span>';
    const w = 76, h = 24, pad = 3;
    const lo = Math.min(...values), hi = Math.max(...values);
    const x = (i) => pad + (i / (values.length - 1)) * (w - pad * 2);
    const y = (v) => h - pad - ((v - lo) / (hi - lo || 1)) * (h - pad * 2);
    const d = values.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const last = values.length - 1;
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">
      <path d="${d}" fill="none" stroke="${colour}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${x(last).toFixed(1)}" cy="${y(values[last]).toFixed(1)}" r="2.6" fill="${colour}"/>
    </svg>`;
  }

  // up/down chip next to a trend line
  function trendChipHtml(delta, fmt) {
    if (!delta) return '<span class="trend flat">gelijk</span>';
    const up = delta > 0;
    return `<span class="trend ${up ? 'up' : 'down'}">${up ? '+' : '−'}${esc(fmt(Math.abs(delta)))} ${up ? '↑' : '↓'}</span>`;
  }

  // counts a stat tile's number up to its value; the text is already correct, this only animates the way there
  function countUpStats() {
    if (!motionOk()) return;
    document.querySelectorAll('.stat .val').forEach((el) => {
      if (el.dataset.counted) return;
      const full = el.textContent;
      const m = full.match(/-?\d[\d.]*(,\d+)?/);
      if (!m) return;
      const target = Number(m[0].replace(/\./g, '').replace(',', '.'));
      if (!Number.isFinite(target) || target === 0) return;
      el.dataset.counted = '1';
      const decimals = (m[1] || '').length ? m[1].length - 1 : 0;
      const t0 = performance.now(), ms = 550;
      const step = (t) => {
        const k = Math.min(1, (t - t0) / ms);
        const eased = 1 - Math.pow(1 - k, 3);
        const now = (target * eased).toLocaleString('nl-NL', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
        el.textContent = full.replace(m[0], now);
        if (k < 1) requestAnimationFrame(step);
        else el.textContent = full;
      };
      requestAnimationFrame(step);
    });
  }

  // progress ring used for the day overview and the streak avatars
  function ringHtml(done, total, label) {
    const r = 20, c = 2 * Math.PI * r;
    const pct = total ? Math.min(1, done / total) : 0;
    return `<svg class="ring" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="${esc(label)}">
      <circle cx="24" cy="24" r="${r}" fill="none" stroke="var(--grid)" stroke-width="5"/>
      <circle cx="24" cy="24" r="${r}" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - pct)).toFixed(1)}" transform="rotate(-90 24 24)"/>
      <text x="24" y="28" text-anchor="middle" font-size="13" font-weight="650" fill="var(--ink)">${done}/${total}</text>
    </svg>`;
  }

  // ---------- end-of-session summary ----------
  // little burst of confetti in the plate colours; purely decorative, skipped when motion is reduced
  function confettiBurst(host) {
    if (!motionOk()) return;
    const cv = document.createElement('canvas');
    cv.className = 'confetti';
    host.appendChild(cv);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = host.clientWidth, h = host.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    const cols = ['#c8102e', '#0057b8', '#f2c200', '#009639', '#f2a93b'];
    const bits = Array.from({ length: 90 }, (_, i) => ({
      x: w / 2 + (i % 7 - 3) * 12, y: h * 0.28,
      vx: (i % 11 - 5) * 0.55, vy: -3.4 - (i % 5) * 0.7,
      rot: i, vr: (i % 7 - 3) * 0.12,
      col: cols[i % cols.length], size: 5 + (i % 4),
    }));
    const t0 = performance.now();
    const frame = (t) => {
      const age = t - t0;
      ctx.clearRect(0, 0, w, h);
      for (const b of bits) {
        b.vy += 0.12; b.x += b.vx; b.y += b.vy; b.rot += b.vr;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - age / 2600);
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rot);
        ctx.fillStyle = b.col;
        ctx.fillRect(-b.size / 2, -b.size / 2, b.size, b.size * 0.6);
        ctx.restore();
      }
      if (age < 2600 && cv.isConnected) requestAnimationFrame(frame);
      else cv.remove();
    };
    requestAnimationFrame(frame);
  }

  // shown right after saving a session: what was done, and which records fell
  function openSessionSummary({ title, entries, durationMin, prs, backHash }) {
    const sets = entries.reduce((t, e) => t + e.sets.length, 0);

    const el = document.createElement('div');
    el.className = 'chart-overlay summary-overlay';
    el.innerHTML = `<div class="inner">
      <div class="summary-head">
        <div class="eyebrow" style="margin:0">Sessie afgerond</div>
        <h2 style="margin:2px 0 0">${esc(title)}</h2>
      </div>
      <div class="stat-grid">
        <div class="stat"><div class="lbl">Duur</div><div class="val">${durationMin} min</div></div>
        <div class="stat"><div class="lbl">Sets</div><div class="val">${sets}</div></div>
        <div class="stat"><div class="lbl">Oefeningen</div><div class="val">${entries.length}</div></div>
      </div>
      ${prs.length ? `<div class="pr-banner">
        <div class="pr-title">🏆 ${prs.length === 1 ? 'Nieuw persoonlijk record' : `${prs.length} nieuwe records`}</div>
        ${prs.map((r) => `<div class="pr-line"><span class="grow">${esc(r.name)}</span>
          <span class="pr-val">${esc(fmtKg(r.top))}</span>
          <span class="mut">was ${esc(fmtKg(r.prev))}</span></div>`).join('')}
      </div>` : `<p class="mut">Geen records deze keer — netjes weggezet.</p>`}
      <div class="eyebrow">Gedaan</div>
      ${entries.map((e) => `<div class="card"><div class="row">
        <span class="grow">${esc(e.name)}</span>
        <span class="mut">${e.sets.length} set${e.sets.length === 1 ? '' : 's'}</span>
      </div></div>`).join('')}
      <button class="primary wide" id="summary-close" style="margin-top:14px">Klaar</button>
    </div>`;
    document.body.appendChild(el);
    const onKey = (ev) => { if (ev.key === 'Escape') close(); };
    const close = () => { el.remove(); document.removeEventListener('keydown', onKey); location.hash = backHash; };
    el.querySelector('#summary-close').addEventListener('click', close);
    document.addEventListener('keydown', onKey);
    if (prs.length) confettiBurst(el);
  }

  // records broken by these entries, measured against everything logged before now
  function prsIn(clientId, entries) {
    return entries.map((e) => {
      const m = exerciseMetrics(e);
      const prev = bestTopFor(clientId, e.name);
      return m && m.top > 0 && prev != null && m.top > prev ? { name: e.name, top: m.top, prev } : null;
    }).filter(Boolean);
  }

  // multi-series line chart with legend (used to compare exercises)
  function renderMultiChart(container, series, unit) {
    const W = 600, H = 280, padL = 48, padR = 16, padT = 14, padB = 30;
    const iw = W - padL - padR, ih = H - padT - padB;
    const dates = [...new Set(series.flatMap((s) => s.points.map((p) => p.date)))].sort();
    const vals = series.flatMap((s) => s.points.map((p) => p.value));
    if (!dates.length || !vals.length) { container.innerHTML = '<p class="mut">Geen gegevens in deze periode.</p>'; return; }
    const ticks = niceTicks(Math.min(...vals), Math.max(...vals), 4);
    const yMin = ticks[0], yMax = ticks[ticks.length - 1];
    const x = (iso) => dates.length === 1 ? padL + iw / 2 : padL + (dates.indexOf(iso) / (dates.length - 1)) * iw;
    const y = (v) => padT + ih - ((v - yMin) / (yMax - yMin || 1)) * ih;

    const grid = ticks.map((t) =>
      `<line x1="${padL}" y1="${y(t)}" x2="${W - padR}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/>` +
      `<text x="${padL - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${t.toLocaleString('nl-NL')}</text>`
    ).join('');

    const body = series.map((s, si) => {
      const col = `var(--series-${(si % 4) + 1})`;
      const pts = [...s.points].sort((a, b) => a.date.localeCompare(b.date));
      const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.date).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
      const dots = pts.map((p, i) => `<circle class="dot" style="animation-delay:${dotDelay(i, pts.length)}s" cx="${x(p.date)}" cy="${y(p.value)}" r="4" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`).join('');
      return (pts.length > 1 ? `<path class="line" d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : '') + dots;
    }).join('');

    const xLabels = `<text x="${padL}" y="${H - 8}" text-anchor="start" font-size="11" fill="var(--muted)">${esc(fmtDate(dates[0]))}</text>` +
      (dates.length > 1 ? `<text x="${W - padR}" y="${H - 8}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(fmtDate(dates[dates.length - 1]))}</text>` : '');

    container.innerHTML =
      `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vergelijking van oefeningen">` +
      grid +
      `<line x1="${padL}" y1="${padT + ih}" x2="${W - padR}" y2="${padT + ih}" stroke="var(--baseline)" stroke-width="1"/>` +
      body + xLabels +
      `</svg>` +
      `<div class="legend">${series.map((s, si) =>
        `<span><i style="background:var(--series-${(si % 4) + 1})"></i>${esc(s.label)}</span>`).join('')}</div>` +
      (unit ? `<p class="mut" style="margin:6px 0 0">Waarden in ${esc(unit)}.</p>` : '');

    // stagger the series so the lines draw one after another
    container.querySelectorAll('.line').forEach((path, si) => animateLine(path, 0.7, si * 0.12));
  }

  function renderBarChart(container, points, unit) {
    const W = 600, H = 240, padL = 48, padR = 16, padT = 14, padB = 30;
    const iw = W - padL - padR, ih = H - padT - padB;
    const ticks = niceTicks(0, Math.max(...points.map((p) => p.value)), 4);
    const yMax = ticks[ticks.length - 1];
    const y = (v) => padT + ih - (v / (yMax || 1)) * ih;
    const band = iw / points.length;
    const bw = Math.max(2, Math.min(24, band - 2));
    const bx = (i) => padL + i * band + (band - bw) / 2;
    const fmtVal = (v) => Math.round(v).toLocaleString('nl-NL') + ' ' + (unit || unitLbl());

    const grid = ticks.map((t) =>
      `<line x1="${padL}" y1="${y(t)}" x2="${W - padR}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/>` +
      `<text x="${padL - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${t.toLocaleString('nl-NL')}</text>`
    ).join('');

    // rounded top corners, square baseline
    const bars = points.map((p, i) => {
      const x0 = bx(i), yv = y(p.value), h = padT + ih - yv;
      const r = Math.min(4, bw / 2, h);
      return `<path class="bar" style="animation-delay:${dotDelay(i, points.length)}s" d="M${x0.toFixed(1)},${padT + ih} L${x0.toFixed(1)},${(yv + r).toFixed(1)} Q${x0.toFixed(1)},${yv.toFixed(1)} ${(x0 + r).toFixed(1)},${yv.toFixed(1)} L${(x0 + bw - r).toFixed(1)},${yv.toFixed(1)} Q${(x0 + bw).toFixed(1)},${yv.toFixed(1)} ${(x0 + bw).toFixed(1)},${(yv + r).toFixed(1)} L${(x0 + bw).toFixed(1)},${padT + ih} Z" fill="var(--data)"/>`;
    }).join('');

    const xLabels =
      `<text x="${bx(0)}" y="${H - 8}" text-anchor="start" font-size="11" fill="var(--muted)">${esc(fmtDate(points[0].date))}</text>` +
      (points.length > 1 ? `<text x="${bx(points.length - 1) + bw}" y="${H - 8}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(fmtDate(points[points.length - 1].date))}</text>` : '');

    container.innerHTML =
      `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Staafgrafiek per training">` +
      grid + bars +
      `<line x1="${padL}" y1="${padT + ih}" x2="${W - padR}" y2="${padT + ih}" stroke="var(--baseline)" stroke-width="1"/>` +
      xLabels +
      `</svg><div class="tooltip"></div>`;

    const svg = container.querySelector('svg');
    const tip = container.querySelector('.tooltip');
    const onMove = (ev) => {
      const rect = svg.getBoundingClientRect();
      const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const px = ((cx - rect.left) / rect.width) * W;
      let best = 0, bd = Infinity;
      points.forEach((_, i) => { const d = Math.abs(bx(i) + bw / 2 - px); if (d < bd) { bd = d; best = i; } });
      const p = points[best];
      tip.style.display = 'block';
      tip.style.left = ((bx(best) + bw / 2) / W * rect.width) + 'px';
      tip.style.top = (y(p.value) / H * rect.height) + 'px';
      tip.innerHTML = `${esc(fmtDate(p.date))}<br><span class="tv">${esc(fmtVal(p.value))}</span>`;
    };
    svg.addEventListener('mousemove', onMove);
    svg.addEventListener('touchstart', onMove, { passive: true });
    svg.addEventListener('touchmove', onMove, { passive: true });
    svg.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  }

  // ---------- phone tab bar ----------
  const $tabbar = document.getElementById('tabbar');
  const $backdrop = document.getElementById('nav-backdrop');
  function closeDrawer() {
    document.body.classList.remove('nav-open');
    $backdrop.hidden = true;
  }
  function openDrawer(focusClients) {
    document.body.classList.add('nav-open');
    $backdrop.hidden = false;
    if (focusClients) {
      uiState.navClients = true;
      renderSidebar();
      // wait for the drawer to become visible; a hidden field cannot take focus
      requestAnimationFrame(() => document.getElementById('nav-q')?.focus());
    }
    $side.scrollTop = focusClients ? 0 : $side.scrollHeight;
  }
  // the drawer tabs have no page of their own, so only the real routes light up
  function syncTabbar(section) {
    const current = section === '' ? '/' : '/' + section;
    $tabbar.querySelectorAll('[data-tab]').forEach((b) => {
      if (b.dataset.tab === current) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
  }
  $tabbar.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => {
    closeDrawer();
    if (location.hash.slice(1) === b.dataset.tab) render();
    else location.hash = b.dataset.tab;
  }));
  $tabbar.querySelectorAll('[data-tab-menu]').forEach((b) => b.addEventListener('click', () => {
    if (document.body.classList.contains('nav-open')) closeDrawer();
    else openDrawer(b.dataset.tabMenu === 'clients');
  }));
  $backdrop.addEventListener('click', closeDrawer);
  $side.addEventListener('click', (ev) => { if (ev.target.closest('a')) closeDrawer(); });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') closeDrawer(); });

  let navDepth = 0; // how deep the previous screen was, so we know which way to slide
  function render() {
    const hash = location.hash.slice(1) || '/';
    const parts = hash.split('/').filter(Boolean);
    window.scrollTo(0, 0);
    if (motionOk()) {
      $app.classList.remove('slide-fwd', 'slide-back');
      void $app.offsetWidth; // restart the animation even when the class is unchanged
      $app.classList.add(parts.length < navDepth ? 'slide-back' : 'slide-fwd');
    }
    navDepth = parts.length;
    requestAnimationFrame(countUpStats);
    const widePage = parts[0] === 'duo' && (parts[2] === 'training' || parts[2] === 'schema' || parts[2] === 'vrij');
    $app.classList.toggle('wide', widePage);
    document.body.classList.toggle('wide-page', widePage);
    closeDrawer();
    renderSidebar();
    syncTabbar(parts[0] || '');
    if (parts[0] === 'klant' && parts[2] === 'schema') return viewSchema(parts[1], parts[3]);
    if (parts[0] === 'klant' && parts[2] === 'training') return viewWorkout(parts[1], parts[3]);
    if (parts[0] === 'klant' && parts[2] === 'bewerk') return viewWorkout(parts[1], null, parts[3]);
    if (parts[0] === 'klant' && parts[2] === 'metingen') return viewMeasurements(parts[1]);
    if (parts[0] === 'klant' && parts[2] === 'profiel') return viewProfile(parts[1]);
    if (parts[0] === 'klant' && parts[2] === 'voeding') return viewNutrition(parts[1], parts[3] || todayIso());
    if (parts[0] === 'klant' && parts[2] === 'overzicht') return viewOverview(parts[1]);
    if (parts[0] === 'klant' && parts[2] === 'vergelijk') return viewCompare(parts[1]);
    if (parts[0] === 'klant' && parts[2] === 'rapport') return viewReport(parts[1]);
    if (parts[0] === 'klant' && parts[2] === 'oefening') return viewExercise(parts[1], parts[3]);
    if (parts[0] === 'klant' && parts[2] === 'programma') return viewProgram(parts[1]);
    if (parts[0] === 'klant' && parts[2] === 'vrij') return viewPickExercises(parts[1]);
    if (parts[0] === 'klant' && parts[2] === 'sjabloon') return viewTemplatePick('klant', parts[1]);
    if (parts[0] === 'klant') return viewClient(parts[1]);
    if (parts[0] === 'sjabloon') return viewTemplate(parts[1]);
    if (parts[0] === 'agenda') return viewAgenda(parts[1] || todayIso());
    if (parts[0] === 'zakelijk') return viewBusiness();
    if (parts[0] === 'abonnementen') return parts[1] === 'vormen' ? viewSubTypes() : viewSubscriptions();
    if (parts[0] === 'abonnement') return viewSubscription(parts[1]);

    if (parts[0] === 'vanklanten') return viewClientFeed(parts[1] || null);

    if (parts[0] === 'duo' && parts[2] === 'vrij') return viewDuoPick(parts[1]);
    if (parts[0] === 'duo' && parts[2] === 'sjabloon') return viewTemplatePick('duo', parts[1]);

    if (parts[0] === 'duo') return viewDuo(parts[1]);
    return viewToday();
  }

  // --- vandaag: what the day looks like ---
  function viewToday() {
    const clients = sortedClients().filter((c) => !c.archived);
    const lowCredit = clients.map((c) => ({ c, l: creditLedger(c.id) })).filter((x) => x.l && x.l.low);
    const today = appointmentsOn(todayIso());
    const tomorrow = appointmentsOn(addDays(todayIso(), 1));
    const lastDateOf = (id) => { const ws = workoutsOf(id); return ws.length ? ws[ws.length - 1].date : null; };
    const seen = clients.map((c) => ({ c, date: lastDateOf(c.id) }));
    const quiet = seen.filter((x) => !x.date || x.date < addDays(todayIso(), -7))
      .sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    const recent = seen.filter((x) => x.date).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 3);
    const apptHash = (a) => a.duoId ? `/duo/${a.duoId}` : `/klant/${a.clientId}`;
    const apptLine = (a) => `<div class="row" style="margin-bottom:4px"><div class="grow sub">${a.time ? esc(a.time) + ' · ' : ''}${esc(apptTitle(a))}</div>

      a.status === 'gepland' ? `<button class="small" data-nav="${apptHash(a)}">Start ›</button>` : ''}</div>`;
    // how the day stands: what is done, and who is next
    const dayDone = today.filter((a) => a.status === 'geweest' || a.status === 'no-show').length;
    const nextAppt = today.find((a) => a.status === 'gepland');
    const nextName = nextAppt ? apptTitle(nextAppt) : null;
    const nextCredit = nextAppt && nextAppt.clientId ? creditLedger(nextAppt.clientId) : null;

    $app.innerHTML = topbar('Vandaag') +

          ${nextAppt

               <div class="sub">${[
                 nextDay ? `dag ${dayLetter(nextDay.index)} — ${esc(nextDay.schema.name)}` : '',

            : `<div class="next-name">Dag rond</div><div class="sub">Alle ${today.length} sessies afgewerkt.</div>`}

      `<div class="eyebrow">Agenda</div>
      <div class="card tappable" data-nav="/agenda" role="link" tabindex="0">
        ${today.length ? `<div class="title" style="margin-bottom:6px">Vandaag (${today.length})</div>${today.map(apptLine).join('')}`

      (quiet.length ? `<div class="eyebrow">Langer dan een week niet geweest</div>

        <button class="primary wide" type="submit">Klant toevoegen</button>
      </form>
      <div class="eyebrow">Nieuw duo</div>` +
      (clients.length >= 2 ? `<form class="card" id="add-duo">
        <label class="field"><span>Klant 1</span><select name="a">${clients.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>
        <label class="field"><span>Klant 2</span><select name="b">${clients.map((c, i) => `<option value="${c.id}" ${i === 1 ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>

    bindNav();
    document.getElementById('add-client').addEventListener('submit', (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const name = String(f.get('name')).trim();
      if (!name) return;
      const c = { id: uid(), name, goal: String(f.get('goal')).trim() };
      db.clients.push(c); save();
      location.hash = `/klant/${c.id}`;
    });
    const demo = document.getElementById('demo-btn');
    if (demo) demo.addEventListener('click', () => { loadDemo(); save(); render(); });
    const duoForm = document.getElementById('add-duo');
    if (duoForm) duoForm.addEventListener('submit', (ev) => {

  // --- client detail ---
  const uiState = {
    metric: 'top', navClients: true, navDuos: true, navTemplates: true, measMetric: 'weight',
    period: 'all', comparePicks: [], compareMetric: 'top',
    navQuery: '', navArchived: false, foodQuery: '', subTypeEditing: null,
    nutri: { moment: null, query: '', results: [], message: '' }, navBusiness: true, navLibrary: true, libQuery: '', libEquipment: '', libKind: '', libShowArchived: false, libEditing: null, libSort: 'used',
  };
  // unsaved in-progress training, auto-saved per keystroke; device-local (outside db, not synced)
  const TRAINING_DRAFT_KEY = 'coachlog-training-draft';
  function anyTrainingDraft() {
    try { return JSON.parse(localStorage.getItem(TRAINING_DRAFT_KEY)); } catch { return null; }
  }
  function readTrainingDraft(ref) {
    const d = anyTrainingDraft();
    return d && d.ref === ref ? d : null;
  }
  function writeTrainingDraft(data) {
    try { localStorage.setItem(TRAINING_DRAFT_KEY, JSON.stringify({ ...data, savedAt: Date.now() })); } catch { /* best-effort */ }
  }
  function clearTrainingDraft(ref) {
    if (readTrainingDraft(ref)) localStorage.removeItem(TRAINING_DRAFT_KEY);
  }
  function fmtDraftTime(ts) {
    const d = new Date(ts);
    const time = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    return iso === todayIso() ? time : `${fmtDate(iso)}, ${time}`;
  }
  // resume banner on the client/duo page when an unsaved training matches the prefix
  function draftResumeHtml(prefix) {
    const d = anyTrainingDraft();
    if (!d || !d.ref.startsWith(prefix)) return '';
    return `<div class="note-box"><strong>Niet-opgeslagen training</strong> van ${esc(fmtDraftTime(d.savedAt))} — je invoer staat er nog.
      <div class="actions" style="margin-top:8px"><button class="small primary" data-nav="${esc(d.ref)}">Hervatten</button>
      <button class="small" id="discard-draft">Weggooien</button></div></div>`;
  }
  function bindDraftDiscard() {
    const b = document.getElementById('discard-draft');
    if (b) b.addEventListener('click', () => { localStorage.removeItem(TRAINING_DRAFT_KEY); render(); });
  }

  let pendingFree = []; // exercises picked for a free session, set by viewPickExercises
  let pendingDuo = null; // { duoId, picks: { [clientId]: [names] } }, set by viewDuoPick
  // put the client's schemas in a fixed order; the app then knows which day is up
  function viewProgram(clientId) {
    const c = clientById(clientId);
    if (!c) { location.hash = '/'; return; }
    const schemas = schemasOf(clientId);
    const existing = programOf(clientId);
    const draft = {
      name: existing ? existing.name : 'Weekprogramma',
      schemaIds: existing ? existing.schemaIds.filter((id) => schemaById(id)) : [],
    };

    const paint = () => {
      const spare = schemas.filter((sc) => !draft.schemaIds.includes(sc.id));
      $app.innerHTML = topbar(`Programma — ${c.name}`, `/klant/${clientId}`) +
        (schemas.length
          ? `<label class="field"><span>Naam</span><input id="pr-name" value="${esc(draft.name)}" placeholder="bijv. Push/Pull/Legs"></label>
             <div class="eyebrow">Volgorde</div>` +
            (draft.schemaIds.length
              ? draft.schemaIds.map((sid, i) => {
                const sc = schemaById(sid);
                return `<div class="card"><div class="row">
                  <span class="day-chip"><b>${dayLetter(i)}</b></span>
                  <div class="grow"><div class="title">${esc(sc.name)}</div>
                    <div class="sub">${sc.exercises.map((e) => esc(e.name)).join(' · ') || 'nog geen oefeningen'}</div></div>
                  <button type="button" class="small ghost" data-pr-up="${i}" aria-label="Omhoog" ${i === 0 ? 'disabled' : ''}>↑</button>
                  <button type="button" class="small ghost" data-pr-down="${i}" aria-label="Omlaag" ${i === draft.schemaIds.length - 1 ? 'disabled' : ''}>↓</button>
                  <button type="button" class="small ghost danger" data-pr-rm="${i}" aria-label="Verwijderen">✕</button>
                </div></div>`;
              }).join('')
              : `<p class="mut">Nog geen dagen gekozen. Voeg hieronder een schema toe.</p>`) +
            (spare.length
              ? `<div class="eyebrow">Toevoegen</div>
                 <div class="actions">${spare.map((sc) => `<button type="button" data-pr-add="${sc.id}">+ ${esc(sc.name)}</button>`).join('')}</div>`
              : '') +
            `<hr class="divider">
             <div class="actions">
               <button class="primary" id="pr-save">Programma opslaan</button>
               ${existing ? `<button class="danger ghost" id="pr-del">Programma verwijderen</button>` : ''}
             </div>`
          : `<div class="empty"><p>${esc(c.name)} heeft nog geen schema's. Maak er eerst twee of drie, dan kun je ze hier in een ritme zetten.</p>
              <div class="actions"><button class="primary" data-nav="/klant/${clientId}/schema/nieuw">+ Nieuw schema</button></div></div>`);

      bindNav();
      const nameIn = document.getElementById('pr-name');
      const keepName = () => { if (nameIn) draft.name = nameIn.value; };
      document.querySelectorAll('[data-pr-add]').forEach((b) => b.addEventListener('click', () => {
        keepName();
        draft.schemaIds.push(b.dataset.prAdd);
        paint();
      }));
      document.querySelectorAll('[data-pr-rm]').forEach((b) => b.addEventListener('click', () => {
        keepName();
        draft.schemaIds.splice(+b.dataset.prRm, 1);
        paint();
      }));
      document.querySelectorAll('[data-pr-up], [data-pr-down]').forEach((b) => b.addEventListener('click', () => {
        keepName();
        const up = b.dataset.prUp !== undefined;
        const i = +(up ? b.dataset.prUp : b.dataset.prDown);
        const to = up ? i - 1 : i + 1;
        if (to < 0 || to >= draft.schemaIds.length) return;
        [draft.schemaIds[i], draft.schemaIds[to]] = [draft.schemaIds[to], draft.schemaIds[i]];
        paint();
      }));
      const saveBtn = document.getElementById('pr-save');
      if (saveBtn) saveBtn.addEventListener('click', () => {
        keepName();
        if (!draft.schemaIds.length) { alert('Kies minstens één schema.'); return; }
        const name = draft.name.trim() || 'Weekprogramma';
        if (existing) { existing.name = name; existing.schemaIds = [...draft.schemaIds]; }
        else db.programs.push({ id: uid(), clientId, name, schemaIds: [...draft.schemaIds] });
        save();
        location.hash = `/klant/${clientId}`;
      });
      const delBtn = document.getElementById('pr-del');
      if (delBtn) delBtn.addEventListener('click', () => {
        if (!confirm('Dit programma verwijderen? De schema\'s zelf blijven bestaan.')) return;
        db.programs = db.programs.filter((x) => x.id !== existing.id);
        save();
        location.hash = `/klant/${clientId}`;
      });
    };
    paint();
  }

  function viewClient(id) {
