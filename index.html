        syncDraft();
        const picked = document.querySelector(`[data-extra-kind="${mi}"]`).value;
        const known = kindFor(draft[mi].client.id, name);
        draft[mi].exercises.push(mkExercise(draft[mi].client.id, { name, kind: known !== 'kracht' ? known : picked }));
        repaintKeeping();
      }));
      document.getElementById('duo-form').addEventListener('submit', (ev) => {
        ev.preventDefault();
        syncDraft();
        const f = new FormData(ev.target);
        const date = String(f.get('date'));
        const notes = String(f.get('notes')).trim();
        const durationMin = Math.max(1, Math.round((Date.now() - startedAt) / 60000));
        let saved = 0;
        const allEntries = [], allPrs = [];
        for (const mem of draft) {
          const entries = mem.exercises
            .map((ex) => ({
              name: ex.name, exerciseId: ensureExercise(ex.name, ex.kind).id, kind: ex.kind, superset: ex.superset || null,
              sets: ex.sets.filter((s) => filledSet(s, ex.kind)).map(({ done, ...rest }) => rest),
            }))
            .filter((ex) => ex.sets.length);
          if (!entries.length) continue;
          allPrs.push(...prsIn(mem.client.id, entries).map((r) => ({ ...r, name: `${mem.client.name} — ${r.name}` })));
          allEntries.push(...entries.map((e) => ({ ...e, name: `${mem.client.name} — ${e.name}` })));
          db.workouts.push({
            id: uid(), clientId: mem.client.id, schemaId: duoSchema ? duoSchema.id : null,
            duoId, date, notes, durationMin, coach: db.settings.coachName || undefined, entries,
          });
          saved++;
        }
        if (!saved) { alert('Vul minstens één set in.'); return; }
        stopTimer();
        clearInterval(runSessionClock.id);
        save();
        clearTrainingDraft(draftRef);
        pendingDuo = null;
        openSessionSummary({
          title: duoName(duo),
          entries: allEntries,
          durationMin,
          prs: allPrs,
          backHash: `/duo/${duoId}`,
        });
      });
    };
    paint();
  }

  // --- schema editor ---
  function viewSchema(clientId, schemaId) {
    const c = clientById(clientId);
    if (!c) { location.hash = '/'; return; }
    const isNew = schemaId === 'nieuw';
    const schema = isNew
      ? { id: uid(), clientId, name: '', exercises: [] }
      : schemaById(schemaId);
    if (!schema) { location.hash = `/klant/${clientId}`; return; }
    const newTarget = () => ({ reps: 10, weight: 0 });
    const newExercise = () => ({ id: uid(), name: '', targets: [newTarget(), newTarget(), newTarget()] });
    const draft = JSON.parse(JSON.stringify(schema));
    draft.exercises.forEach((e) => { if (!e.targets || !e.targets.length) e.targets = [newTarget(), newTarget(), newTarget()]; });
    if (!draft.exercises.length) draft.exercises.push(newExercise());

    const paint = () => {
      $app.innerHTML = topbar(isNew ? 'Nieuw schema' : 'Schema bewerken', `/klant/${clientId}`) +
        `<form id="schema-form">
          <label class="field"><span>Naam schema</span><input name="name" required placeholder="bijv. Full body A" value="${esc(draft.name)}"></label>
          <datalist id="lib-names">${libraryNames().map((n) => `<option value="${esc(n)}">`).join('')}</datalist>
          <div class="eyebrow">Oefeningen — elke set apart</div>
          ${draft.exercises.map((e, i) => `<div class="card">
            <div class="row" style="margin-bottom:8px">
              <input data-exname="${i}" class="grow" list="lib-names" required placeholder="bijv. Squat" value="${esc(e.name)}">
              <button type="button" class="small ghost" data-ex-up="${i}" aria-label="Omhoog" ${i === 0 ? 'disabled' : ''}>↑</button>
              <button type="button" class="small ghost" data-ex-down="${i}" aria-label="Omlaag" ${i === draft.exercises.length - 1 ? 'disabled' : ''}>↓</button>
              <button type="button" class="small danger ghost" data-rm-ex="${i}" aria-label="Verwijder oefening">✕</button>
            </div>
            <label class="field"><span>Soort</span>
              <select data-exkind="${i}">${Object.entries(KIND_LABELS).map(([k, l]) => `<option value="${k}" ${(e.kind || 'kracht') === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
            </label>
            ${targetRowsHtml(String(i), e.targets, e.kind || 'kracht', 'rm-tgt')}
            <button type="button" class="small" data-add-tgt="${i}">+ Set</button>
          </div>`).join('')}
          <button type="button" id="add-ex" class="small" style="margin:4px 0 16px">+ Oefening</button>
          <button class="primary wide" type="submit">Schema opslaan</button>
        </form>` +
        (!isNew ? `<hr class="divider">
          <div class="row" style="margin-bottom:10px">
            <select id="copy-target" class="grow"><option value="">Kopieer naar klant…</option>${
              sortedClients().filter((x) => !x.archived && x.id !== clientId).map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>
            <button type="button" class="small" id="copy-schema">Kopiëren</button>
          </div>
          <button class="danger ghost" id="del-schema">Schema verwijderen</button>` : '');

      bindNav();
      const syncDraft = () => {
        draft.name = document.querySelector('[name="name"]').value;
        document.querySelectorAll('[data-exname]').forEach((inp) => {
          draft.exercises[+inp.dataset.exname].name = inp.value;
        });
        document.querySelectorAll('[data-exkind]').forEach((sel) => {
          draft.exercises[+sel.dataset.exkind].kind = sel.value;
        });
        document.querySelectorAll('[data-tgt]').forEach((inp) => {
          const [i, si] = inp.dataset.tgt.split('.').map(Number);
          draft.exercises[i].targets[si][inp.dataset.f] = num(inp.value);
        });
      };
      document.querySelectorAll('[data-exkind]').forEach((sel) => sel.addEventListener('change', () => {
        syncDraft();
        paint();
      }));
      document.querySelectorAll('[data-ex-up], [data-ex-down]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        const up = b.dataset.exUp !== undefined;
        const i = +(up ? b.dataset.exUp : b.dataset.exDown);
        const to = up ? i - 1 : i + 1;
        if (to < 0 || to >= draft.exercises.length) return;
        [draft.exercises[i], draft.exercises[to]] = [draft.exercises[to], draft.exercises[i]];
        paint();
      }));
      document.getElementById('add-ex').addEventListener('click', () => {
        syncDraft();
        draft.exercises.push(newExercise());
        paint();
      });
      document.querySelectorAll('[data-rm-ex]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        draft.exercises.splice(+b.dataset.rmEx, 1);
        if (!draft.exercises.length) draft.exercises.push(newExercise());
        paint();
      }));
      document.querySelectorAll('[data-add-tgt]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        const targets = draft.exercises[+b.dataset.addTgt].targets;
        targets.push(targets.length ? { ...targets[targets.length - 1] } : newTarget());
        paint();
      }));
      document.querySelectorAll('[data-rm-tgt]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        const [i, si] = b.dataset.rmTgt.split('.').map(Number);
        draft.exercises[i].targets.splice(si, 1);
        if (!draft.exercises[i].targets.length) draft.exercises[i].targets.push(newTarget());
        paint();
      }));
      document.getElementById('schema-form').addEventListener('submit', (ev) => {
        ev.preventDefault();
        syncDraft();
        draft.name = draft.name.trim();
        draft.exercises = draft.exercises
          .filter((e) => e.name.trim())
          .map((e) => ({ id: e.id, name: e.name.trim(), kind: ensureExercise(e.name.trim(), e.kind || 'kracht').kind, targets: e.targets }));
        if (!draft.name || !draft.exercises.length) return;
        if (isNew) db.schemas.push(draft);
        else db.schemas[db.schemas.findIndex((s) => s.id === schemaId)] = draft;
        save(); location.hash = `/klant/${clientId}`;
      });
      const copyBtn = document.getElementById('copy-schema');
      if (copyBtn) copyBtn.addEventListener('click', () => {
        const target = document.getElementById('copy-target').value;
        if (!target) { alert('Kies eerst een klant.'); return; }
        syncDraft();
        db.schemas.push({
          id: uid(), clientId: target, name: draft.name.trim() || 'Schema',
          exercises: copyExercises(draft.exercises.filter((e) => e.name.trim())),
        });
        save();
        alert(`Schema gekopieerd naar ${clientById(target).name}.`);
      });
      const del = document.getElementById('del-schema');
      if (del) del.addEventListener('click', () => {
        if (!confirm('Dit schema verwijderen? Gelogde trainingen blijven bewaard.')) return;
        db.schemas = db.schemas.filter((s) => s.id !== schemaId);
        save(); location.hash = `/klant/${clientId}`;
      });
    };
    paint();
  }

  // --- workout logging ---
  function viewWorkout(clientId, schemaId, editId) {
    const c = clientById(clientId);
    const editing = editId ? db.workouts.find((w) => w.id === editId && w.clientId === clientId) : null;
    if (editId && !editing) { location.hash = c ? `/klant/${clientId}` : '/'; return; }
    const isFree = !editing && schemaId === 'vrij';
    const schema = editing ? schemaById(editing.schemaId) : isFree ? null : schemaById(schemaId);
    if (!c || (!editing && !isFree && !schema)) { location.hash = c ? `/klant/${clientId}` : '/'; return; }
    const draftRef = `/klant/${clientId}/` + (editId ? `bewerk/${editId}` : `training/${isFree ? 'vrij' : schemaId}`);
    const stored = readTrainingDraft(draftRef);
    if (isFree && !pendingFree.length && !stored) { location.hash = `/klant/${clientId}/vrij`; return; }

    // prefill: most recent logged sets of this exercise (any session), else per-set schema targets
    const prefill = (ex) => {
      const kind = ex.kind || kindFor(clientId, ex.name);
      const prev = lastEntryFor(clientId, ex.name, editing && editing.id);
      // everything cleared last time? then start from the heavier weight instead of a copy
      const step = editing ? null : progressSuggestion(clientId, ex.name, kind, ex.targets, editing && editing.id);
      if (prev && step) {
        return prev.entry.sets.map((s) => ({
          ...s, note: '', type: setType(s) === 'warmup' ? 'warmup' : 'normaal',
          weight: setType(s) === 'warmup' ? s.weight : step.to,
        }));
      }
      if (prev) return prev.entry.sets.map((s) => ({ ...s, note: '', type: setType(s) === 'warmup' ? 'warmup' : 'normaal' }));
      const targets = (ex.targets && ex.targets.length ? ex.targets : null) || targetsFor(clientId, ex.name);
      if (targets) return targets.map((t) => ({ ...t }));
      return kind === 'cardio'
        ? [{ distance: 0, minutes: 0 }]
        : Array.from({ length: 3 }, () => ({ reps: 10, weight: 0 }));
    };
    const mkExercise = (ex) => ({
      name: ex.name,
      kind: ex.kind || kindFor(clientId, ex.name),
      superset: ex.superset || null,
      sets: prefill(ex),
    });
    const draft = stored
      ? stored.entries.map((e) => ({ name: e.name, kind: e.kind || kindFor(clientId, e.name), superset: e.superset || null, sets: e.sets.map((s) => ({ ...s })) }))
      : editing
        ? editing.entries.map((e) => ({ name: e.name, kind: entryKind(e), superset: e.superset || null, sets: e.sets.map((s) => ({ ...s })) }))
        : (isFree ? pendingFree.map((n) => ({ name: n })) : schema.exercises).map(mkExercise);
    const initDate = stored ? stored.date : editing ? editing.date : todayIso();
    const initNotes = stored ? stored.notes : editing ? editing.notes || '' : '';
    const initDuration = stored && stored.duration !== undefined ? stored.duration : editing ? editing.durationMin || '' : '';
    const restoredAt = stored ? stored.savedAt : null;
    let swapping = null; // exercise index currently in swap mode
    let infoOpen = null; // exercise index whose explanation is open
    let menuOpen = null; // exercise index whose ⋯ menu is open
    let openMore = null; // "xi.si" of the set whose options are open
    let tool = null; // 'plates' | 'interval'
    const startedAt = (stored && stored.startedAt) || Date.now();

    const paint = () => {
      const extraOptions = [...new Set([...knownExercises(clientId), ...libraryNames()])]
        .filter((n) => !draft.some((d) => d.name.toLowerCase() === n.toLowerCase()));
      $app.innerHTML = topbar(editing ? `Bewerken — ${c.name}` : `Training — ${c.name}`, `/klant/${clientId}`) +
        `<p style="margin:0 0 12px"><span class="badge">${esc(schema ? schema.name : editing && editing.duoId ? (duoSchemaById(editing.schemaId) || {}).name || 'Duo-training' : 'Vrije training')}</span></p>` +
        ((c.injuries || c.medical) ? `<div class="note-box"><strong>Let op:</strong> ${esc([c.injuries, c.medical].filter(Boolean).join(' · '))}</div>` : '') +
        (() => { const l = creditLedger(clientId); return l && l.low ? `<div class="note-box"><strong>Tegoed:</strong> nog ${l.remaining} sessie${l.remaining === 1 ? '' : 's'} na deze training.</div>` : ''; })() +
        (restoredAt ? `<div class="note-box">Automatisch bewaarde invoer hersteld (${esc(fmtDraftTime(restoredAt))}). <button type="button" class="small" id="discard-draft">Opnieuw beginnen</button></div>` : '') +
        `<form id="wo-form">
          <div class="actions" style="margin-bottom:12px">
            <button type="button" class="small" data-rest-set="all">⏱ Rust</button>
            <button type="button" class="small" id="tool-plates">🧮 Schijven</button>
            <button type="button" class="small" id="tool-interval">⏲ Interval</button>
          </div>
          ${toolPanelHtml(tool)}
          ${editing ? '' : sessionBarHtml()}
          <label class="field"><span>Datum</span><input type="date" name="date" value="${esc(initDate)}" required></label>
          ${editing ? `<label class="field"><span>Duur (min)</span><input type="number" min="0" name="duration" value="${esc(String(initDuration))}" placeholder="–"></label>` : ''}
          ${draft.map((ex, xi) => {
            const prev = lastEntryFor(clientId, ex.name, editing && editing.id);
            const linked = ex.superset && draft.some((d, i) => i !== xi && d.superset === ex.superset);
            return `<div class="card mg-edge${linked ? ' ss-mark' : ''}" style="--mg:${groupColour(ex.name, ex.kind)}">
            <div class="row" style="margin-bottom:2px">
              <div class="title grow">${esc(ex.name)}${linked ? ` <span class="badge">Superset ${esc(ex.superset)}</span>` : ''}${ex.kind !== 'kracht' ? ` <span class="badge">${KIND_LABELS[ex.kind]}</span>` : ''}</div>
              <button type="button" class="small ghost" data-chart="${xi}" aria-label="Progressiegrafiek" ${prev ? '' : 'disabled'}>📈</button>
              <button type="button" class="small ghost" data-info="${xi}" aria-label="Uitleg">${hasInfo(exerciseByName(ex.name)) || clientNote(clientId, ex.name) ? 'ℹ️' : 'ℹ'}</button>
              <button type="button" class="small ghost" data-exmenu="${xi}" aria-label="Meer voor deze oefening" aria-expanded="${menuOpen === xi}">⋯</button>
            </div>
            ${menuOpen === xi ? `<div class="ex-menu">
              <button type="button" class="small" data-up="${xi}" ${xi === 0 ? 'disabled' : ''}>↑ Omhoog</button>
              <button type="button" class="small" data-down="${xi}" ${xi === draft.length - 1 ? 'disabled' : ''}>↓ Omlaag</button>
              <button type="button" class="small" data-link="${xi}" ${xi === 0 ? 'disabled' : ''}>⛓ Superset</button>
              <button type="button" class="small" data-rest-set="${xi}">⏱ Rust</button>
              <button type="button" class="small" data-swap="${xi}">⇄ Vervangen</button>
            </div>` : ''}
            ${infoOpen === xi ? `<div class="info-panel">${exerciseInfoHtml(ex.name, clientId)}</div>` : ''}
            <div class="mut" style="margin-bottom:8px">${esc(prevSummary(prev, ex.kind))}</div>
            ${progressHintHtml(clientId, ex, editing && editing.id)}
            ${swapping === xi ? `<div class="row" style="margin-bottom:10px">
              <input id="swap-input" class="grow" list="swap-list" placeholder="Vervangende oefening">
              <button type="button" class="small primary" id="swap-ok">OK</button>
              <datalist id="swap-list">${[...new Set([...knownExercises(clientId), ...libraryNames()])]
                .filter((n) => !draft.some((d) => d.name.toLowerCase() === n.toLowerCase()))
                .map((n) => `<option value="${esc(n)}">`).join('')}</datalist>
            </div>` : ''}
            <div class="pr-live" data-pr-live="${xi}" hidden></div>
            ${setRowsHtml('set', xi, ex.sets, prev && prev.entry.sets, ex.kind, openMore)}
            <button type="button" class="small" data-add-set="${xi}">+ Set</button>
          </div>`;
          }).join('')}
          <div class="card">
            <label class="field"><span>Oefening toevoegen aan deze sessie</span>
              <input id="extra-ex" list="ex-list" placeholder="bijv. Lat pulldown"></label>
            <datalist id="ex-list">${extraOptions.map((n) => `<option value="${esc(n)}">`).join('')}</datalist>
            <div class="row">
              <select id="extra-kind" class="grow">${Object.entries(KIND_LABELS).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select>
              <button type="button" class="small" id="add-extra">+ Oefening</button>
            </div>
          </div>
          <label class="field"><span>Notities (optioneel)</span><textarea name="notes" rows="2" placeholder="bijv. voelde sterk, knie licht gevoelig">${esc(initNotes)}</textarea></label>
          <button class="primary wide" type="submit">${editing ? 'Wijzigingen opslaan' : 'Training opslaan'}</button>
        </form>`;

      bindNav();
      const syncDraft = () => {
        document.querySelectorAll('[data-set]').forEach((inp) => {
          const [xi, si] = inp.dataset.set.split('.').map(Number);
          const f = inp.dataset.f;
          if (f === 'note') draft[xi].sets[si].note = inp.value;
          else draft[xi].sets[si][f] = f === 'rir' && inp.value.trim() === '' ? undefined : num(inp.value);
        });
      };
      const keepFields = () => ({
        date: document.querySelector('[name="date"]').value,
        notes: document.querySelector('[name="notes"]').value,
        duration: (document.querySelector('[name="duration"]') || {}).value,
      });
      const restoreFields = (v) => {
        document.querySelector('[name="date"]').value = v.date;
        document.querySelector('[name="notes"]').value = v.notes;
        const d = document.querySelector('[name="duration"]');
        if (d && v.duration !== undefined) d.value = v.duration;
      };
      // draft is the source of truth here: callers sync the DOM into it before mutating,
      // so re-reading the (now stale) DOM would resurrect removed sets
      const persistDraft = () => {
        const v = keepFields();
        writeTrainingDraft({ ref: draftRef, startedAt, date: v.date, notes: v.notes, duration: v.duration, entries: draft });
      };
      const syncAndPersist = () => { syncDraft(); persistDraft(); };
      const repaintKeeping = () => { persistDraft(); const v = keepFields(); paint(); restoreFields(v); };
      const form = document.getElementById('wo-form');
      form.addEventListener('input', syncAndPersist);
      form.addEventListener('change', syncAndPersist);
      const disc = document.getElementById('discard-draft');
      if (disc) disc.addEventListener('click', () => { clearTrainingDraft(draftRef); render(); });

      draft.forEach((ex, xi) => {
        if (ex.kind !== 'cardio') bindPrLive('set', String(xi), clientId, ex.name, editing && editing.id);
      });
      bindSetControls('set', {
        syncDraft,
        repaint: repaintKeeping,
        openMore: () => openMore,
        setOpenMore: (v) => { openMore = v; },
        getSet: (key) => { const [xi, si] = key.split('.').map(Number); return draft[xi].sets[si]; },
        removeSet: (key) => { const [xi, si] = key.split('.').map(Number); draft[xi].sets.splice(si, 1); },
        restFor: (key) => { const ex = draft[Number(String(key).split('.')[0])]; return ex ? restFor(ex.name) : null; },
      });
      bindToolPanel(() => tool, (v) => { tool = v; }, repaintKeeping);

      document.querySelectorAll('[data-up], [data-down]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        const up = b.dataset.up !== undefined;
        const xi = +(up ? b.dataset.up : b.dataset.down);
        const to = up ? xi - 1 : xi + 1;
        if (to < 0 || to >= draft.length) return;
        [draft[xi], draft[to]] = [draft[to], draft[xi]];
        openMore = null;
        repaintKeeping();
      }));
      document.querySelectorAll('[data-link]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        const xi = +b.dataset.link;
        const prevEx = draft[xi - 1];
        if (draft[xi].superset && draft[xi].superset === prevEx.superset) {
          draft[xi].superset = null;
        } else {
          const group = prevEx.superset || String.fromCharCode(65 + draft.filter((d, i) => i < xi && d.superset).length);
          prevEx.superset = group;
          draft[xi].superset = group;
        }
        repaintKeeping();
      }));
      document.querySelectorAll('[data-info]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        infoOpen = infoOpen === +b.dataset.info ? null : +b.dataset.info;
        repaintKeeping();
      }));
      document.querySelectorAll('[data-chart]').forEach((b) => b.addEventListener('click', () => {
        openSessionChart(clientId, draft[+b.dataset.chart].name, editing && editing.id);
      }));
      document.querySelectorAll('[data-exmenu]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        menuOpen = menuOpen === +b.dataset.exmenu ? null : +b.dataset.exmenu;
        repaintKeeping();
      }));
      if (!editing) runSessionClock(startedAt, () => draft.flatMap((ex) => ex.sets));
      document.querySelectorAll('[data-swap]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        swapping = swapping === +b.dataset.swap ? null : +b.dataset.swap;
        repaintKeeping();
        const inp = document.getElementById('swap-input');
        if (inp) inp.focus();
      }));
      const swapOk = document.getElementById('swap-ok');
      if (swapOk) swapOk.addEventListener('click', () => {
        const name = document.getElementById('swap-input').value.trim();
        if (!name || draft.some((d) => d.name.toLowerCase() === name.toLowerCase())) return;
        syncDraft();
        draft[swapping] = mkExercise({ name });
        swapping = null;
        repaintKeeping();
      });
      document.querySelectorAll('[data-add-set]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        const sets = draft[+b.dataset.addSet].sets;
        const lastSet = sets[sets.length - 1];
        sets.push(lastSet ? { ...lastSet, note: '' } : { reps: 10, weight: 0 });
        repaintKeeping();
      }));
      document.getElementById('add-extra').addEventListener('click', () => {
        const inp = document.getElementById('extra-ex');
        const name = inp.value.trim();
        if (!name || draft.some((d) => d.name.toLowerCase() === name.toLowerCase())) return;
        syncDraft();
        const picked = document.getElementById('extra-kind').value;
        const known = kindFor(clientId, name);
        draft.push(mkExercise({ name, kind: known !== 'kracht' ? known : picked }));
        repaintKeeping();
      });
      document.getElementById('wo-form').addEventListener('submit', (ev) => {
        ev.preventDefault();
        syncDraft();
        const f = new FormData(ev.target);
        const entries = draft
          .map((ex) => ({
            name: ex.name, exerciseId: ensureExercise(ex.name, ex.kind).id, kind: ex.kind, superset: ex.superset || null,
            // `done` is only for the tick boxes during the session, it does not belong in the log
            sets: ex.sets.filter((s) => filledSet(s, ex.kind)).map(({ done, ...rest }) => rest),
          }))
          .filter((ex) => ex.sets.length);
        if (!entries.length) { alert('Vul minstens één set in.'); return; }
        const prs = editing ? [] : prsIn(clientId, entries);
        if (editing) {
          editing.entries = entries;
          editing.date = String(f.get('date'));
          editing.notes = String(f.get('notes')).trim();
          const d = num(f.get('duration'));
          editing.durationMin = d > 0 ? d : undefined;
        } else {
          db.workouts.push({
            id: uid(), clientId,
            schemaId: isFree ? null : schemaId,
            date: String(f.get('date')),
            notes: String(f.get('notes')).trim(),
            durationMin: Math.max(1, Math.round((Date.now() - startedAt) / 60000)),
            coach: db.settings.coachName || undefined,
            entries,
          });
        }
        stopTimer();
        clearInterval(runSessionClock.id);
        save();
        clearTrainingDraft(draftRef);
        if (isFree) pendingFree = [];
        if (editing) { location.hash = `/klant/${clientId}`; return; }
        openSessionSummary({
          title: c.name,
          entries,
          durationMin: Math.max(1, Math.round((Date.now() - startedAt) / 60000)),
          prs,
          backHash: `/klant/${clientId}`,
        });
      });
    };
    paint();
  }

  // ---------- export / import ----------
  function exportJson() {
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `coachlog-backup-${todayIso()}.json`;
    a.click();
    db.settings.lastBackupAt = todayIso();
    localStorage.setItem(KEY, JSON.stringify(db));
    URL.revokeObjectURL(a.href);
  }
  // only the exercises, so a list can be shared without any client data in it
  function exportExercises() {
    const rows = [...db.exercises].sort((a, b) => byName(a.name, b.name)).map((e) => ({
      name: e.name, kind: e.kind, group: e.group, equipment: e.equipment,
      hasInstructions: !!e.instructions, archived: !!e.archived,
    }));
    const blob = new Blob([JSON.stringify({ coachlog: 'oefeningen', version: APP_VERSION, exercises: rows }, null, 2)],
      { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `coachlog-oefeningen-${todayIso()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // fills uitleg, foto and video on exercises that already exist; touches nothing else
  function importExerciseInfo(ev) {
    const file = ev.target.files[0];
    if (!file) return;
    ev.target.value = '';
    const reader = new FileReader();
    reader.onload = () => {
      let rows;
      try {
        const d = JSON.parse(reader.result);
        rows = Array.isArray(d) ? d : d.exercises;
        if (!Array.isArray(rows)) throw new Error('geen lijst');
      } catch {
        alert('Dit bestand is geen oefeninfo-bestand.');
        return;
      }
      const byKey = new Map();
      for (const e of db.exercises) {
        byKey.set(exKey(e.name), e);
        for (const a of e.aliases || []) byKey.set(exKey(a), e);
      }
      let filled = 0;
      const missing = [];
      for (const row of rows) {
        const rec = byKey.get(exKey(row.name));
        if (!rec) { missing.push(row.name); continue; }
        if (row.instructions) rec.instructions = String(row.instructions);
        if (row.cues) rec.cues = String(row.cues);
        if (row.videoUrl) rec.videoUrl = safeUrl(row.videoUrl) || rec.videoUrl;
        if (row.group && MUSCLE_GROUPS.includes(row.group)) rec.group = row.group;
        if (row.equipment && EQUIPMENT.includes(row.equipment)) rec.equipment = row.equipment;
        filled++;
      }
      save(); render();
      alert(`${filled} oefening${filled === 1 ? '' : 'en'} bijgewerkt.`
        + (missing.length ? `\n\nNiet gevonden (${missing.length}): ${missing.slice(0, 8).join(', ')}${missing.length > 8 ? '…' : ''}` : ''));
    };
    reader.readAsText(file);
  }

  function importJson(ev) {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const d = JSON.parse(reader.result);
        if (!Array.isArray(d.clients)) throw new Error('ongeldig bestand');
        if (!confirm('Huidige gegevens vervangen door deze back-up?')) return;
        db = normalizeDb(d);
        save(); render();
      } catch {
        alert('Dit bestand is geen geldige Coachlog-back-up.');
      }
    };
    reader.readAsText(file);
  }

  // ---------- demo data ----------
  function loadDemo() {
    const cid = uid(), sid = uid();
    db.clients.push({ id: cid, name: 'Demo — Sanne', goal: 'Kracht opbouwen' });
    db.schemas.push({
      id: sid, clientId: cid, name: 'Full body A',
      exercises: [
        { id: uid(), name: 'Squat', targets: Array.from({ length: 4 }, () => ({ reps: 8, weight: 60 })) },
        { id: uid(), name: 'Bankdrukken', targets: Array.from({ length: 4 }, () => ({ reps: 8, weight: 40 })) },
        { id: uid(), name: 'Deadlift', targets: Array.from({ length: 3 }, () => ({ reps: 5, weight: 80 })) },
      ],
    });
    const day = 24 * 3600 * 1000;
    for (let i = 0; i < 10; i++) {
      const date = new Date(Date.now() - (9 - i) * 6 * day).toISOString().slice(0, 10);
      const bump = (base) => base + i * 2.5 + (i % 3 === 2 ? -2.5 : 0);
      db.workouts.push({
        id: uid(), clientId: cid, schemaId: sid, date, notes: '',
        entries: [
          { name: 'Squat', sets: [1, 2, 3, 4].map(() => ({ reps: 8, weight: bump(60) })) },
          { name: 'Bankdrukken', sets: [1, 2, 3, 4].map(() => ({ reps: 8, weight: bump(40) })) },
          { name: 'Deadlift', sets: [1, 2, 3].map(() => ({ reps: 5, weight: bump(80) })) },
        ],
      });
    }
    // the registry is normally built on load, so fill it here too: no reload needed
    migrateExercises(db);
  }

  // ---------- nav ----------
  function bindNav() {
    document.querySelectorAll('[data-nav]').forEach((el) => {
      const go = () => { location.hash = el.dataset.nav; };
      el.addEventListener('click', (ev) => { if (ev.target.closest('button') !== el && ev.target.closest('button')) return; go(); });
      if (el.tagName !== 'BUTTON') el.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') go(); });
    });
  }

  // tap a prefilled set/target field -> select its content so typing overwrites it
  document.addEventListener('focusin', (ev) => {
    const t = ev.target;
    if (t instanceof HTMLInputElement && (t.dataset.set !== undefined || t.dataset.dset !== undefined || t.dataset.tgt !== undefined)) t.select();
  });

  // persist a one-off migration (e.g. the exercise registry) so it survives a reload
  if (db._needsSave) { delete db._needsSave; save(); }

  if (cloud.configured()) cloud.captureSessionFromUrl();
  applyTheme();
  watchIdleLock();
  bindTimerBar();
  scheduleReminders();
  if (lockNeeded()) showLock();
  window.addEventListener('hashchange', render);
  render();
  if (syncCfg && syncCfg.gistId && navigator.onLine) syncNow();

  // offline: alleen op https/localhost (PWA-hosting); op file:// of zonder sw.js gebeurt er niets
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
})();
</script>
