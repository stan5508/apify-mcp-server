<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{
    --ink:#111111;
    --soft:#6a6a6a;
    --rule:#dcdcdc;
    --accent:#111111;
    --bg:#ffffff;
    --star:#111111;
  }
  body.green{
    --ink:#16281F;
    --soft:#5d7268;
    --rule:#d8cfb8;
    --accent:#1E3B2F;
    --bg:#ffffff;
    --star:#C08A3E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1600px;height:940px}
  body{
    background:var(--bg);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .card{width:1180px;text-align:center}

  /* monogram */
  .mono{position:relative;height:152px;margin-bottom:8px}
  .mono span{
    position:absolute;left:50%;top:50%;
    font-family:'Cormorant Garamond',serif;font-weight:400;
    font-size:148px;line-height:1;color:var(--ink);
  }
  .mono .a{transform:translate(-72%,-52%)}
  .mono .l{transform:translate(-16%,-40%);font-size:129px}

  .wordmark{
    font-family:'Cormorant Garamond',serif;font-weight:300;
    font-size:90px;line-height:1;letter-spacing:.26em;
    text-indent:.26em;color:var(--ink);
  }
  .city{
    margin-top:22px;
    font-family:'Jost',sans-serif;font-weight:300;
    font-size:23px;letter-spacing:.62em;text-indent:.62em;color:var(--soft);
  }

  hr.rule{border:0;border-top:1px solid var(--rule);width:100%;margin:36px 0 0}

  .sale{
    margin-top:32px;
    font-family:'Jost',sans-serif;font-weight:400;
    font-size:24px;letter-spacing:.44em;text-indent:.44em;color:var(--ink);
  }
  .ends{
    margin-top:14px;
    font-family:'Jost',sans-serif;font-weight:300;
    font-size:17px;letter-spacing:.26em;text-indent:.26em;color:var(--soft);
  }

  .tiers{
    margin-top:28px;
    display:flex;align-items:stretch;justify-content:center;
  }
  .tier{padding:0 66px;display:flex;flex-direction:column;align-items:center}
  .tier + .tier{border-left:1px solid var(--rule)}
  .tier .qty{
    font-family:'Jost',sans-serif;font-weight:400;
    font-size:19px;letter-spacing:.24em;text-indent:.24em;color:var(--soft);
  }
  .tier .pct{
    margin-top:12px;
    font-family:'Cormorant Garamond',serif;font-weight:400;
    font-size:68px;line-height:1;letter-spacing:.02em;color:var(--accent);
    font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1;
  }
  .tier .off{
    margin-top:8px;
    font-family:'Jost',sans-serif;font-weight:300;
    font-size:16px;letter-spacing:.34em;text-indent:.34em;color:var(--soft);
  }

  .stars{
    margin-top:32px;
    display:flex;align-items:center;justify-content:center;gap:16px;
  }
  .stars .glyphs{font-size:22px;letter-spacing:.14em;color:var(--star)}
  .stars .score{
    font-family:'Jost',sans-serif;font-weight:400;
    font-size:19px;letter-spacing:.18em;color:var(--ink);
  }

  .trust{
    margin-top:32px;
    font-family:'Jost',sans-serif;font-weight:300;
    font-size:17px;letter-spacing:.22em;text-indent:.22em;color:var(--soft);
  }
  .trust em{font-style:normal;padding:0 12px;color:var(--rule)}
</style>
</head>
<body>
  <div class="card">
    <div class="mono"><span class="a">A</span><span class="l">L</span></div>
    <div class="wordmark">ASHCROFT</div>
    <div class="city">LONDON</div>
    <hr class="rule">
    <div class="sale">SUMMER CLOSING SALE</div>
    <div class="ends">ENDS SUNDAY 20 SEPTEMBER</div>
    <div class="tiers">
      <div class="tier"><div class="qty">1 ITEM</div><div class="pct">10%</div><div class="off">OFF</div></div>
      <div class="tier"><div class="qty">2 ITEMS</div><div class="pct">15%</div><div class="off">OFF</div></div>
      <div class="tier"><div class="qty">3+ ITEMS</div><div class="pct">20%</div><div class="off">OFF</div></div>
    </div>
    <div class="stars">
      <div class="glyphs">★★★★★</div>
      <div class="score">4.9/5</div>
    </div>
    <div class="trust">100% SECURE CHECKOUT<em>·</em>ROYAL MAIL SHIPPING<em>·</em>30-DAY RETURNS</div>
  </div>
</body>
</html>
