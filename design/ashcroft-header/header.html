html,body{margin:0;padding:0}
body{zoom:2;width:1600px;height:900px;background:transparent;font-family:'Work',sans-serif;color:#1c1c1e;position:relative;overflow:hidden}
.wrap{position:absolute;left:0;right:0;top:0;bottom:150px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mono{font-family:'Italiana',serif;font-size:250px;line-height:0.86;letter-spacing:-0.06em;color:#1c1c1e}
.name{font-family:'Italiana',serif;font-size:150px;letter-spacing:0.2em;padding-left:0.2em;line-height:1;margin-top:18px}
.city{font-family:'Work',sans-serif;font-size:38px;letter-spacing:0.6em;padding-left:0.6em;color:#55555a;margin-top:18px;text-transform:uppercase}
.rule{width:220px;height:2px;background:#c9c5bc;margin:34px 0 28px}
.trust{display:flex;align-items:center;gap:26px}
.stars{display:flex;gap:10px}
.stars svg{width:50px;height:50px;fill:#b8963e}
.score{font-family:'Crimson',serif;font-size:62px;color:#1c1c1e;letter-spacing:0.01em;margin-top:4px}
.score span{color:#7a7a80;font-size:44px}
.sub{font-family:'Work',sans-serif;font-size:34px;letter-spacing:0.2em;padding-left:0.2em;text-transform:uppercase;color:#2e2e33;margin-top:18px}
.sub b{font-family:'WorkB';font-weight:400;color:#1c1c1e}
.usps{position:absolute;left:0;right:0;bottom:0;height:150px;background:transparent;display:flex;align-items:center;justify-content:center}
.usps::before{content:"";position:absolute;top:0;left:12%;right:12%;height:2px;background:#e3dfd5}
.usp{display:flex;align-items:center;gap:20px;padding:0 52px;font-size:27px;letter-spacing:0.14em;text-transform:uppercase;color:#2a2a2f;position:relative;white-space:nowrap}
.usp+.usp::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:2px;height:48px;background:#d3cec2}
.usp svg{width:44px;height:44px;stroke:#1c1c1e;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style></head><body>
<div class="wrap">
  <div class="mono">AL</div>
  <div class="name">ASHCROFT</div>
  <div class="city">London</div>
  <div class="rule"></div>
  <div class="trust">
    <div class="stars">
      <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.2 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.2 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.2 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.2 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>
      <svg viewBox="0 0 24 24"><defs><linearGradient id="g"><stop offset="90%" stop-color="#b8963e"/><stop offset="90%" stop-color="#e3dccb"/></linearGradient></defs><path fill="url(#g)" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.2 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>
    </div>
    <div class="score">4.9<span>/5</span></div>
  </div>
  <div class="sub">Trusted by <b>__COUNT__</b> satisfied customers</div>
</div>
<div class="usps">
  <div class="usp"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="1.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.2"/></svg>100% Secure Checkout</div>
  <div class="usp"><svg viewBox="0 0 24 24"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></svg>Royal Mail Shipping</div>
  <div class="usp"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg>30-Day Returns</div>
</div>
