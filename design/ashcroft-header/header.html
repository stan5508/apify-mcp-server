html,body{margin:0;padding:0}
body{zoom:2;width:1600px;height:1000px;background:#fbfaf7;font-family:'Work',sans-serif;color:#1c1c1e;position:relative;overflow:hidden}
.wrap{position:absolute;left:0;right:0;top:0;bottom:126px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.mono{font-family:'Italiana',serif;font-size:170px;line-height:1;letter-spacing:-0.06em;color:#1c1c1e;margin-bottom:6px}
.name{font-family:'Italiana',serif;font-size:74px;letter-spacing:0.36em;padding-left:0.36em;line-height:1;margin-top:8px}
.city{font-family:'Work',sans-serif;font-size:20px;letter-spacing:0.62em;padding-left:0.62em;color:#6b6b70;margin-top:22px;text-transform:uppercase}
.rule{width:140px;height:1px;background:#c9c5bc;margin:56px 0 44px}
.trust{display:flex;align-items:center;gap:18px}
.stars{display:flex;gap:6px}
.stars svg{width:26px;height:26px;fill:#b8963e}
.score{font-family:'Crimson',serif;font-size:32px;color:#1c1c1e;letter-spacing:0.02em;margin-top:2px}
.score span{color:#8a8a90;font-size:24px}
.sub{font-family:'Work',sans-serif;font-size:19px;letter-spacing:0.28em;padding-left:0.28em;text-transform:uppercase;color:#4b4b50;margin-top:22px}
.sub b{font-weight:400;color:#1c1c1e}
.usps{position:absolute;left:0;right:0;bottom:0;height:126px;border-top:1px solid #e6e2d9;background:#f6f4ee;display:flex;align-items:center;justify-content:center;gap:0}
.usp{display:flex;align-items:center;gap:16px;padding:0 64px;font-size:15px;letter-spacing:0.26em;padding-left:64px;text-transform:uppercase;color:#3a3a3f;position:relative}
.usp+.usp::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:1px;height:34px;background:#d8d3c8}
.usp svg{width:26px;height:26px;stroke:#1c1c1e;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<div class="wrap">

      <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.2 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.2 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.2 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.2 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>
      <svg viewBox="0 0 24 24"><defs><linearGradient id="g"><stop offset="90%" stop-color="#b8963e"/><stop offset="90%" stop-color="#e3dccb"/></linearGradient></defs><path fill="url(#g)" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.2 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>
    </div>
    <div class="score">4.9<span>/5</span></div>
  </div>
  <div class="sub">Trusted by <b>__COUNT__</b> satisfied customers</div>
</div>
