        </div>
        <div class="row" style="margin-bottom:10px">
          <span class="mut">Verdeling</span>
          ${[[40, 30, 30], [50, 25, 25], [30, 40, 30]].map(([pc, pp, pf]) =>
            `<button type="button" class="small" data-split="${pc}.${pp}.${pf}">${pc}/${pp}/${pf} K/E/V</button>`).join('')}
        </div>
        <label class="field"><span>Richtlijnen</span>
          <textarea name="guidelines" rows="3" placeholder="bijv. 3 maaltijden + 1 snack, 2 liter water, eiwit bij elke maaltijd">${plan ? esc(plan.guidelines || '') : ''}</textarea></label>
        <div class="actions">
          <button class="primary" type="submit">Plan opslaan</button>
          ${suggestion ? `<button type="button" class="small" id="plan-suggest">Voorstel (${esc(fmtNum(suggestion.weight))} ${unitLbl()})</button>` : ''}
        </div>
        ${suggestion ? `<p class="mut" style="margin:8px 0 0">Voorstel: ${suggestion.kcal} kcal · ${suggestion.protein} g eiwit · ${suggestion.carbs} g koolhydraten · ${suggestion.fat} g vet — een ruwe richtlijn op basis van lichaamsgewicht.</p>` : ''}
      </form>
      <div class="card">
        <div class="row">
          <label class="field grow" style="margin:0"><span>Verbranding per trainingsminuut (kcal)</span>
            <input id="kcal-min" type="number" min="0" max="20" value="${db.settings.kcalPerMin}"></label>
          <label class="field grow" style="margin:0"><span>Waterdoel (ml)</span>
            <input id="water-target" type="number" min="0" step="250" value="${waterTarget}"></label>
          <button class="small" id="burn-toggle" aria-pressed="${!!db.settings.countTrainingBurn}">Beweging meetellen</button>
        </div>
        <p class="mut" style="margin:8px 0 0">De verbranding is een schatting op basis van de trainingsduur, niet een meting.</p>
      </div>`;

    bindNav();
    const setUi = (patch) => { uiState.nutri = { ...uiState.nutri, ...patch }; render(); };

    document.querySelectorAll('[data-nutri-day]').forEach((b) => b.addEventListener('click', () => {
      uiState.nutri = { moment: null, query: '', results: [], message: '' };
      location.hash = `/klant/${clientId}/voeding/${b.dataset.nutriDay}`;
    }));
    document.getElementById('nutri-date').addEventListener('change', (ev) => {
      location.hash = `/klant/${clientId}/voeding/${ev.target.value}`;
    });
    document.querySelectorAll('[data-add-to]').forEach((b) => b.addEventListener('click', () => {
      setUi({ moment: b.dataset.addTo, results: [], message: '', query: '' });
    }));
    document.querySelectorAll('[data-meal-del]').forEach((b) => b.addEventListener('click', () => {
      db.meals = db.meals.filter((m) => m.id !== b.dataset.mealDel);
      save(); render();
    }));
    document.querySelectorAll('[data-water]').forEach((b) => b.addEventListener('click', () => {
      addWater(clientId, date, Number(b.dataset.water));
      render();
    }));
    document.getElementById('copy-yesterday').addEventListener('click', () => {
      const n = copyDay(clientId, addDays(date, -1), date);
      if (!n) alert('Gisteren is niets gelogd.');
      render();
    });
    document.querySelectorAll('[data-freq]').forEach((b) => b.addEventListener('click', () => {
      const f = freq[Number(b.dataset.freq)];
      db.meals.push({ ...f.last, id: uid(), date, note: '' });
      save(); render();
    }));

    // add panel
    const closeBtn = document.getElementById('add-close');
    if (closeBtn) closeBtn.addEventListener('click', () => setUi({ moment: null, results: [], message: '' }));

    const runSearch = async () => {
      const term = document.getElementById('food-search').value.trim();
      if (!term) return;
      const local = db.foods
        .filter((f) => f.name.toLowerCase().includes(term.toLowerCase()))
        .map((f) => ({ ...f, source: 'lokaal' }));
      setUi({ query: term, results: local, message: 'Zoeken in productendatabase…' });
      try {
        const found = await searchProducts(term);
        uiState.nutri.results = [...local, ...found];
        uiState.nutri.message = found.length ? `${found.length} producten gevonden.` : 'Geen producten gevonden — vul hieronder handmatig in.';
      } catch (e) {
        uiState.nutri.message = `Online zoeken lukte niet (${e.message}). Je eigen lijst en handmatig invoeren werken gewoon.`;
      }
      render();
    };
    const searchBtn = document.getElementById('food-search-btn');
    if (searchBtn) {
      searchBtn.addEventListener('click', runSearch);
      document.getElementById('food-search').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); runSearch(); } });
    }
    const scanBtn = document.getElementById('scan-btn');
    if (scanBtn) scanBtn.addEventListener('click', async () => {
      const video = document.getElementById('scan-video');
      video.hidden = false;
      document.getElementById('search-msg').textContent = 'Richt de camera op de barcode…';
      try {
        const code = await scanBarcode(video);
        video.hidden = true;
        document.getElementById('search-msg').textContent = 'Product ophalen…';
        const food = await productByBarcode(code);
        uiState.nutri.results = food ? [food] : [];
        uiState.nutri.message = food ? `Gevonden: ${food.name}` : 'Product niet gevonden.';
      } catch (e) {
        video.hidden = true;
        uiState.nutri.message = 'Scannen mislukt: ' + e.message;
      }
      render();
    });
    document.querySelectorAll('[data-pick]').forEach((b) => b.addEventListener('click', () => {
      const idx = Number(b.dataset.pick);
      const food = (uiState.nutri.results || [])[idx];
      if (!food) return;
      const amount = num(document.querySelector(`.pick-amount[data-idx="${idx}"]`).value) || 100;
      const macros = macrosFor(food, amount);
      db.meals.push({
        id: uid(), clientId, date, moment: uiState.nutri.moment || 'Snack',
        name: food.name, amount, per: food.per || '100g', ...macros,
      });
      if (!foodByName(food.name)) {
        db.foods.push({ id: uid(), name: food.name, per: food.per || '100g', code: food.code || '',
          kcal: food.kcal, protein: food.protein, carbs: food.carbs, fat: food.fat });
      }
      save();
      setUi({ results: [], message: `${food.name} toegevoegd.` });
    }));
    const quick = document.getElementById('quick-form');
    if (quick) quick.addEventListener('submit', (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const name = String(f.get('name')).trim();
      if (!name) return;
      db.meals.push({
        id: uid(), clientId, date, moment: uiState.nutri.moment || 'Snack', name,
        kcal: num(f.get('kcal')), protein: num(f.get('protein')), carbs: num(f.get('carbs')), fat: num(f.get('fat')),
      });
      save();
      setUi({ message: `${name} toegevoegd.` });
    });

    // plan
    document.getElementById('plan-form').addEventListener('submit', (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const next = { guidelines: String(f.get('guidelines')).trim(), updatedAt: todayIso() };
      for (const { key } of MACROS) next[key] = num(f.get(key));
      db.nutritionPlans[clientId] = next;
      save(); render();
    });
    document.querySelectorAll('[data-split]').forEach((b) => b.addEventListener('click', () => {
      const form = document.getElementById('plan-form');
      const kcal = num(form.querySelector('[name="kcal"]').value) || (suggestion ? suggestion.kcal : 2000);
      const [pc, pp, pf] = b.dataset.split.split('.').map(Number);
      const next = planFromPercents(kcal, pp, pc, pf);
      for (const { key } of MACROS) form.querySelector(`[name="${key}"]`).value = next[key];
    }));
    const sug = document.getElementById('plan-suggest');
    if (sug) sug.addEventListener('click', () => {
      const form = document.getElementById('plan-form');
      for (const { key } of MACROS) form.querySelector(`[name="${key}"]`).value = suggestion[key];
    });
    document.getElementById('kcal-min').addEventListener('change', (ev) => {
      db.settings.kcalPerMin = Math.max(0, Math.min(20, num(ev.target.value)));
      save(); render();
    });
    document.getElementById('water-target').addEventListener('change', (ev) => {
      db.settings.waterTargetMl = Math.max(0, num(ev.target.value));
      save(); render();
    });
    document.getElementById('burn-toggle').addEventListener('click', () => {
      db.settings.countTrainingBurn = !db.settings.countTrainingBurn;
      save(); render();
    });
  }

  // --- data that clients logged themselves ---
  function viewClientFeed(clientKey) {
    if (!cloud.configured() || !cloud.signedIn()) {
      $app.innerHTML = topbar('Van klanten', '/') +
        `<div class="empty"><p>Nog niet verbonden met de cloud. Stel dat in op de startpagina.</p>
        <button class="primary" data-nav="/">Naar instellingen</button></div>`;
      bindNav();
      return;
    }
    $app.innerHTML = topbar('Van klanten', '/') + '<p class="mut">Ophalen…</p>';

    (async () => {
      try {
        const coachId = cloud.userId();
        const profiles = await cloud.select('profiles', `coach_id=eq.${coachId}&select=id,name,created_at&order=name`);
        if (!profiles.length) {
          $app.innerHTML = topbar('Van klanten', '/') +
            `<div class="empty"><p>Nog geen gekoppelde klanten. Maak een uitnodigingscode aan op de startpagina en stuur je klant de link naar de sporter-app.</p></div>`;
          bindNav();
          return;
        }
        const active = profiles.find((p) => p.id === clientKey) || profiles[0];
        const since = addDays(todayIso(), -30);
        const [workouts, meals, water] = await Promise.all([
          cloud.select('client_workouts', `client_id=eq.${active.id}&date=gte.${since}&select=*&order=date.desc`),
          cloud.select('client_meals', `client_id=eq.${active.id}&date=gte.${since}&select=*&order=date.desc`),
          cloud.select('client_water', `client_id=eq.${active.id}&date=gte.${since}&select=*&order=date.desc`),
        ]);
        const byDate = new Map();
        for (const w of workouts) {
          const d = byDate.get(w.date) || { date: w.date, workouts: [], meals: [], water: 0 };
          d.workouts.push(w); byDate.set(w.date, d);
        }
        for (const m of meals) {
          const d = byDate.get(m.date) || { date: m.date, workouts: [], meals: [], water: 0 };
          d.meals.push(m); byDate.set(m.date, d);
        }
        for (const w of water) {
          const d = byDate.get(w.date) || { date: w.date, workouts: [], meals: [], water: 0 };
          d.water = w.ml; byDate.set(w.date, d);
        }
        const days = [...byDate.values()].sort((a, b) => b.date.localeCompare(a.date));
        const localClient = db.clients.find((c) => c.name.toLowerCase() === (active.name || '').toLowerCase());

        $app.innerHTML = topbar('Van klanten', '/') +
          `<div class="chips" style="margin-bottom:12px">${profiles.map((p) =>
            `<button class="chip" data-feed-client="${p.id}" aria-pressed="${p.id === active.id}">${esc(p.name || 'naamloos')}</button>`).join('')}</div>` +
          `<p class="sub" style="margin:0 0 12px">Laatste 30 dagen van ${esc(active.name || 'deze klant')}.${localClient ? '' : ' <span class="mut">Nog geen klant met deze naam in je eigen administratie.</span>'}</p>` +
          (days.length ? days.map((d) => {
            const kcal = d.meals.reduce((t, m) => t + Number(m.kcal || 0), 0);
            const protein = d.meals.reduce((t, m) => t + Number(m.protein || 0), 0);
            return `<div class="card">
              <div class="row"><div class="grow"><div class="title">${esc(fmtDateFull(d.date))}</div></div>
                ${d.workouts.length && localClient ? `<button class="small" data-import="${d.date}">Neem training over</button>` : ''}</div>
              ${d.workouts.map((w) => `<div class="sub">🏋️ ${w.entries.map((e) => esc(e.name)).join(' · ') || 'training'}${w.duration_min ? ` <span class="mut">${w.duration_min} min</span>` : ''}</div>`).join('')}
              ${d.meals.length ? `<div class="sub">🍽️ ${Math.round(kcal)} kcal · ${Math.round(protein)} g eiwit <span class="mut">(${d.meals.length} items)</span></div>` : ''}
              ${d.water ? `<div class="sub">💧 ${(d.water / 1000).toLocaleString('nl-NL')} l</div>` : ''}
              ${d.meals.length ? `<div class="mut">${d.meals.map((m) => esc(m.name)).join(', ')}</div>` : ''}
            </div>`;
          }).join('') : '<p class="mut">Deze klant heeft nog niets gelogd.</p>');

        bindNav();
        document.querySelectorAll('[data-feed-client]').forEach((b) => b.addEventListener('click', () => {
          location.hash = `/vanklanten/${b.dataset.feedClient}`;
        }));
        document.querySelectorAll('[data-import]').forEach((b) => b.addEventListener('click', () => {
          const day = byDate.get(b.dataset.import);
          if (!day || !localClient) return;
          let added = 0;
          for (const w of day.workouts) {
            const entries = (w.entries || [])
              .map((e) => ({
                name: e.name, exerciseId: ensureExercise(e.name, e.kind || 'kracht').id,
                kind: e.kind || 'kracht', superset: null,
                sets: (e.sets || []).filter((x) => filledSet(x, e.kind || 'kracht')),
              }))
              .filter((e) => e.sets.length);
            if (!entries.length) continue;
            if (db.workouts.some((x) => x.clientId === localClient.id && x.date === w.date && x.fromCloudId === w.id)) continue;
            db.workouts.push({
              id: uid(), clientId: localClient.id, schemaId: null, date: w.date,
              notes: w.notes || '', durationMin: w.duration_min || undefined,
              fromCloudId: w.id, coach: 'klant zelf', entries,
            });
            added++;
          }
          save();
          alert(added ? `${added} training${added === 1 ? '' : 'en'} overgenomen in ${localClient.name}.` : 'Deze training stond er al in.');
          render();
        }));
      } catch (e) {
        $app.innerHTML = topbar('Van klanten', '/') + `<p class="mut">Ophalen mislukt: ${esc(e.message)}</p>`;
        bindNav();
      }
    })();
  }

  // --- client overview: months, attendance, muscle groups ---
  function viewOverview(clientId) {
    const c = clientById(clientId);
    if (!c) { location.hash = '/'; return; }
    const period = uiState.period;
    const months = monthlyStats(clientId, period);
    const totals = months.reduce((t, m) => ({
      sessions: t.sessions + m.sessions, volume: t.volume + m.volume, prs: t.prs + m.prs, minutes: t.minutes + m.minutes,
    }), { sessions: 0, volume: 0, prs: 0, minutes: 0 });
    const streak = weekStreak(clientId);
    const groups = groupTotals(clientId, period);
    const maxVolume = Math.max(1, ...groups.map((g) => g.volume));
    const maxMinutes = Math.max(1, ...groups.map((g) => g.minutes));
    const maxSets = Math.max(1, ...groups.map((g) => g.sets));
    const barPct = (g) => Math.round(100 * (g.volume ? g.volume / maxVolume : g.minutes ? g.minutes / maxMinutes : g.sets / maxSets));

    // attendance: last 12 weeks of days
    const days = [];
    const trained = new Set(workoutsOf(clientId).map((w) => w.date));
    const cursor = new Date();
    cursor.setDate(cursor.getDate() - ((cursor.getDay() + 6) % 7) + 6); // end of this week (sunday)
    for (let i = 0; i < 84; i++) {
      const iso = cursor.toISOString().slice(0, 10);
      days.unshift({ iso, on: trained.has(iso) });
      cursor.setDate(cursor.getDate() - 1);
    }

    $app.innerHTML = topbar(`Overzicht — ${c.name}`, `/klant/${clientId}`) +
      clientTabs(clientId, 'overzicht') +
      periodBar() +
      `<div class="card">

      `<div class="stat-grid cols2">
        <div class="stat"><div class="lbl">Trainingen</div><div class="val">${totals.sessions}</div><div class="mut">${totals.minutes ? Math.round(totals.minutes / 60) + ' uur totaal' : 'geen tijd gelogd'}</div></div>
        <div class="stat"><div class="lbl">Totaal volume</div><div class="val">${esc(fmtKg(totals.volume))}</div><div class="mut">krachtoefeningen</div></div>
        <div class="stat"><div class="lbl">Persoonlijke records</div><div class="val">${totals.prs}</div><div class="mut">in deze periode</div></div>
        <div class="stat"><div class="lbl">Reeks</div><div class="val">${streak} ${streak === 1 ? 'week' : 'weken'}</div><div class="mut">op rij getraind</div></div>
      </div>` +

      `<div class="eyebrow">Per maand</div>` +
      (months.length ? `<div class="card table-wrap"><table class="data">
        <thead><tr><th>Maand</th><th class="num">Trainingen</th><th class="num">Volume</th><th class="num">PR's</th></tr></thead>
        <tbody>${[...months].reverse().map((m) => `<tr>
          <td>${esc(monthLabel(m.month))}</td>
          <td class="num">${m.sessions}</td>
          <td class="num">${esc(fmtKg(m.volume))}</td>
          <td class="num">${m.prs}</td>
        </tr>`).join('')}</tbody>
      </table></div>
      <div class="eyebrow">Volume per maand</div>
      <div class="card"><div class="chart-wrap" id="month-chart"></div></div>` : `<p class="mut">Nog geen trainingen in deze periode.</p>`) +

      `<div class="eyebrow">Aanwezigheid (12 weken)</div>
      <div class="card">
        <div class="cal">${['m', 'd', 'w', 'd', 'v', 'z', 'z'].map((d) => `<div class="head">${d}</div>`).join('')}
        ${days.map((d) => `<div class="${d.on ? 'on' : ''}" title="${d.iso}"></div>`).join('')}</div>
        <p class="mut" style="margin:10px 0 0">Elke stip is een dag; gekleurd = getraind.</p>
      </div>` +

      `<div class="eyebrow">Spiergroepen</div>
      <div class="card">
        ${groups.length ? groups.map((g) => `<div class="bar-row">
          <span>${esc(g.group)}</span>
          <span class="track"><span class="fill" style="width:${barPct(g)}%;background:${groupColor(g.group)}"></span></span>
          <span class="val">${g.volume ? esc(fmtKg(g.volume)) : g.minutes ? fmtNum(g.minutes) + ' min' : g.sets + ' sets'}</span>
        </div>`).join('') : '<p class="mut">Nog geen gegevens.</p>'}

      </div>` +

      `<div class="eyebrow">Gegevens</div>
      <div class="actions"><button id="csv-client">Exporteer trainingen (CSV)</button></div>`;

    bindNav();
    bindPeriodBar();
    if (months.length) {
      renderBarChart(document.getElementById('month-chart'), months.map((m) => ({ date: m.month + '-15', value: m.volume })));

  // --- exercise progress page ---
  function viewExercise(clientId, encName) {
    const c = clientById(clientId);
    if (!c) { location.hash = '/'; return; }
    const wanted = decodeURIComponent(encName).toLowerCase();
    const name = loggedExercises(clientId).find((n) => n.toLowerCase() === wanted);
    if (!name) { location.hash = `/klant/${clientId}`; return; }
    const allSessions = exerciseSessions(clientId, name);
    const sessions = allSessions.filter((s) => inPeriod(s.date, uiState.period));
    if (!sessions.length) {
      $app.innerHTML = topbar(name, `/klant/${clientId}`) + periodBar() +
        `<div class="empty"><p>Geen sessies in deze periode.</p></div>`;
      bindNav(); bindPeriodBar();
      return;
    }
    const first = sessions[0], last = sessions[sessions.length - 1];

    const kind = last.kind || 'kracht';
    const cfg = {
      kracht: {
        metrics: { top: 'Zwaarste set', e1rm: 'Geschat 1RM' },
        fmt: fmtKg, unit: 'kg',
        lineTitle: 'Gewicht per training',
        barKey: 'volume', barTitle: 'Volume per training',
        barNote: 'Volume = som van gewicht × herhalingen per training.',
        prLabel: 'PR · zwaarste set', pr2Label: 'PR · geschat 1RM', pr2: (ss) => fmtKg(Math.max(...ss.map((x) => x.e1rm))), pr2Note: 'Epley-formule',
      },
      lichaamsgewicht: {
        metrics: { extra: 'Extra gewicht', bestReps: 'Beste set (herh.)' },
        fmt: fmtKg, unit: 'kg',
        lineTitle: 'Belasting per training',
        barKey: 'totalReps', barTitle: 'Totaal herhalingen per training',
        barNote: 'Som van alle herhalingen per training.',
        prLabel: 'PR · extra gewicht', pr2Label: 'PR · meeste herhalingen', pr2: (ss) => `${Math.max(...ss.map((x) => x.bestReps))} herh.`, pr2Note: 'beste set',
      },
      cardio: {
        metrics: { distance: 'Afstand (km)', pace: 'Tempo (min/km)' },
        fmt: (v) => fmtNum(v) + ' km', unit: 'km',
        lineTitle: 'Afstand en tempo',
        barKey: 'minutes', barTitle: 'Tijd per training',
        barNote: 'Totale tijd per training in minuten.',
        prLabel: 'PR · langste afstand', pr2Label: 'PR · beste tempo',
        pr2: (ss) => { const p = ss.filter((x) => x.pace > 0); return p.length ? fmtNum(Math.min(...p.map((x) => x.pace))) + ' min/km' : '—'; }, pr2Note: 'min per km',
      },
    }[kind];

    const metricKeys = Object.keys(cfg.metrics);
    if (!metricKeys.includes(uiState.metric)) uiState.metric = metricKeys[0];
    // bodyweight work without added weight: progress is in reps, not kilos
    const repsOnly = kind === 'lichaamsgewicht' && sessions.every((s) => !s.extra);
    if (repsOnly) {
      cfg.fmt = (v) => `${Math.round(v)} herh.`;
      cfg.prLabel = 'PR · meeste herhalingen';
      cfg.pr2Label = 'Meeste herhalingen in één sessie';
      cfg.pr2 = (ss) => `${Math.max(...ss.map((x) => x.totalReps))} herh.`;
      cfg.pr2Note = 'alle sets samen';
      if (uiState.metric === 'extra') uiState.metric = 'bestReps';
    }
    const topOf = (s) => repsOnly ? s.bestReps : s.top;
    const prTop = Math.max(...sessions.map(topOf));
    const prDate = sessions.find((s) => topOf(s) === prTop).date;
    const delta = topOf(last) - topOf(first);
    const deltaCls = delta > 0 ? 'up' : delta < 0 ? 'down' : '';
    const deltaSign = delta > 0 ? '+' : '';
    const deltaPct = topOf(first) > 0 ? ` (${deltaSign}${Math.round((delta / topOf(first)) * 100)}%)` : '';
    const lineUnit = uiState.metric === 'pace' ? 'min/km' : uiState.metric === 'bestReps' ? 'herh.' : cfg.unit;

    $app.innerHTML = topbar(name, `/klant/${clientId}`) +
      `<div class="row no-print" style="margin-bottom:12px">
        <span class="mut">Spiergroep</span>
        <select id="mg-select" style="max-width:200px">
          ${MUSCLE_GROUPS.map((g) => `<option value="${g}" ${groupOf(name, kind) === g ? 'selected' : ''}>${g}</option>`).join('')}
        </select>
        ${kind !== 'kracht' ? `<span class="badge">${KIND_LABELS[kind]}</span>` : ''}
      </div>` +
      periodBar() +
      `<div class="card">
        <div class="row" style="margin-bottom:8px"><div class="title grow">Uitleg</div>
          <button class="small ghost no-print" data-nav="/bibliotheek">Bibliotheek ›</button></div>

  // --- free workout: pick exercises for this session ---
  function viewPickExercises(clientId) {
    const c = clientById(clientId);
    if (!c) { location.hash = '/'; return; }
    const known = [...new Set([...knownExercises(clientId), ...libraryNames()])];
    const selected = new Set(pendingFree.filter((n) => known.some((k) => k.toLowerCase() === n.toLowerCase())));

    const paint = () => {
      $app.innerHTML = topbar('Vrije training', `/klant/${clientId}`) +
        `<p class="sub" style="margin:0 0 12px">Kies de oefeningen voor deze sessie — elke training kan anders zijn.</p>` +
        (known.length ? `<div class="chips">${known.map((n) =>
          `<button type="button" class="chip" data-ex-name="${esc(n)}" aria-pressed="${selected.has(n)}">${esc(n)}</button>`
        ).join('')}</div>` : '') +
        `<form class="card" id="new-ex" style="margin-top:16px">
          <label class="field"><span>Nieuwe oefening</span><input name="name" placeholder="bijv. Lat pulldown"></label>
          <button type="submit">+ Toevoegen en selecteren</button>
        </form>
        <button class="primary wide" id="start-free" ${selected.size ? '' : 'disabled'} style="margin-top:8px">Start training (${selected.size} oefening${selected.size === 1 ? '' : 'en'})</button>`;

      bindNav();
      document.querySelectorAll('[data-ex-name]').forEach((b) => b.addEventListener('click', () => {
        const n = b.dataset.exName;
        if (selected.has(n)) selected.delete(n); else selected.add(n);
        paint();
      }));
      document.getElementById('new-ex').addEventListener('submit', (ev) => {
        ev.preventDefault();
        const n = String(new FormData(ev.target).get('name')).trim();
        if (!n) return;
        if (!known.some((k) => k.toLowerCase() === n.toLowerCase())) known.push(n);
        selected.add(known.find((k) => k.toLowerCase() === n.toLowerCase()));
        paint();
      });
      document.getElementById('start-free').addEventListener('click', () => {
        pendingFree = known.filter((n) => selected.has(n));
        location.hash = `/klant/${clientId}/training/vrij`;
      });
    };
    paint();
  }

  // --- schema template editor (global, linkable to clients and duos) ---
  function viewTemplate(tid) {
    const isNew = tid === 'nieuw';
    const tpl = isNew ? { id: uid(), name: '', exercises: [] } : templateById(tid);
    if (!tpl) { location.hash = '/'; return; }
    const newTarget = () => ({ reps: 10, weight: 0 });
    const newExercise = () => ({ id: uid(), name: '', targets: [newTarget(), newTarget(), newTarget()] });
    const draft = JSON.parse(JSON.stringify(tpl));
    draft.exercises.forEach((e) => { if (!e.targets || !e.targets.length) e.targets = [newTarget(), newTarget(), newTarget()]; });
    if (!draft.exercises.length) draft.exercises.push(newExercise());

    const paint = () => {
      $app.innerHTML = topbar(isNew ? 'Nieuw sjabloon' : 'Sjabloon bewerken', '/') +
        `<p class="sub" style="margin:0 0 12px">Een sjabloon koppel je via de klant- of duo-pagina ("+ Schema uit sjabloon"); daar wordt het een eigen kopie die je per klant kunt aanpassen.</p>
        <form id="schema-form">
          <label class="field"><span>Naam sjabloon</span><input name="name" required placeholder="bijv. Full body beginner" value="${esc(draft.name)}"></label>
          <datalist id="lib-names">${libraryNames().map((n) => `<option value="${esc(n)}">`).join('')}</datalist>
          <div class="eyebrow">Oefeningen — elke set apart</div>
          ${draft.exercises.map((e, i) => `<div class="card">
            <div class="row" style="margin-bottom:8px">
              <input data-exname="${i}" class="grow" list="lib-names" required placeholder="bijv. Squat" value="${esc(e.name)}">
              <button type="button" class="small ghost" data-ex-up="${i}" aria-label="Omhoog" ${i === 0 ? 'disabled' : ''}>↑</button>
              <button type="button" class="small ghost" data-ex-down="${i}" aria-label="Omlaag" ${i === draft.exercises.length - 1 ? 'disabled' : ''}>↓</button>
              <button type="button" class="small danger ghost" data-rm-ex="${i}" aria-label="Verwijder oefening">✕</button>
            </div>
            <label class="field"><span>Soort</span>
              <select data-exkind="${i}">${Object.entries(KIND_LABELS).map(([k, l]) => `<option value="${k}" ${(e.kind || 'kracht') === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
            </label>
            ${targetRowsHtml(String(i), e.targets, e.kind || 'kracht', 'rm-tgt')}
            <button type="button" class="small" data-add-tgt="${i}">+ Set</button>
          </div>`).join('')}
          <button type="button" id="add-ex" class="small" style="margin:4px 0 16px">+ Oefening</button>
          <button class="primary wide" type="submit">Sjabloon opslaan</button>
        </form>` +
        (!isNew ? `<hr class="divider"><button class="danger ghost" id="del-template">Sjabloon verwijderen</button>` : '');

      bindNav();
      const syncDraft = () => {
        draft.name = document.querySelector('[name="name"]').value;
        document.querySelectorAll('[data-exname]').forEach((inp) => {
          draft.exercises[+inp.dataset.exname].name = inp.value;
        });
        document.querySelectorAll('[data-exkind]').forEach((sel) => {
          draft.exercises[+sel.dataset.exkind].kind = sel.value;
        });
        document.querySelectorAll('[data-tgt]').forEach((inp) => {
          const [i, si] = inp.dataset.tgt.split('.').map(Number);
          draft.exercises[i].targets[si][inp.dataset.f] = num(inp.value);
        });
      };
      document.querySelectorAll('[data-exkind]').forEach((sel) => sel.addEventListener('change', () => {
        syncDraft();
        paint();
      }));
      document.querySelectorAll('[data-ex-up], [data-ex-down]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        const up = b.dataset.exUp !== undefined;
        const i = +(up ? b.dataset.exUp : b.dataset.exDown);
        const to = up ? i - 1 : i + 1;
        if (to < 0 || to >= draft.exercises.length) return;
        [draft.exercises[i], draft.exercises[to]] = [draft.exercises[to], draft.exercises[i]];
        paint();
      }));
      document.getElementById('add-ex').addEventListener('click', () => {
        syncDraft();
        draft.exercises.push(newExercise());
        paint();
      });
      document.querySelectorAll('[data-rm-ex]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        draft.exercises.splice(+b.dataset.rmEx, 1);
        if (!draft.exercises.length) draft.exercises.push(newExercise());
        paint();
      }));
      document.querySelectorAll('[data-add-tgt]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        const targets = draft.exercises[+b.dataset.addTgt].targets;
        targets.push(targets.length ? { ...targets[targets.length - 1] } : newTarget());
        paint();
      }));
      document.querySelectorAll('[data-rm-tgt]').forEach((b) => b.addEventListener('click', () => {
        syncDraft();
        const [i, si] = b.dataset.rmTgt.split('.').map(Number);
        draft.exercises[i].targets.splice(si, 1);
        if (!draft.exercises[i].targets.length) draft.exercises[i].targets.push(newTarget());
        paint();
      }));
      document.getElementById('schema-form').addEventListener('submit', (ev) => {
        ev.preventDefault();
        syncDraft();
        draft.name = draft.name.trim();
        draft.exercises = draft.exercises
          .filter((e) => e.name.trim())
          .map((e) => ({ id: e.id, name: e.name.trim(), kind: ensureExercise(e.name.trim(), e.kind || 'kracht').kind, targets: e.targets }));
        if (!draft.name || !draft.exercises.length) return;
        if (isNew) db.templates.push(draft);
        else db.templates[db.templates.findIndex((t) => t.id === tid)] = draft;
        save(); location.hash = `/sjabloon/${draft.id}`; render();
      });
      const del = document.getElementById('del-template');
      if (del) del.addEventListener('click', () => {
        if (!confirm('Dit sjabloon verwijderen? Reeds gekoppelde schema\'s blijven bestaan.')) return;
        db.templates = db.templates.filter((t) => t.id !== tid);
        save(); location.hash = '/';
      });
    };
    paint();
  }

  // --- pick a template to link as a schema for a client or duo ---
  function viewTemplatePick(kind, id) {
    const target = kind === 'klant' ? clientById(id) : duoById(id);
    if (!target) { location.hash = '/'; return; }
    const backHash = `/${kind}/${id}`;
    const title = kind === 'klant' ? `Schema uit sjabloon — ${target.name}` : `Duo-schema uit sjabloon — ${duoName(target)}`;

    $app.innerHTML = topbar(title, backHash) +
      (db.templates.length
        ? `<p class="sub" style="margin:0 0 12px">Kies een sjabloon; het wordt een eigen kopie die je daarna kunt aanpassen.</p>` +
          [...db.templates].sort((a, b) => byName(a.name, b.name)).map((t) => `<div class="card tappable" data-apply-tpl="${t.id}" role="button" tabindex="0">
            <div class="row"><div class="grow">
              <div class="title">${esc(t.name)}</div>
              <div class="sub">${t.exercises.map((e) => `${esc(e.name)} (${e.targets.length})`).join(' · ')}</div>
            </div><span class="mut">›</span></div>
          </div>`).join('')
        : `<div class="empty"><p>Nog geen sjablonen. Maak er eerst één via de zijbalk: Sjablonen → + Nieuw sjabloon.</p><button class="primary" data-nav="/sjabloon/nieuw">+ Nieuw sjabloon</button></div>`);

    bindNav();
    document.querySelectorAll('[data-apply-tpl]').forEach((el) => el.addEventListener('click', () => {
      const tpl = templateById(el.dataset.applyTpl);
      if (!tpl) return;
      if (kind === 'klant') {
        const schema = { id: uid(), clientId: id, name: tpl.name, exercises: copyExercises(tpl.exercises) };
        db.schemas.push(schema);
        save(); location.hash = `/klant/${id}/schema/${schema.id}`;
      } else {
        const plans = {};
        for (const cid of target.clientIds) plans[cid] = copyExercises(tpl.exercises);
        const schema = { id: uid(), duoId: id, name: tpl.name, plans };
        db.duoSchemas.push(schema);
        save(); location.hash = `/duo/${id}/schema/${schema.id}`;
      }
    }));
  }

  // --- duo page: members + duo session history ---
  function viewDuo(duoId) {
    const duo = duoById(duoId);
    const members = duo ? duo.clientIds.map(clientById) : [];
    if (!duo || members.some((m) => !m)) { location.hash = '/'; return; }

    const duoWorkouts = db.workouts.filter((w) => w.duoId === duoId);
    const dates = [...new Set(duoWorkouts.map((w) => w.date))].sort().reverse();

    $app.innerHTML = topbar(duoName(duo), '/') +
      `<div class="actions">` +
      duoSchemasOf(duoId).map((s) => `<button class="primary" data-nav="/duo/${duoId}/training/${s.id}">Start: ${esc(s.name)}</button>`).join('') +
      `<button class="primary" data-nav="/duo/${duoId}/vrij">+ Vrije duo-training</button></div>` +

      `<div class="eyebrow">Schema's</div>` +
      duoSchemasOf(duoId).map((s) => `<div class="card tappable" data-nav="/duo/${duoId}/schema/${s.id}" role="link" tabindex="0">
        <div class="row"><div class="grow">
          <div class="title">${esc(s.name)}</div>
          <div class="sub">${members.map((m) => `${esc(m.name)}: ${(s.plans[m.id] || []).map((e) => esc(e.name)).join(', ') || '—'}`).join(' · ')}</div>
        </div><span class="mut">›</span></div>
      </div>`).join('') +
      `<div class="actions" style="margin-top:2px"><button data-nav="/duo/${duoId}/schema/nieuw">+ Nieuw duo-schema</button><button data-nav="/duo/${duoId}/sjabloon">+ Schema uit sjabloon</button></div>` +

      `<div class="eyebrow">Leden</div>` +
      members.map((m) => {
        const ws = workoutsOf(m.id);
        const lastW = ws[ws.length - 1];
        return `<div class="card tappable" data-nav="/klant/${m.id}" role="link" tabindex="0">
          <div class="row"><div class="grow">
            <div class="title">${esc(m.name)}</div>
            <div class="sub">${ws.length} training${ws.length === 1 ? '' : 'en'}${lastW ? ' · laatste: ' + esc(fmtDate(lastW.date)) : ''} · schema's en progressie ›</div>
          </div><span class="mut">›</span></div>
        </div>`;
      }).join('') +

      `<div class="eyebrow">Deze maand</div>` +
      (() => {
        const month = todayIso().slice(0, 7);
        const rows = members.map((m) => {
          const ws = workoutsOf(m.id).filter((w) => w.date.slice(0, 7) === month);
          const volume = ws.reduce((t, w) => t + w.entries.reduce((x, e) => x + entryVolumeKg(e), 0), 0);
          let prs = 0;
          for (const name of loggedExercises(m.id)) {
            prs += exerciseSessions(m.id, name).filter((s) => s.isPr && s.date.slice(0, 7) === month).length;
          }
          return { name: m.name, sessions: ws.length, volume, prs };
        });
        const best = Math.max(...rows.map((r) => r.prs));
        return `<div class="card table-wrap"><table class="data">
          <thead><tr><th></th><th class="num">Trainingen</th><th class="num">Volume</th><th class="num">PR's</th></tr></thead>
          <tbody>${rows.map((r) => `<tr>
            <td>${esc(r.name)}${best > 0 && r.prs === best ? ' 🏆' : ''}</td>
            <td class="num">${r.sessions}</td>
            <td class="num">${esc(fmtKg(r.volume))}</td>
            <td class="num">${r.prs}</td>
          </tr>`).join('')}</tbody>
        </table></div>` +
        `<div class="eyebrow">Duo-trainingen</div>`;
      })() +
      (dates.length ? dates.slice(0, 20).map((date) => {
        const lines = duoWorkouts.filter((w) => w.date === date).map((w) => {
          const m = clientById(w.clientId);
          return `<div class="sub">${esc(m ? m.name : '?')}: ${w.entries.map((e) => esc(e.name)).join(', ')}</div>`;
        }).join('');
        return `<div class="card"><div class="title">${esc(fmtDateFull(date))}</div>${lines}</div>`;
      }).join('') : `<p class="mut">Nog geen duo-trainingen gelogd.</p>`) +

      `<hr class="divider">
      <button class="danger ghost" id="del-duo">Duo verwijderen</button>`;

    bindNav();
    document.getElementById('del-duo').addEventListener('click', () => {
      if (!confirm('Dit duo verwijderen? De klanten en hun trainingen blijven bewaard.')) return;
      db.duos = db.duos.filter((d) => d.id !== duoId);
      db.duoSchemas = db.duoSchemas.filter((s) => s.duoId !== duoId);
      save(); location.hash = '/';
    });
  }

  // --- duo schema editor: per member, per-set targets ---
  function viewDuoSchema(duoId, sid) {
    const duo = duoById(duoId);
    const members = duo ? duo.clientIds.map(clientById) : [];
    if (!duo || members.some((m) => !m)) { location.hash = '/'; return; }

              </div>

                <select data-dexkind="${mi}.${i}">${Object.entries(KIND_LABELS).map(([k, l]) => `<option value="${k}" ${(e.kind || 'kracht') === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
              </label>
              ${targetRowsHtml(`${mi}.${i}`, e.targets, e.kind || 'kracht', 'drm-tgt')}
              <button type="button" class="small" data-dadd-tgt="${mi}.${i}">+ Set</button>
            </div>`).join('') +
            `<button type="button" class="small" data-dadd-ex="${mi}" style="margin:4px 0 16px">+ Oefening voor ${esc(m.name)}</button></div>`
          ).join('') +

        (!isNew ? `<hr class="divider"><button class="danger ghost" id="del-dschema">Duo-schema verwijderen</button>` : '');

      bindNav();
      const planOf = (mi) => draft.plans[members[mi].id];
      const syncDraft = () => {
        draft.name = document.querySelector('[name="name"]').value;
        document.querySelectorAll('[data-dexname]').forEach((inp) => {
          const [mi, i] = inp.dataset.dexname.split('.').map(Number);
          planOf(mi)[i].name = inp.value;
        });
        document.querySelectorAll('[data-dexkind]').forEach((sel) => {
          const [mi, i] = sel.dataset.dexkind.split('.').map(Number);
          planOf(mi)[i].kind = sel.value;
        });

        const list = planOf(mi);
