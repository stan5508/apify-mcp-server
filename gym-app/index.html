  // ---------- theme ----------
  function applyTheme() {
    const t = db.settings.theme || 'system';
    if (t === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
  }

  // ---------- screen lock ----------
  // A PIN keeps the app closed to whoever picks up the tablet. It is a screen
  // lock, not encryption: the data itself stays readable in browser storage.
  async function hashPin(pin, salt) {
    const buf = new TextEncoder().encode(salt + ':' + pin);
    const digest = await crypto.subtle.digest('SHA-256', buf);
    return [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, '0')).join('');
  }
  let unlocked = false;
  let hiddenSince = null;
  const lockNeeded = () => !!(db.settings.pin && !unlocked);

  function showLock() {
    const el = document.getElementById('lock-screen');
    el.hidden = false;
    el.innerHTML = `<div class="lock-box">
      <div class="brand">Coachlog</div>
      <p class="sub">Voer je pincode in.</p>
      <input id="lock-pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••" maxlength="12">
      <p class="mut" id="lock-msg"></p>
      <button class="primary wide" id="lock-ok">Ontgrendelen</button>
    </div>`;
    const input = document.getElementById('lock-pin');
    input.focus();
    const tryUnlock = async () => {
      const ok = await hashPin(input.value, db.settings.pin.salt) === db.settings.pin.hash;
      if (ok) {
        unlocked = true;
        el.hidden = true;
        render();
      } else {
        document.getElementById('lock-msg').textContent = 'Onjuiste pincode.';
        input.value = '';
        input.focus();
      }
    };
    document.getElementById('lock-ok').addEventListener('click', tryUnlock);
    input.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') tryUnlock(); });
  }

  function watchIdleLock() {
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { hiddenSince = Date.now(); return; }
      const mins = db.settings.lockMinutes || 0;
      if (db.settings.pin && mins > 0 && hiddenSince && Date.now() - hiddenSince > mins * 60000) {
        unlocked = false;
        showLock();
      }
      hiddenSince = null;
    });
  }

  // ---------- appointments, credits and payments ----------
  const APPT_STATUS = { gepland: 'Gepland', geweest: 'Geweest', noshow: 'No-show', geannuleerd: 'Geannuleerd' };
  const money = (n) => `${db.settings.currency || '€'} ${(Math.round(n * 100) / 100).toLocaleString('nl-NL', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  const apptTitle = (a) => a.duoId ? (duoById(a.duoId) ? duoName(duoById(a.duoId)) : 'Duo') : (clientById(a.clientId) || { name: '?' }).name;
  const apptClientIds = (a) => a.duoId ? ((duoById(a.duoId) || {}).clientIds || []) : [a.clientId];
  const sortedAppointments = () => [...db.appointments].sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
  const appointmentsOn = (date) => sortedAppointments().filter((a) => a.date === date);
  const appointmentsFor = (clientId) => sortedAppointments().filter((a) => apptClientIds(a).includes(clientId));
  const packagesOf = (clientId) => db.packages.filter((p) => p.clientId === clientId).sort((a, b) => a.date.localeCompare(b.date));
  const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };

  // one credit per training; a no-show costs a credit too unless switched off
  function creditLedger(clientId) {
    const packs = packagesOf(clientId);
    if (!packs.length) return null;
    const from = packs[0].date;
    const bought = packs.reduce((t, p) => t + (p.sessions || 0), 0);
    const trainings = workoutsOf(clientId).filter((w) => w.date >= from).length;
    const noShows = db.settings.noShowCounts
      ? appointmentsFor(clientId).filter((a) => a.status === 'noshow' && a.date >= from).length
      : 0;
    const used = trainings + noShows;
    return { from, bought, used, trainings, noShows, remaining: bought - used, low: bought - used <= 2 };
  }
  const openInvoices = () => db.packages.filter((p) => !p.paid).sort((a, b) => a.date.localeCompare(b.date));
  function revenueByMonth() {
    const months = new Map();
    for (const p of db.packages) {
      const m = p.date.slice(0, 7);
      const cur = months.get(m) || { month: m, invoiced: 0, paid: 0 };
      cur.invoiced += p.price || 0;
      if (p.paid) cur.paid += p.price || 0;
      months.set(m, cur);
    }
    return [...months.values()].sort((a, b) => b.month.localeCompare(a.month));
  }

  // reminders only fire while the app is open — a closed PWA cannot be woken here
  function scheduleReminders() {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const now = Date.now();
    for (const a of appointmentsOn(todayIso())) {
      if (a.status !== 'gepland' || !a.time) continue;
      const ms = new Date(`${a.date}T${a.time}:00`).getTime() - 15 * 60000 - now;
      if (ms <= 0 || ms > 12 * 3600000) continue;
      setTimeout(() => {
        try { new Notification('Over 15 minuten', { body: `${apptTitle(a)} om ${a.time}` }); } catch { /* blocked */ }
      }, ms);
    }
  }

  // ---------- analysis helpers ----------
  const PERIODS = { '3m': '3 mnd', '6m': '6 mnd', '1j': 'Jaar', all: 'Alles' };
  function periodStart(period) {
    if (period === 'all') return null;
    const d = new Date();
    if (period === '3m') d.setMonth(d.getMonth() - 3);
    else if (period === '6m') d.setMonth(d.getMonth() - 6);
    else d.setFullYear(d.getFullYear() - 1);
    return d.toISOString().slice(0, 10);
  }
  const inPeriod = (iso, period) => { const s = periodStart(period); return !s || iso >= s; };

  const MUSCLE_GROUPS = ['Borst', 'Rug', 'Benen', 'Schouders', 'Armen', 'Core', 'Cardio', 'Overig'];
  const groupColor = (group) => `var(--series-${(Math.max(0, MUSCLE_GROUPS.indexOf(group)) % 4) + 1})`;
  const groupKey = (name) => name.trim().toLowerCase();
  const groupOf = (name, kind) => {
    const rec = exerciseByName(name);
    if (rec) return rec.group;
    return db.muscleGroups[groupKey(name)] || (kind === 'cardio' ? 'Cardio' : 'Overig');
  };
  function setGroup(name, group) {
    const rec = exerciseByName(name);
    if (rec) rec.group = group;
    if (group) db.muscleGroups[groupKey(name)] = group;
    else delete db.muscleGroups[groupKey(name)];
    save();
  }

  // workload of one entry expressed in kg (cardio and rep-only work contribute 0 kg)
  const entryVolumeKg = (entry) => {
    const m = exerciseMetrics(entry);
    return m && m.kind === 'kracht' ? m.volume : 0;
  };

  // per-month totals for a client: sessions, volume, PR count
  function monthlyStats(clientId, period) {
    const ws = workoutsOf(clientId).filter((w) => inPeriod(w.date, period));
    const prDates = new Map(); // month -> count
    for (const name of loggedExercises(clientId)) {
      for (const s of exerciseSessions(clientId, name)) {
        if (!s.isPr || !inPeriod(s.date, period)) continue;
        const m = s.date.slice(0, 7);
        prDates.set(m, (prDates.get(m) || 0) + 1);
      }
    }
    const months = new Map();
    for (const w of ws) {
      const m = w.date.slice(0, 7);
      const cur = months.get(m) || { month: m, sessions: 0, volume: 0, minutes: 0, prs: 0 };
      cur.sessions++;
      cur.minutes += w.durationMin || 0;
      cur.volume += w.entries.reduce((t, e) => t + entryVolumeKg(e), 0);
      months.set(m, cur);
    }
    for (const [m, n] of prDates) {
      const cur = months.get(m) || { month: m, sessions: 0, volume: 0, minutes: 0, prs: 0 };
      cur.prs = n;
      months.set(m, cur);
    }
    return [...months.values()].sort((a, b) => a.month.localeCompare(b.month));
  }
  const monthLabel = (m) => new Date(m + '-01T12:00:00').toLocaleDateString('nl-NL', { month: 'long', year: 'numeric' });

  // training weeks in a row, counting back from this week
  function weekStreak(clientId) {
    const weeks = new Set(workoutsOf(clientId).map((w) => isoWeek(w.date)));
    let streak = 0;
    const d = new Date();
    for (let i = 0; i < 260; i++) {
      const key = isoWeek(d.toISOString().slice(0, 10));
      if (weeks.has(key)) streak++;
      else if (i > 0) break; // the current week may still be empty
      d.setDate(d.getDate() - 7);
    }
    return streak;
  }
  function isoWeek(iso) {
    const d = new Date(iso + 'T12:00:00');
    const day = (d.getDay() + 6) % 7; // monday = 0
    d.setDate(d.getDate() - day);
    return d.toISOString().slice(0, 10);
  }

  // volume per muscle group for a client in a period
  function groupTotals(clientId, period) {
    const totals = new Map();
    for (const w of workoutsOf(clientId)) {
      if (!inPeriod(w.date, period)) continue;
      for (const e of w.entries) {
        const m = exerciseMetrics(e);
        if (!m) continue;
        const g = groupOf(e.name, m.kind);
        const cur = totals.get(g) || { group: g, volume: 0, sets: 0, minutes: 0 };
        cur.sets += e.sets.filter((x) => setType(x) !== 'warmup').length;
        cur.volume += m.kind === 'kracht' ? m.volume : 0;
        cur.minutes += m.kind === 'cardio' ? m.minutes : 0;
        totals.set(g, cur);
      }
    }
    return [...totals.values()].sort((a, b) => (b.volume - a.volume) || (b.sets - a.sets));
  }

  // ---------- CSV export ----------
  function workoutsCsv(clientId) {
    const rows = [['klant', 'datum', 'duur_min', 'oefening', 'soort', 'superset', 'set', 'gewicht', 'herhalingen', 'rir', 'type', 'kant', 'afstand_km', 'tijd_min', 'notitie']];
    const list = clientId ? workoutsOf(clientId) : [...db.workouts].sort((a, b) => a.date.localeCompare(b.date));
    for (const w of list) {
      const client = clientById(w.clientId);
      w.entries.forEach((e) => e.sets.forEach((s, i) => rows.push([
        client ? client.name : '', w.date, w.durationMin || '', e.name, entryKind(e), e.superset || '',
        i + 1, s.weight ?? '', s.reps ?? '', s.rir ?? '', setType(s), setSide(s), s.distance ?? '', s.minutes ?? '', s.note || '',
      ])));
    }
    return rows.map((r) => r.map((v) => {
      const t = String(v ?? '');
      return /[";\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
    }).join(';')).join('\n');
  }
  function downloadCsv(clientId) {
    const name = clientId ? (clientById(clientId) || {}).name : 'alle-klanten';
    const blob = new Blob(['\ufeff' + workoutsCsv(clientId)], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `coachlog-${String(name).toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${todayIso()}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // ---------- timers (rest + interval) ----------
  const timer = { mode: null, endsAt: 0, tick: null, interval: null, paused: false, left: 0 };
  let audioCtx = null;
  function beep(times = 1) {
    if (!db.settings.sound) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      for (let i = 0; i < times; i++) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        const start = audioCtx.currentTime + i * 0.25;
        gain.gain.setValueAtTime(0.001, start);
        gain.gain.exponentialRampToValueAtTime(0.4, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.18);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.2);
      }
    } catch { /* audio unavailable */ }
    if (navigator.vibrate) navigator.vibrate(times > 1 ? [200, 100, 200] : 300);
  }
  const mmss = (sec) => {
    const total = Math.max(0, Math.round(sec));
    return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
  };

  function stopTimer() {
    clearInterval(timer.tick);
    timer.mode = null; timer.interval = null; timer.tick = null; timer.paused = false;
    document.getElementById('timer-bar').hidden = true;
    document.body.classList.remove('timer-on');
  }
  function startRest(seconds) {
    clearInterval(timer.tick);
    timer.mode = 'rest'; timer.interval = null; timer.paused = false;
    timer.endsAt = Date.now() + seconds * 1000;
    runTimer();
  }
  function startInterval(work, rest, rounds) {
    clearInterval(timer.tick);
    timer.mode = 'interval'; timer.paused = false;
    timer.interval = { work, rest, rounds, round: 1, phase: 'work' };
    timer.endsAt = Date.now() + work * 1000;
    beep();
    runTimer();
  }
  function runTimer() {
    const bar = document.getElementById('timer-bar');
    bar.hidden = false;
    document.body.classList.add('timer-on');
    const paint = () => {
      const left = timer.paused ? timer.left : (timer.endsAt - Date.now()) / 1000;
      const iv = timer.interval;
      const label = iv ? `${iv.phase === 'work' ? '💪 Werk' : '😮‍💨 Rust'} · ronde ${iv.round}/${iv.rounds}` : '⏱ Rust';
      bar.querySelector('.t-label').textContent = label;
      bar.querySelector('.t-time').textContent = mmss(left);
      bar.querySelector('.t-pause').textContent = timer.paused ? '▶' : '⏸';
      if (!timer.paused && left <= 0) {
        if (!iv) { beep(2); stopTimer(); return; }
        if (iv.phase === 'work') {
          if (iv.rest > 0) { iv.phase = 'rest'; timer.endsAt = Date.now() + iv.rest * 1000; beep(); return; }
          iv.round++;
        } else {
          iv.phase = 'work'; iv.round++;
        }
        if (iv.round > iv.rounds) { beep(2); stopTimer(); return; }
        iv.phase = 'work';
        timer.endsAt = Date.now() + iv.work * 1000;
        beep();
      }
    };
    paint();
    timer.tick = setInterval(paint, 250);
  }
  function bindTimerBar() {
    const bar = document.getElementById('timer-bar');
    bar.querySelector('.t-plus').addEventListener('click', () => {
      if (timer.paused) timer.left += 30; else timer.endsAt += 30000;
    });
    bar.querySelector('.t-pause').addEventListener('click', () => {
      if (timer.paused) { timer.endsAt = Date.now() + timer.left * 1000; timer.paused = false; }
      else { timer.left = (timer.endsAt - Date.now()) / 1000; timer.paused = true; }
    });
    bar.querySelector('.t-stop').addEventListener('click', stopTimer);
  }

  // ---------- plate calculator ----------
  const PLATES = [25, 20, 15, 10, 5, 2.5, 1.25];
  function platesFor(total, bar) {
    let perSide = (total - bar) / 2;
    if (perSide <= 0) return { ok: total >= bar, plates: [], rest: 0 };
    const out = [];
    for (const p of PLATES) {
      const n = Math.floor((perSide + 1e-9) / p);
      if (n > 0) { out.push({ plate: p, n }); perSide -= n * p; }
    }
    return { ok: true, plates: out, rest: Math.round(perSide * 100) / 100 };
  }
  const PLATE_COLORS = {
    25: ['#c8102e', '#ffffff'], 20: ['#0057b8', '#ffffff'], 15: ['#f2c200', '#17130a'],
    10: ['#009639', '#17130a'], 5: ['#f2f2f0', '#17130a'], 2.5: ['#c8102e', '#ffffff'], 1.25: ['#a8adb4', '#17130a'],
  };
  function plateHtml(total) {
    const bar = db.settings.barWeight || 20;
    const r = platesFor(total, bar);
    if (!total) return 'Vul een gewicht in.';
    if (!r.ok) return `${esc(fmtKg(total))} is lichter dan de stang (${esc(fmtKg(bar))}).`;
    if (!r.plates.length) return `Alleen de stang (${esc(fmtKg(bar))}).`;
    const fmtP = (v) => v.toLocaleString('nl-NL', { maximumFractionDigits: 2 });
    const pill = (pl) => {
      const [bg, fg] = PLATE_COLORS[pl.plate] || ['var(--raised)', 'var(--ink)'];
      return `<span class="plate" style="background:${bg};color:${fg}">${pl.n}×${fmtP(pl.plate)}</span>`;
    };
    return `Per kant: ${r.plates.map(pill).join(' ')}` +
      (r.rest > 0 ? ` <span class="mut">(${fmtP(r.rest)} ${esc(unitLbl())} rest)</span>` : '');
  }

  // ---------- chart ----------
  function niceTicks(min, max, count) {
    if (min === max) { min = Math.max(0, min - 1); max = max + 1; }
    const span = max - min;
    const step0 = span / count;
    const mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= step0) || 10 * mag;
    const lo = Math.floor(min / step) * step;
    const hi = Math.ceil(max / step) * step;
    const ticks = [];
    for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.round(v * 100) / 100);
    return ticks;
  }

  function renderChart(container, points, unit) {
    const W = 600, H = 260, padL = 44, padR = 16, padT = 14, padB = 30;
    const iw = W - padL - padR, ih = H - padT - padB;
    const vals = points.map((p) => p.value);
    const ticks = niceTicks(Math.min(...vals), Math.max(...vals), 4);
    const yMin = ticks[0], yMax = ticks[ticks.length - 1];
    const x = (i) => points.length === 1 ? padL + iw / 2 : padL + (i / (points.length - 1)) * iw;
    const y = (v) => padT + ih - ((v - yMin) / (yMax - yMin || 1)) * ih;
    const fmtVal = (v) => unit === 'kg' ? fmtKg(v)
      : unit === 'vol' ? Math.round(v).toLocaleString('nl-NL') + ' ' + unitLbl()
      : (Math.round(v * 10) / 10).toLocaleString('nl-NL') + ' ' + unit;

    const grid = ticks.map((t) =>
      `<line x1="${padL}" y1="${y(t)}" x2="${W - padR}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/>` +
      `<text x="${padL - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${t.toLocaleString('nl-NL')}</text>`
    ).join('');

    const lineD = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
    const areaD = points.length > 1
      ? `${lineD} L${x(points.length - 1).toFixed(1)},${(padT + ih).toFixed(1)} L${x(0).toFixed(1)},${(padT + ih).toFixed(1)} Z`
      : '';

    // x labels: first, last, and up to 2 in between
    const labelIdx = new Set([0, points.length - 1]);
    if (points.length > 4) { labelIdx.add(Math.round((points.length - 1) / 3)); labelIdx.add(Math.round(2 * (points.length - 1) / 3)); }
    const xLabels = [...labelIdx].map((i) =>
      `<text x="${x(i)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === points.length - 1 ? 'end' : 'middle'}" font-size="11" fill="var(--muted)">${esc(fmtDate(points[i].date))}</text>`
    ).join('');

    const dots = points.map((p, i) =>
      `<circle cx="${x(i)}" cy="${y(p.value)}" r="4" fill="var(--data)" stroke="var(--surface)" stroke-width="2"/>`
    ).join('');

    const last = points[points.length - 1];
    const endLabel = `<text x="${x(points.length - 1) - 8}" y="${y(last.value) - 10}" text-anchor="end" font-size="12" font-weight="650" fill="var(--ink)" style="font-variant-numeric:tabular-nums">${esc(fmtVal(last.value))}</text>`;

    container.innerHTML =
      `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progressiegrafiek">` +
      grid +
      `<line x1="${padL}" y1="${padT + ih}" x2="${W - padR}" y2="${padT + ih}" stroke="var(--baseline)" stroke-width="1"/>` +
      (areaD ? `<path d="${areaD}" fill="var(--data-wash)"/>` : '') +
      (points.length > 1 ? `<path d="${lineD}" fill="none" stroke="var(--data)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : '') +
      `<line class="xh" x1="0" y1="${padT}" x2="0" y2="${padT + ih}" stroke="var(--baseline)" stroke-width="1" visibility="hidden"/>` +
      dots + endLabel + xLabels +
      `</svg><div class="tooltip"></div>`;

    // hover: nearest point -> crosshair + tooltip
    const svg = container.querySelector('svg');
    const tip = container.querySelector('.tooltip');
    const xh = svg.querySelector('.xh');
    const onMove = (ev) => {
      const rect = svg.getBoundingClientRect();
      const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const px = ((cx - rect.left) / rect.width) * W;
      let best = 0, bd = Infinity;
      points.forEach((_, i) => { const d = Math.abs(x(i) - px); if (d < bd) { bd = d; best = i; } });
      const p = points[best];
      xh.setAttribute('x1', x(best)); xh.setAttribute('x2', x(best));
      xh.setAttribute('visibility', 'visible');
      tip.style.display = 'block';
      tip.style.left = (x(best) / W * rect.width) + 'px';
      tip.style.top = (y(p.value) / H * rect.height) + 'px';
      tip.innerHTML = `${esc(fmtDate(p.date))}<br><span class="tv">${esc(fmtVal(p.value))}</span>`;
    };
    const onLeave = () => { tip.style.display = 'none'; xh.setAttribute('visibility', 'hidden'); };
    svg.addEventListener('mousemove', onMove);
    svg.addEventListener('touchstart', onMove, { passive: true });
    svg.addEventListener('touchmove', onMove, { passive: true });
    svg.addEventListener('mouseleave', onLeave);
  }

  // multi-series line chart with legend (used to compare exercises)
  function renderMultiChart(container, series, unit) {
    const W = 600, H = 280, padL = 48, padR = 16, padT = 14, padB = 30;
    const iw = W - padL - padR, ih = H - padT - padB;
    const dates = [...new Set(series.flatMap((s) => s.points.map((p) => p.date)))].sort();
    const vals = series.flatMap((s) => s.points.map((p) => p.value));
    if (!dates.length || !vals.length) { container.innerHTML = '<p class="mut">Geen gegevens in deze periode.</p>'; return; }
    const ticks = niceTicks(Math.min(...vals), Math.max(...vals), 4);
    const yMin = ticks[0], yMax = ticks[ticks.length - 1];
    const x = (iso) => dates.length === 1 ? padL + iw / 2 : padL + (dates.indexOf(iso) / (dates.length - 1)) * iw;
    const y = (v) => padT + ih - ((v - yMin) / (yMax - yMin || 1)) * ih;

    const grid = ticks.map((t) =>
      `<line x1="${padL}" y1="${y(t)}" x2="${W - padR}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/>` +
      `<text x="${padL - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${t.toLocaleString('nl-NL')}</text>`
    ).join('');

    const body = series.map((s, si) => {
      const col = `var(--series-${(si % 4) + 1})`;
      const pts = [...s.points].sort((a, b) => a.date.localeCompare(b.date));
      const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.date).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
      const dots = pts.map((p) => `<circle cx="${x(p.date)}" cy="${y(p.value)}" r="4" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`).join('');
      return (pts.length > 1 ? `<path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : '') + dots;
    }).join('');

    const xLabels = `<text x="${padL}" y="${H - 8}" text-anchor="start" font-size="11" fill="var(--muted)">${esc(fmtDate(dates[0]))}</text>` +
      (dates.length > 1 ? `<text x="${W - padR}" y="${H - 8}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(fmtDate(dates[dates.length - 1]))}</text>` : '');

    container.innerHTML =
      `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vergelijking van oefeningen">` +
      grid +
      `<line x1="${padL}" y1="${padT + ih}" x2="${W - padR}" y2="${padT + ih}" stroke="var(--baseline)" stroke-width="1"/>` +
      body + xLabels +
      `</svg>` +
      `<div class="legend">${series.map((s, si) =>
        `<span><i style="background:var(--series-${(si % 4) + 1})"></i>${esc(s.label)}</span>`).join('')}</div>` +
      (unit ? `<p class="mut" style="margin:6px 0 0">Waarden in ${esc(unit)}.</p>` : '');
  }

  function renderBarChart(container, points) {
    const W = 600, H = 240, padL = 48, padR = 16, padT = 14, padB = 30;
    const iw = W - padL - padR, ih = H - padT - padB;
    const ticks = niceTicks(0, Math.max(...points.map((p) => p.value)), 4);
    const yMax = ticks[ticks.length - 1];
    const y = (v) => padT + ih - (v / (yMax || 1)) * ih;
    const band = iw / points.length;
    const bw = Math.max(2, Math.min(24, band - 2));
    const bx = (i) => padL + i * band + (band - bw) / 2;
    const fmtVal = (v) => Math.round(v).toLocaleString('nl-NL') + ' ' + unitLbl();

    const grid = ticks.map((t) =>
      `<line x1="${padL}" y1="${y(t)}" x2="${W - padR}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/>` +
      `<text x="${padL - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${t.toLocaleString('nl-NL')}</text>`
    ).join('');

    // rounded top corners, square baseline
    const bars = points.map((p, i) => {
      const x0 = bx(i), yv = y(p.value), h = padT + ih - yv;
      const r = Math.min(4, bw / 2, h);
      return `<path d="M${x0.toFixed(1)},${padT + ih} L${x0.toFixed(1)},${(yv + r).toFixed(1)} Q${x0.toFixed(1)},${yv.toFixed(1)} ${(x0 + r).toFixed(1)},${yv.toFixed(1)} L${(x0 + bw - r).toFixed(1)},${yv.toFixed(1)} Q${(x0 + bw).toFixed(1)},${yv.toFixed(1)} ${(x0 + bw).toFixed(1)},${(yv + r).toFixed(1)} L${(x0 + bw).toFixed(1)},${padT + ih} Z" fill="var(--data)"/>`;
    }).join('');

    const xLabels =
      `<text x="${bx(0)}" y="${H - 8}" text-anchor="start" font-size="11" fill="var(--muted)">${esc(fmtDate(points[0].date))}</text>` +
      (points.length > 1 ? `<text x="${bx(points.length - 1) + bw}" y="${H - 8}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(fmtDate(points[points.length - 1].date))}</text>` : '');

    container.innerHTML =
      `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Volume per training">` +
      grid + bars +
      `<line x1="${padL}" y1="${padT + ih}" x2="${W - padR}" y2="${padT + ih}" stroke="var(--baseline)" stroke-width="1"/>` +
      xLabels +
      `</svg><div class="tooltip"></div>`;

    const svg = container.querySelector('svg');
    const tip = container.querySelector('.tooltip');
    const onMove = (ev) => {
      const rect = svg.getBoundingClientRect();
      const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const px = ((cx - rect.left) / rect.width) * W;
      let best = 0, bd = Infinity;
      points.forEach((_, i) => { const d = Math.abs(bx(i) + bw / 2 - px); if (d < bd) { bd = d; best = i; } });
      const p = points[best];
      tip.style.display = 'block';
      tip.style.left = ((bx(best) + bw / 2) / W * rect.width) + 'px';
      tip.style.top = (y(p.value) / H * rect.height) + 'px';
      tip.innerHTML = `${esc(fmtDate(p.date))}<br><span class="tv">${esc(fmtVal(p.value))}</span>`;
    };
    svg.addEventListener('mousemove', onMove);
    svg.addEventListener('touchstart', onMove, { passive: true });
    svg.addEventListener('touchmove', onMove, { passive: true });
    svg.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  }

    if (parts[0] === 'klant' && parts[2] === 'vrij') return viewPickExercises(parts[1]);
    if (parts[0] === 'klant' && parts[2] === 'sjabloon') return viewTemplatePick('klant', parts[1]);
    if (parts[0] === 'klant') return viewClient(parts[1]);
    if (parts[0] === 'sjabloon') return viewTemplate(parts[1]);
    if (parts[0] === 'agenda') return viewAgenda(parts[1] || todayIso());
    if (parts[0] === 'zakelijk') return viewBusiness();
    if (parts[0] === 'voedingsmiddelen') return viewFoods();
    if (parts[0] === 'vanklanten') return viewClientFeed(parts[1] || null);
    if (parts[0] === 'instellingen') return viewSettings();
    if (parts[0] === 'cloud') return viewSettings('cloud-card');
    if (parts[0] === 'bibliotheek') return viewLibrary(parts[1] ? decodeURIComponent(parts[1]) : null);
    if (parts[0] === 'duo' && parts[2] === 'vrij') return viewDuoPick(parts[1]);
    if (parts[0] === 'duo' && parts[2] === 'sjabloon') return viewTemplatePick('duo', parts[1]);
    if (parts[0] === 'duo' && parts[2] === 'schema') return viewDuoSchema(parts[1], parts[3]);
    if (parts[0] === 'duo' && parts[2] === 'training') return viewDuoWorkout(parts[1], parts[3]);
    if (parts[0] === 'duo') return viewDuo(parts[1]);
    return viewToday();
  }

  function topbar(title, backHash) {
    return `<div class="topbar">` +
      (backHash != null ? `<button class="back" data-nav="${esc(backHash)}" aria-label="Terug">←</button>` : '') +
      `<h1>${esc(title)}</h1>` +
      `</div>`;
  }

  // --- vandaag: what the day looks like ---
  function viewToday() {
    const clients = sortedClients().filter((c) => !c.archived);
    const archivedCount = db.clients.length - clients.length;
    const lowCredit = clients.map((c) => ({ c, l: creditLedger(c.id) })).filter((x) => x.l && x.l.low);
    const today = appointmentsOn(todayIso());
    const tomorrow = appointmentsOn(addDays(todayIso(), 1));
    const lastDateOf = (id) => { const ws = workoutsOf(id); return ws.length ? ws[ws.length - 1].date : null; };
    const seen = clients.map((c) => ({ c, date: lastDateOf(c.id) }));
    const quiet = seen.filter((x) => !x.date || x.date < addDays(todayIso(), -7))
      .sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    const recent = seen.filter((x) => x.date).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 3);
    const apptHash = (a) => a.duoId ? `/duo/${a.duoId}` : `/klant/${a.clientId}`;
    const apptLine = (a) => `<div class="row" style="margin-bottom:4px"><div class="grow sub">${a.time ? esc(a.time) + ' · ' : ''}${esc(apptTitle(a))}</div>
      <span class="badge${a.status === 'geweest' ? ' pr' : ''}">${APPT_STATUS[a.status]}</span>${
      a.status === 'gepland' ? `<button class="small" data-nav="${apptHash(a)}">Start ›</button>` : ''}</div>`;
    $app.innerHTML = topbar('Vandaag') +
      `<div class="stat-grid">
        <div class="stat"><div class="lbl">Klanten</div><div class="val">${clients.length}</div>${archivedCount ? `<div class="mut">${archivedCount} gearchiveerd</div>` : ''}</div>
        <div class="stat"><div class="lbl">Duo's</div><div class="val">${sortedDuos().length}</div></div>
        <div class="stat"><div class="lbl">Trainingen</div><div class="val">${db.workouts.length}</div></div>
      </div>` +
      `<div class="eyebrow">Agenda</div>
      <div class="card tappable" data-nav="/agenda" role="link" tabindex="0">
        ${today.length ? `<div class="title" style="margin-bottom:6px">Vandaag (${today.length})</div>${today.map(apptLine).join('')}`
          : '<div class="mut">Vandaag geen afspraken.</div>'}
        ${tomorrow.length ? `<div class="title" style="margin:10px 0 6px">Morgen (${tomorrow.length})</div>${tomorrow.map(apptLine).join('')}` : ''}
      </div>` +
      (recent.length ? `<div class="eyebrow">Snel starten</div>
        <div class="actions">${recent.map(({ c }) => `<button data-nav="/klant/${c.id}">${esc(c.name)} ›</button>`).join('')}</div>` : '') +
      (quiet.length ? `<div class="eyebrow">Langer dan een week niet geweest</div>
        <div class="card">
          ${quiet.slice(0, 6).map(({ c, date }) => `<div class="row" style="margin-bottom:4px"><div class="grow sub">${esc(c.name)}</div>
            <span class="mut">${date ? esc(fmtDate(date)) : 'nog geen training'}</span>
            <button class="small" data-nav="/klant/${c.id}">Openen ›</button></div>`).join('')}
          ${quiet.length > 6 ? `<p class="mut" style="margin:8px 0 0">en nog ${quiet.length - 6}.</p>` : ''}
        </div>` : '') +
      (lowCredit.length ? `<div class="eyebrow">Sessietegoed bijna op</div>
        <div class="card tappable" data-nav="/zakelijk" role="link" tabindex="0">
          ${lowCredit.map(({ c, l }) => `<div class="row" style="margin-bottom:4px"><div class="grow sub">${esc(c.name)}</div>
            <span class="delta down">nog ${l.remaining}</span></div>`).join('')}
        </div>` : '') +
      (clients.length ? '' : `<div class="empty"><p>Nog geen klanten. Voeg je eerste klant toe, of bekijk de app met voorbeelddata.</p><button class="primary" id="demo-btn">Voorbeelddata laden</button></div>`) +
      `<div class="eyebrow">Nieuwe klant</div>
      <form class="card" id="add-client">
        <label class="field"><span>Naam nieuwe klant</span><input name="name" required placeholder="bijv. Sanne de Vries"></label>
        <label class="field"><span>Doel (optioneel)</span><input name="goal" placeholder="bijv. kracht opbouwen, 5 kg afvallen"></label>
        <button class="primary wide" type="submit">Klant toevoegen</button>
      </form>
      <div class="eyebrow">Nieuw duo</div>` +
      (clients.length >= 2 ? `<form class="card" id="add-duo">
        <label class="field"><span>Klant 1</span><select name="a">${clients.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>
        <label class="field"><span>Klant 2</span><select name="b">${clients.map((c, i) => `<option value="${c.id}" ${i === 1 ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
        <label class="field"><span>Naam duo (optioneel)</span><input name="name" placeholder="bijv. Sanne & Piet"></label>
        <button class="primary wide" type="submit">Duo toevoegen</button>
      </form>` : `<p class="mut">Voeg minstens twee klanten toe om een duo te maken.</p>`) +
      `<hr class="divider">
      <div class="actions"><button data-nav="/instellingen">Instellingen ›</button></div>
      <p class="mut" style="margin-top:16px">Coachlog versie ${APP_VERSION}</p>`;

    bindNav();
    document.getElementById('add-client').addEventListener('submit', (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const name = String(f.get('name')).trim();
      if (!name) return;
      const c = { id: uid(), name, goal: String(f.get('goal')).trim() };
      db.clients.push(c); save();
      location.hash = `/klant/${c.id}`;
    });
    const demo = document.getElementById('demo-btn');
    if (demo) demo.addEventListener('click', () => { loadDemo(); save(); render(); });
    const duoForm = document.getElementById('add-duo');
    if (duoForm) duoForm.addEventListener('submit', (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const a = String(f.get('a')), b = String(f.get('b'));
      if (a === b) { alert('Kies twee verschillende klanten.'); return; }
      const d = { id: uid(), clientIds: [a, b], name: String(f.get('name')).trim() };
      db.duos.push(d); save();
      location.hash = `/duo/${d.id}`;
    });
  }

      try {
        const regs = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistrations() : [];
        await Promise.all(regs.map(async (r) => r.update()));
        const keys = await caches.keys();
        // keep the photo cache: those stay valid and are expensive to fetch again
        await Promise.all(keys.filter((k) => k !== 'coachlog-photos').map(async (k) => caches.delete(k)));
        msg.textContent = 'Klaar. De app wordt opnieuw geladen…';
        setTimeout(() => location.reload(), 700);
      } catch (e) {
        msg.textContent = 'Bijwerken mislukt: ' + e.message;
        ev.target.disabled = false;
      }
    });

      db.settings.barWeight = Math.max(0, num(ev.target.value)); save(); render();

      db.settings.autoRest = !db.settings.autoRest; save(); render();

      db.settings.theme = t; db.settings.themePicked = true; save(); applyTheme(); render();

      const pin = document.getElementById('pin-new').value.trim();
      if (pin.length < 4) { alert('Kies een pincode van minstens 4 tekens.'); return; }
      const salt = uid();
      db.settings.pin = { salt, hash: await hashPin(pin, salt) };
      unlocked = true;
      save(); render();
    });
    const pinOff = document.getElementById('pin-off');
    if (pinOff) pinOff.addEventListener('click', () => {
      if (!confirm('Pincode uitzetten?')) return;
      db.settings.pin = null; save(); render();
    });
    const lockMin = document.getElementById('lock-min');
    if (lockMin) lockMin.addEventListener('change', (ev) => {
      db.settings.lockMinutes = Math.max(0, Math.min(240, num(ev.target.value)));
      save();
    });
    const backupList = document.getElementById('backup-list');
    if (backupList) backupList.addEventListener('click', async () => {
      const box = document.getElementById('backup-box');
      box.innerHTML = '<p class="mut">Ophalen…</p>';
      try {
        const names = await listBackups();
        box.innerHTML = names.length
          ? names.map((n) => `<div class="row" style="margin-top:8px"><div class="grow sub">${esc(n.replace('backup-', '').replace('.json', ''))}</div>
              <button class="small" data-restore="${esc(n)}">Terugzetten</button></div>`).join('')
          : '<p class="mut">Nog geen back-ups; die verschijnen na de eerste synchronisatie van vandaag.</p>';
        box.querySelectorAll('[data-restore]').forEach((b) => b.addEventListener('click', async () => {
          if (!confirm(`Alles terugzetten naar ${b.dataset.restore.replace('backup-', '').replace('.json', '')}? De huidige gegevens worden overschreven.`)) return;
          await restoreBackup(b.dataset.restore);
        }));
      } catch (e) {
        box.innerHTML = `<p class="mut">Ophalen mislukt (${esc(e.message)}).</p>`;
      }
    });
    document.getElementById('set-sound').addEventListener('click', () => {
      db.settings.sound = !db.settings.sound; save(); if (db.settings.sound) beep(); render();
    });
    const cloudSave = document.getElementById('cloud-save');
    if (cloudSave) cloudSave.addEventListener('click', () => {
      const url = document.getElementById('cloud-url').value.trim();
      const key = document.getElementById('cloud-key').value.trim();
      if (!/^https:\/\/.+/.test(url) || key.length < 20) { alert('Vul een geldige project-URL en anon-sleutel in.'); return; }
      cloud.setConfig(url, key);
      render();
    });
    const cloudForget = document.getElementById('cloud-forget');
    if (cloudForget) cloudForget.addEventListener('click', () => { cloud.clearConfig(); render(); });
    const cloudLogin = document.getElementById('cloud-login');
    if (cloudLogin) cloudLogin.addEventListener('click', async () => {
      const email = document.getElementById('cloud-email').value.trim();
      const msg = document.getElementById('cloud-msg');
      if (!email) return;
      cloudLogin.disabled = true;
      msg.textContent = 'Versturen…';
      try {
        await cloud.sendLink(email, location.origin + location.pathname);
        msg.textContent = 'Inloglink verstuurd. Open hem op dit apparaat.';
      } catch (e) {
        msg.textContent = 'Versturen mislukt: ' + e.message;
        cloudLogin.disabled = false;
      }
    });
    const cloudLogout = document.getElementById('cloud-logout');
    if (cloudLogout) cloudLogout.addEventListener('click', () => { cloud.signOut(); render(); });
    const inviteNew = document.getElementById('invite-new');
    if (inviteNew) inviteNew.addEventListener('click', async () => {
      const label = prompt('Voor welke klant is deze code?') || '';
      const box = document.getElementById('invite-box');
      box.innerHTML = '<p class="mut">Aanmaken…</p>';
      try {
        await cloud.ensureProfile('coach', db.settings.coachName || '');
        const code = (Math.random().toString(36).slice(2, 6) + Math.random().toString(36).slice(2, 6)).toUpperCase();
        await cloud.insert('invites', [{ code, coach_id: cloud.userId(), label: label.trim() }]);
        box.innerHTML = `<div class="note-box" style="margin-top:10px"><strong>Code voor ${esc(label.trim() || 'nieuwe klant')}:</strong> ${esc(code)}<br>
          Stuur samen met de link: ${esc(location.origin + location.pathname.replace(/[^/]*$/, ''))}sporter.html</div>`;
      } catch (e) {
        box.innerHTML = `<p class="mut">Aanmaken mislukt: ${esc(e.message)}</p>`;
      }
    });
    const syncStatusEl = document.getElementById('sync-status');
    const connectBtn = document.getElementById('sync-connect');
    if (connectBtn) connectBtn.addEventListener('click', async () => {
      const token = document.getElementById('sync-token').value.trim();
      if (!token) return;
      connectBtn.disabled = true;
      syncStatusEl.textContent = 'verbinden…';
      try {
        await connectSync(token);
        render();
      } catch (e) {
        syncCfg = null;
        localStorage.removeItem(SYNC_KEY);
        syncStatusEl.textContent = 'verbinden mislukt (' + e.message + ') — controleer het token';
        connectBtn.disabled = false;
      }
    });
    const syncNowBtn = document.getElementById('sync-now');
    if (syncNowBtn) syncNowBtn.addEventListener('click', async () => {
      syncStatusEl.textContent = 'synchroniseren…';
      await syncNow();
    });
    const syncOffBtn = document.getElementById('sync-off');
    if (syncOffBtn) syncOffBtn.addEventListener('click', () => {
      if (!confirm('Synchronisatie ontkoppelen? Je gegevens blijven op dit apparaat en in de cloud staan.')) return;
      syncCfg = null;
      localStorage.removeItem(SYNC_KEY);
      syncStatus = '';
      render();
    });
  }

  let pendingFree = []; // exercises picked for a free session, set by viewPickExercises
  let pendingDuo = null; // { duoId, picks: { [clientId]: [names] } }, set by viewDuoPick
  function viewClient(id) {
    const c = clientById(id);
    if (!c) { location.hash = '/'; return; }
    const schemas = schemasOf(id);
    const workouts = workoutsOf(id);
    const exercises = loggedExercises(id);

    // stats
    const last = workouts[workouts.length - 1];
    const statHtml = `<div class="stat-grid">
      <div class="stat"><div class="lbl">Trainingen</div><div class="val">${workouts.length}</div></div>
      <div class="stat"><div class="lbl">Laatste</div><div class="val">${last ? esc(fmtDate(last.date)) : '—'}</div></div>
      <div class="stat"><div class="lbl">Oefeningen</div><div class="val">${exercises.length}</div></div>
    </div>`;

    const exerciseCards = exercises.map((name) => {
      const sessions = exerciseSessions(id, name);
      const lastSession = sessions[sessions.length - 1];
      const pr = Math.max(...sessions.map((s) => s.top));
      const k = lastSession.kind || 'kracht';
      const prTxt = k === 'cardio' ? `${fmtNum(pr)} km` : k === 'lichaamsgewicht' && pr === 0 ? `${Math.max(...sessions.map((s) => s.bestReps))} herh.` : fmtKg(pr);
      return `<div class="card tappable" data-nav="/klant/${id}/oefening/${encodeURIComponent(name)}" role="link" tabindex="0">
        <div class="row"><div class="grow">
          <div class="title">${esc(name)}${k !== 'kracht' ? ` <span class="badge">${KIND_LABELS[k]}</span>` : ''}</div>
          <div class="sub">PR ${esc(prTxt)} · laatst gedaan ${esc(fmtDate(lastSession.date))}</div>
        </div><span class="mut">›</span></div>
      </div>`;
    }).join('');

    $app.innerHTML = topbar(c.name, '/') +
      clientTabs(id, '') +
      (c.goal ? `<p class="sub" style="margin:0 0 12px">Doel: ${esc(c.goal)}</p>` : '') +
      ((c.injuries || c.medical) ? `<div class="note-box"><strong>Let op:</strong> ${esc([c.injuries, c.medical].filter(Boolean).join(' · '))}</div>` : '') +
      statHtml +
      `<div style="margin-top:16px" class="actions">` +
      schemas.map((s) => `<button class="primary" data-nav="/klant/${id}/training/${s.id}">Start: ${esc(s.name)}</button>`).join('') +
      `<button class="primary" data-nav="/klant/${id}/vrij">+ Vrije training</button>` +
      `</div>` +

      `<div class="eyebrow">Progressie per oefening</div>` +
      (exerciseCards || `<div class="empty"><p>Nog geen trainingen gelogd. Start een training om progressie te zien.</p></div>`) +

      `<div class="eyebrow">Schema's</div>` +
      schemas.map((s) => `<div class="card tappable" data-nav="/klant/${id}/schema/${s.id}" role="link" tabindex="0">
          <div class="row"><div class="grow">
            <div class="title">${esc(s.name)}</div>
            <div class="sub">${s.exercises.map((e) => esc(e.name)).join(' · ') || 'nog geen oefeningen'}</div>
          </div><span class="mut">›</span></div>
        </div>`).join('') +
      `<div class="actions" style="margin-top:2px"><button data-nav="/klant/${id}/schema/nieuw">+ Nieuw schema</button><button data-nav="/klant/${id}/sjabloon">+ Schema uit sjabloon</button></div>` +

      `<div class="eyebrow">Logboek</div>` +
      (workouts.length ? [...workouts].reverse().slice(0, 20).map((w) => {
        const schema = schemaById(w.schemaId);
        const summary = w.entries.map((e) => {
          const m = exerciseMetrics(e);
          if (!m) return esc(e.name);
          const val = m.kind === 'cardio' ? `${fmtNum(m.distance)} km` : m.kind === 'lichaamsgewicht' ? `${m.bestReps} herh.` : fmtKg(m.top);
          return `${esc(e.name)} ${val}`;
        }).join(' · ');
        return `<div class="card">
          <div class="row">
            <div class="grow">
              <div class="title">${esc(fmtDateFull(w.date))} <span class="badge">${esc(schema ? schema.name : w.duoId ? (duoSchemaById(w.schemaId) || {}).name || 'Duo-training' : 'Vrije training')}</span></div>
              <div class="sub">${summary}</div>
              ${w.durationMin ? `<div class="mut">Duur: ${w.durationMin} min</div>` : ''}
              ${w.notes ? `<div class="mut">${esc(w.notes)}</div>` : ''}
            </div>
            <button class="small ghost" data-edit-workout="${w.id}" aria-label="Bewerk training">✎</button>
            <button class="small danger ghost" data-del-workout="${w.id}" aria-label="Verwijder training">✕</button>
          </div>
        </div>`;
      }).join('') : `<p class="mut">Nog geen trainingen.</p>`) +

      `<hr class="divider">
       <button class="danger ghost" id="del-client">Klant verwijderen</button>`;

    bindNav();

    document.querySelectorAll('[data-edit-workout]').forEach((b) => b.addEventListener('click', () => {
      location.hash = `/klant/${id}/bewerk/${b.dataset.editWorkout}`;
    }));
    document.querySelectorAll('[data-del-workout]').forEach((b) => b.addEventListener('click', () => {
      if (!confirm('Deze training verwijderen?')) return;
      db.workouts = db.workouts.filter((w) => w.id !== b.dataset.delWorkout);
      save(); render();
    }));
    document.getElementById('del-client').addEventListener('click', () => {
      if (!confirm(`${c.name} en alle bijbehorende schema's en trainingen verwijderen?`)) return;
      db.clients = db.clients.filter((x) => x.id !== id);
      db.schemas = db.schemas.filter((s) => s.clientId !== id);
      db.workouts = db.workouts.filter((w) => w.clientId !== id);
      db.duos = db.duos.filter((d) => !d.clientIds.includes(id));
      db.measurements = db.measurements.filter((m) => m.clientId !== id);
      save(); location.hash = '/';
    });
  }

  // client sub-navigation
  function clientTabs(id, active) {
    const tabs = [
      ['', 'Training'],
      ['profiel', 'Profiel'],
      ['overzicht', 'Overzicht'],
      ['vergelijk', 'Vergelijken'],
      ['metingen', 'Metingen'],
      ['voeding', 'Voeding'],
      ['rapport', 'Rapport'],
    ];
    return `<div class="chips no-print" style="margin-bottom:14px">${tabs.map(([slug, label]) =>
      `<button class="chip" data-nav="/klant/${id}${slug ? '/' + slug : ''}" aria-pressed="${active === slug}">${label}</button>`
    ).join('')}</div>`;
  }

  // period filter row
  function periodBar() {
    return `<div class="seg no-print" role="group" aria-label="Periode" style="max-width:340px;margin-bottom:12px">${
      Object.entries(PERIODS).map(([k, l]) => `<button data-period="${k}" aria-pressed="${uiState.period === k}">${l}</button>`).join('')}</div>`;

    document.querySelectorAll('[data-period]').forEach((b) => b.addEventListener('click', () => {

  // --- agenda: day view with appointments ---
  function viewAgenda(date) {
    const list = appointmentsOn(date);
    const week = Array.from({ length: 7 }, (_, i) => addDays(date, i - 3));
    const dayLabel = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric' });
    const statusClass = { gepland: '', geweest: 'pr', noshow: '', geannuleerd: '' };

    $app.innerHTML = topbar('Agenda', '/') +
      `<div class="chips" style="margin-bottom:12px">
        ${week.map((d) => `<button class="chip" data-day="${d}" aria-pressed="${d === date}">${esc(dayLabel(d))}</button>`).join('')}
        <button class="chip" data-day="${todayIso()}">Vandaag</button>
      </div>
      <div class="row" style="margin-bottom:12px">
        <input type="date" id="agenda-date" value="${esc(date)}" class="grow">
      </div>
      <div class="eyebrow">${esc(fmtDateFull(date))}</div>` +
      (list.length ? list.map((a) => {
        const ledgers = apptClientIds(a).map((cid) => ({ name: (clientById(cid) || {}).name, l: creditLedger(cid) })).filter((x) => x.l);
        return `<div class="card">
          <div class="row"><div class="grow">
            <div class="title">${a.time ? esc(a.time) + ' · ' : ''}${esc(apptTitle(a))}
              <span class="badge${a.status === 'geweest' ? ' pr' : ''}">${APPT_STATUS[a.status]}</span></div>
            <div class="sub">${a.durationMin ? a.durationMin + ' min' : ''}${a.note ? (a.durationMin ? ' · ' : '') + esc(a.note) : ''}</div>
            ${ledgers.map((x) => `<div class="mut">${esc(x.name)}: nog ${x.l.remaining} sessie${x.l.remaining === 1 ? '' : 's'}${x.l.low ? ' ⚠️' : ''}</div>`).join('')}
          </div>
          <button class="small ghost" data-appt-del="${a.id}" aria-label="Verwijder afspraak">✕</button></div>
          <div class="pillbar" style="margin-top:8px">
            ${Object.entries(APPT_STATUS).map(([k, l]) => `<button type="button" data-appt-status="${a.id}.${k}" aria-pressed="${a.status === k}">${l}</button>`).join('')}
            ${!a.duoId ? `<button type="button" data-appt-train="${a.id}">Start training ›</button>` : ''}
          </div>
        </div>`;
      }).join('') : '<p class="mut">Geen afspraken op deze dag.</p>') +

      `<div class="eyebrow">Afspraak toevoegen</div>
      <form class="card" id="appt-form">
        <label class="field"><span>Klant of duo</span>
          <select name="who" required>
            <optgroup label="Klanten">${sortedClients().filter((c) => !c.archived).map((c) => `<option value="c:${c.id}">${esc(c.name)}</option>`).join('')}</optgroup>
            <optgroup label="Duo's">${sortedDuos().map((d) => `<option value="d:${d.id}">${esc(duoName(d))}</option>`).join('')}</optgroup>
          </select></label>
        <div class="row">
          <label class="field grow"><span>Datum</span><input type="date" name="date" value="${esc(date)}" required></label>
          <label class="field grow"><span>Tijd</span><input type="time" name="time" value="09:00"></label>
          <label class="field grow"><span>Duur (min)</span><input type="number" name="duration" min="15" step="15" value="60"></label>
        </div>
        <label class="field"><span>Notitie</span><input name="note" placeholder="bijv. focus op techniek"></label>
        <button class="primary" type="submit">Afspraak toevoegen</button>
      </form>` +

      `<div class="eyebrow">Herinneringen</div>
      <div class="card">
        <p class="sub" style="margin:0 0 8px">Meldingen 15 minuten voor een afspraak. Ze verschijnen alleen zolang de app open staat — een gesloten app kan de browser hier niet wekken.</p>
        <button id="notif-btn">${('Notification' in window) && Notification.permission === 'granted' ? 'Meldingen staan aan' : 'Meldingen aanzetten'}</button>
      </div>`;

    bindNav();
    document.querySelectorAll('[data-day]').forEach((b) => b.addEventListener('click', () => { location.hash = `/agenda/${b.dataset.day}`; }));
    document.getElementById('agenda-date').addEventListener('change', (ev) => { location.hash = `/agenda/${ev.target.value}`; });
    document.getElementById('appt-form').addEventListener('submit', (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const who = String(f.get('who'));
      if (!who) return;
      const appt = {
        id: uid(), date: String(f.get('date')), time: String(f.get('time')),
        durationMin: num(f.get('duration')) || null, status: 'gepland', note: String(f.get('note')).trim(),
      };
      if (who.startsWith('c:')) appt.clientId = who.slice(2); else appt.duoId = who.slice(2);
      db.appointments.push(appt);
      save();
      location.hash = `/agenda/${appt.date}`;
      render();
    });
    document.querySelectorAll('[data-appt-status]').forEach((b) => b.addEventListener('click', () => {
      const raw = b.dataset.apptStatus;
      const id = raw.slice(0, raw.lastIndexOf('.'));
      const appt = db.appointments.find((a) => a.id === id);
      appt.status = raw.slice(raw.lastIndexOf('.') + 1);
      save(); render();
    }));
    document.querySelectorAll('[data-appt-del]').forEach((b) => b.addEventListener('click', () => {
      if (!confirm('Deze afspraak verwijderen?')) return;
      db.appointments = db.appointments.filter((a) => a.id !== b.dataset.apptDel);
      save(); render();
    }));
    document.querySelectorAll('[data-appt-train]').forEach((b) => b.addEventListener('click', () => {
      const appt = db.appointments.find((a) => a.id === b.dataset.apptTrain);
      appt.status = 'geweest';
      save();
      location.hash = `/klant/${appt.clientId}`;
    }));
    document.getElementById('notif-btn').addEventListener('click', async () => {
      if (!('Notification' in window)) { alert('Deze browser ondersteunt geen meldingen.'); return; }
      const res = await Notification.requestPermission();
      if (res === 'granted') scheduleReminders();
      render();
    });
  }

    const q = uiState.libQuery.trim().toLowerCase();
    const uses = usageMap();
    const usageOf = (name) => uses.get(exKey(name)) || emptyUsage();
    const SORTS = { used: 'Meest gebruikt', name: 'Naam', recent: 'Laatst gebruikt', unused: 'Ongebruikt eerst' };
    const list = db.exercises
      .filter((e) => uiState.libShowArchived ? e.archived : !e.archived)
      .filter((e) => !group || e.group === group)
      .filter((e) => !uiState.libEquipment || e.equipment === uiState.libEquipment)
      .filter((e) => !uiState.libKind || e.kind === uiState.libKind)
      .filter((e) => !q || e.name.toLowerCase().includes(q) || (e.aliases || []).some((a) => a.toLowerCase().includes(q)))
      .map((e) => ({ rec: e, usage: usageOf(e.name) }))
      .sort((a, b) => {
        if (uiState.libSort === 'name') return byName(a.rec.name, b.rec.name);
        if (uiState.libSort === 'recent') return String(b.usage.lastDate || '').localeCompare(String(a.usage.lastDate || '')) || byName(a.rec.name, b.rec.name);
        if (uiState.libSort === 'unused') return (a.usage.sessions - b.usage.sessions) || byName(a.rec.name, b.rec.name);
        return (b.usage.sessions - a.usage.sessions) || byName(a.rec.name, b.rec.name);

      (list.length ? list.map(({ rec, usage }) => uiState.libEditing === rec.id

              <label class="field grow"><span>Synoniemen (komma-gescheiden)</span>

        : `<div class="empty"><p>${uiState.libShowArchived ? 'Niets gearchiveerd.' : 'Geen oefeningen gevonden.'}</p></div>`) +

      (activeExercises().length < 20 && !uiState.libShowArchived
        ? `<hr class="divider"><div class="card">
            <div class="title">Standaardlijst</div>
            <p class="sub">Voeg circa 50 gangbare oefeningen toe, netjes ingedeeld op spiergroep en materiaal. Je kunt ze altijd archiveren.</p>
            <button id="lib-starter">Standaardlijst toevoegen</button>
          </div>` : '');

    bindNav();
    const qIn = document.getElementById('lib-q');
    qIn.addEventListener('input', () => {
      uiState.libQuery = qIn.value;
      const pos = qIn.selectionStart;
      render();
      const again = document.getElementById('lib-q');
      again.focus();
      again.setSelectionRange(pos, pos);
    });
    document.getElementById('lib-kind').addEventListener('change', (ev) => { uiState.libKind = ev.target.value; render(); });
    document.getElementById('lib-equip').addEventListener('change', (ev) => { uiState.libEquipment = ev.target.value; render(); });
    document.getElementById('lib-sort').addEventListener('change', (ev) => { uiState.libSort = ev.target.value; render(); });
    document.getElementById('lib-archived').addEventListener('click', () => { uiState.libShowArchived = !uiState.libShowArchived; render(); });
    document.getElementById('lib-add-toggle').addEventListener('click', () => {
      uiState.libEditing = uiState.libEditing === 'new' ? null : 'new';
      render();
    });
    document.getElementById('lib-new').addEventListener('submit', (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const name = String(f.get('name')).trim();
      if (!name) return;
      if (exerciseByName(name)) { alert('Deze oefening bestaat al.'); return; }
      const rec = ensureExercise(name, String(f.get('kind')));
      rec.group = String(f.get('group'));
      rec.equipment = String(f.get('equipment'));
      uiState.libEditing = null;
      save(); render();
    });
    document.querySelectorAll('[data-edit]').forEach((b) => b.addEventListener('click', () => {
      uiState.libEditing = b.dataset.edit; render();
    }));
    document.querySelectorAll('[data-cancel-edit]').forEach((b) => b.addEventListener('click', () => {
      uiState.libEditing = null; render();
    }));
    document.querySelectorAll('[data-archive]').forEach((b) => b.addEventListener('click', () => {
      const rec = exerciseById(b.dataset.archive);
      rec.archived = !rec.archived;
      uiState.libEditing = null;
      save(); render();
    }));
    bindPhotoPicker();
    document.querySelectorAll('[data-edit-form]').forEach((form) => form.addEventListener('submit', (ev) => {
      ev.preventDefault();
      const rec = exerciseById(form.dataset.editForm);
      const f = new FormData(form);
      const newName = String(f.get('name')).trim();
      if (newName && exKey(newName) !== exKey(rec.name)) {
        const res = renameExercise(rec.id, newName);
        if (!res.ok) { alert(res.reason); return; }
      }
      rec.kind = String(f.get('kind'));
      rec.group = String(f.get('group'));
      rec.equipment = String(f.get('equipment'));
      rec.restSeconds = num(f.get('rest')) > 0 ? num(f.get('rest')) : null;
      rec.instructions = String(f.get('instructions')).trim();
      rec.cues = String(f.get('cues')).trim();
      rec.videoUrl = safeUrl(f.get('videoUrl'));
      rec.imageUrl = safeUrl(f.get('imageUrl'));
      rec.aliases = String(f.get('aliases')).split(',').map((a) => a.trim()).filter(Boolean);
      db.muscleGroups[exKey(rec.name)] = rec.group;
      uiState.libEditing = null;
      save(); render();
    }));
    document.querySelectorAll('[data-merge]').forEach((b) => b.addEventListener('click', () => {
      const sourceId = b.dataset.merge;
      const targetId = document.querySelector(`[data-merge-target="${sourceId}"]`).value;
      if (!targetId) { alert('Kies eerst een oefening om in op te gaan.'); return; }
      const src = exerciseById(sourceId), dst = exerciseById(targetId);
      const n = usageOf(src.name).sessions;
      if (!confirm(`"${src.name}" samenvoegen met "${dst.name}"? ${n} sessie${n === 1 ? '' : 's'} worden overgezet. Dit kun je niet ongedaan maken.`)) return;
      const res = mergeExercises(sourceId, targetId);
      if (!res.ok) { alert(res.reason); return; }
      uiState.libEditing = null;
      render();
    }));
    const starter = document.getElementById('lib-starter');
    if (starter) starter.addEventListener('click', () => {
      const n = addStarterExercises();
      alert(`${n} oefeningen toegevoegd.`);
      render();
    });
  }

      c.name = name;
      c.phone = String(f.get('phone')).trim();
      c.email = String(f.get('email')).trim();
      c.goal = String(f.get('goal')).trim();
      save(); render();
    });
    document.getElementById('intake-form').addEventListener('submit', (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      c.injuries = String(f.get('injuries')).trim();
      c.medical = String(f.get('medical')).trim();
      c.intake = String(f.get('intake')).trim();
      save(); render();

      ev.preventDefault();
      const f = new FormData(ev.target);
      const text = String(f.get('text')).trim();
      if (!text) return;
      const exercise = String(f.get('exercise'));
      const target = num(f.get('target'));
      const sessions = exercise ? exerciseSessions(clientId, exercise) : [];
      c.goals.push({
        id: uid(), text, exercise: exercise || null, target: target > 0 ? target : null,
        start: sessions.length ? Math.max(...sessions.map((x) => x.top)) : 0,
        date: String(f.get('date')) || null, done: false,
      });
      save(); render();
    });

      save(); render();
    }));
    document.querySelectorAll('[data-goal-del]').forEach((b) => b.addEventListener('click', () => {

      c.goals = c.goals.filter((x) => x.id !== b.dataset.goalDel);
      save(); render();
    }));
    let pkgPaid = false;
    document.getElementById('pkg-paid-toggle').addEventListener('click', (ev) => {
      pkgPaid = !pkgPaid;
      ev.target.setAttribute('aria-pressed', String(pkgPaid));
    });
    document.getElementById('pkg-form').addEventListener('submit', (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const sessions = num(f.get('sessions'));
      if (sessions <= 0) return;
      db.packages.push({
        id: uid(), clientId, sessions, price: num(f.get('price')),
        date: String(f.get('date')), note: String(f.get('note')).trim(),
        paid: pkgPaid, paidAt: pkgPaid ? todayIso() : null,
      });
      save(); render();
    });
    document.querySelectorAll('[data-pkg-pay]').forEach((b) => b.addEventListener('click', () => {
      const p = db.packages.find((x) => x.id === b.dataset.pkgPay);
      p.paid = true; p.paidAt = todayIso();
      save(); render();
    }));
    document.querySelectorAll('[data-pkg-del]').forEach((b) => b.addEventListener('click', () => {
      if (!confirm('Deze strippenkaart verwijderen?')) return;
      db.packages = db.packages.filter((x) => x.id !== b.dataset.pkgDel);
      save(); render();
    }));
    const photoInput = document.getElementById('photo-input');
    document.getElementById('photo-btn').addEventListener('click', () => photoInput.click());
    photoInput.addEventListener('change', async () => {
      const file = photoInput.files[0];
      if (!file) return;
      try {
        const data = await readPhoto(file);
        c.photos.push({ id: uid(), date: todayIso(), data });
        save(); render();
      } catch (e) {
        alert('Foto toevoegen mislukt: ' + e.message);
      }
    });
    document.querySelectorAll('[data-photo-del]').forEach((b) => b.addEventListener('click', () => {
      if (!confirm('Deze foto verwijderen?')) return;
      c.photos = c.photos.filter((p) => p.id !== b.dataset.photoDel);
      save(); render();
    }));
    const shareStart = document.getElementById('share-start');
    if (shareStart) shareStart.addEventListener('click', async () => {
      shareStart.disabled = true;
      try { await shareClient(clientId); render(); }
      catch (e) { alert('Delen mislukt: ' + e.message); shareStart.disabled = false; }
    });
    const shareUpdate = document.getElementById('share-update');
    if (shareUpdate) shareUpdate.addEventListener('click', async () => {
      try { await shareClient(clientId); alert('Bijgewerkt.'); }
      catch (e) { alert('Bijwerken mislukt: ' + e.message); }
    });
    const shareCopy = document.getElementById('share-copy');
    if (shareCopy) shareCopy.addEventListener('click', async () => {
      const input = document.getElementById('share-link');
      input.select();
      try { await navigator.clipboard.writeText(input.value); shareCopy.textContent = 'Gekopieerd'; }
      catch { document.execCommand('copy'); }
    });
    const shareStop = document.getElementById('share-stop');
    if (shareStop) shareStop.addEventListener('click', async () => {
      if (!confirm('Stoppen met delen? De link werkt daarna niet meer.')) return;
      await stopSharing(clientId);
      render();
    });
    document.getElementById('archive-client').addEventListener('click', () => {
      c.archived = !c.archived;
      save(); render();
    });
    document.getElementById('delete-client').addEventListener('click', () => {
      if (!confirm(`${c.name} en alle bijbehorende schema's en trainingen verwijderen?`)) return;
      db.clients = db.clients.filter((x) => x.id !== clientId);
      db.schemas = db.schemas.filter((x) => x.clientId !== clientId);
      db.workouts = db.workouts.filter((w) => w.clientId !== clientId);
      db.duos = db.duos.filter((d) => !d.clientIds.includes(clientId));
      db.measurements = db.measurements.filter((m) => m.clientId !== clientId);
      save(); location.hash = '/';
    });
  }

  // --- nutrition diary, modelled on how the mainstream nutrition apps work ---
  function viewNutrition(clientId, date) {
    const c = clientById(clientId);
    if (!c) { location.hash = '/'; return; }
    const plan = planOf(clientId);
    const meals = mealsOn(clientId, date);
    const totals = dayTotals(clientId, date);
    const rem = remainingKcal(clientId, date);
    const week = nutritionAverages(clientId, 7);
    const suggestion = suggestPlan(clientId);
    const water = waterOn(clientId, date);
    const waterTarget = db.settings.waterTargetMl || 2000;
    const freq = frequentFoods(clientId);
    const ui = uiState.nutri;

    const macroLine = () => MACROS.filter((m) => m.key !== 'kcal').map((m) => {
      const value = totals[m.key];
      const target = plan ? plan[m.key] : 0;

        <div class="row" style="margin-bottom:6px">

            <div class="grow">
              <div class="sub">${esc(m.name)}${m.amount ? ` <span class="mut">${fmtNum(m.amount)}${m.per === 'portie' ? '×' : ' g'}</span>` : ''}</div>
              <div class="mut">${Math.round(m.kcal || 0)} kcal · E ${fmtNum(m.protein || 0)} · K ${fmtNum(m.carbs || 0)} · V ${fmtNum(m.fat || 0)}</div>

            <div class="mut">${Math.round(f.kcal)} kcal / 100 g · E ${fmtNum(f.protein)} · K ${fmtNum(f.carbs)} · V ${fmtNum(f.fat)}${f.source === 'lokaal' ? ' · eigen lijst' : ''}</div></div>

        </div>`).join('')}</div>
      <hr class="divider" style="margin:14px 0">
      <form id="quick-form">
        <div class="row">
          <input name="name" class="grow" placeholder="Snel toevoegen: omschrijving" required>
          <input name="kcal" type="text" inputmode="decimal" placeholder="kcal" style="width:90px" required>

        <div class="row" style="margin-top:8px">
          ${MACROS.filter((m) => m.key !== 'kcal').map((m) => `<input name="${m.key}" type="text" inputmode="decimal" placeholder="${m.label} (g)" class="grow">`).join('')}
          <button class="small primary" type="submit">Toevoegen</button>
        </div>
      </form>

    $app.innerHTML = topbar(`Voeding — ${c.name}`, `/klant/${clientId}`) +
      clientTabs(clientId, 'voeding') +
      `<div class="row" style="margin-bottom:10px">
        <button class="small" data-nutri-day="${addDays(date, -1)}">‹</button>
        <input type="date" id="nutri-date" class="grow" value="${esc(date)}">
        <button class="small" data-nutri-day="${addDays(date, 1)}">›</button>
        <button class="small" data-nutri-day="${todayIso()}">Vandaag</button>
      </div>` +

      (rem ? `<div class="card">
        <div class="stat-grid cols2" style="gap:6px">
          <div class="stat"><div class="lbl">Doel</div><div class="val">${rem.target}</div></div>
          <div class="stat"><div class="lbl">Gegeten</div><div class="val">${rem.eaten}</div></div>
          <div class="stat"><div class="lbl">Beweging</div><div class="val">+${rem.burned}</div></div>
          <div class="stat"><div class="lbl">Resterend</div><div class="val" style="color:${rem.remaining < 0 ? 'var(--danger)' : 'var(--good)'}">${rem.remaining}</div></div>
        </div>
        <div style="margin-top:10px">${macroLine()}</div>
      </div>`
      : `<div class="card">
          <div class="title">${Math.round(totals.kcal)} kcal gegeten</div>
          <div style="margin-top:8px">${macroLine()}</div>
          <p class="mut" style="margin:8px 0 0">Stel onderaan een dagdoel in om "resterend" te zien.</p>
        </div>`) +

        <button class="small" id="copy-yesterday">Kopieer gisteren</button>
        <button class="small" data-add-to="Snack">Snel toevoegen</button>
      </div>` +
      searchPanel +

        <div class="chips" style="margin-bottom:12px">${freq.map((f, i) => `<button class="chip" data-freq="${i}">${esc(f.name)}</button>`).join('')}</div>` : '') +

      `<div class="eyebrow">Dagboek — ${esc(fmtDateFull(date))}</div>` +
      MOMENTS.map(mealGroup).join('') +

      `<div class="eyebrow">Water</div>
      <div class="card">
        <div class="bar-row" style="margin-bottom:8px">
          <span>Vandaag</span>
          <span class="track"><span class="fill" style="width:${Math.min(100, Math.round((water / waterTarget) * 100))}%"></span></span>
          <span class="val">${(water / 1000).toLocaleString('nl-NL')} / ${(waterTarget / 1000).toLocaleString('nl-NL')} l</span>
        </div>
        <div class="actions">
          <button class="small" data-water="250">+250 ml</button>
          <button class="small" data-water="500">+500 ml</button>

            <span class="track"><span class="fill" style="width:${pct}%"></span></span>

      `<div class="eyebrow">Voedingsplan</div>
      <form class="card" id="plan-form">
        <div class="row">
          ${MACROS.map((m) => `<label class="field grow"><span>${m.label} (${m.unit})</span>
