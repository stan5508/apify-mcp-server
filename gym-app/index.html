<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coachlog">
<title>Coachlog — schema's & progressie</title>
</head>
<body>
<!-- APP START -->
<style>
  :root {
    --page: #f2f2f0;
    --surface: #ffffff;
    --raised: #ececeb;
    --ink: #16181a;
    --ink-2: #4d545c;
    --muted: #666d76;
    --grid: #e0e0dd;
    --baseline: #c2c2be;
    --border: rgba(22, 24, 26, 0.12);
    --accent: #e39418;
    --accent-strong: #8a5200;
    --on-accent: #17130a;
    --wash: rgba(227, 148, 24, 0.16);
    --good: #0f7b4f;
    --danger: #c0392b;
    --shadow: 0 1px 2px rgba(22, 24, 26, 0.07);
    --data: #c8102e;
    --data-wash: rgba(200, 16, 46, 0.12);
    --series-1: #c8102e;
    --series-2: #0057b8;
    --series-3: #a87c00;
    --series-4: #007a2f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #0b0d0f;
      --surface: #15181c;
      --raised: #22272f;
      --ink: #f5f7f8;
      --ink-2: #96a0ac;
      --muted: #8a939f;
      --grid: #262b33;
      --baseline: #39414c;
      --border: rgba(255, 255, 255, 0.11);
      --accent: #f2a93b;
      --accent-strong: #ffc163;
      --on-accent: #0b0d0f;
      --wash: rgba(242, 169, 59, 0.14);
      --good: #3f9e6c;
      --danger: #e5645c;
      --shadow: none;
      --data: #e8384f;
      --data-wash: rgba(232, 56, 79, 0.16);
      --series-1: #e8384f;
      --series-2: #3d8bff;
      --series-3: #f2c200;
      --series-4: #2fbf62;
    }
  }
  :root[data-theme="light"] {
    --page: #f2f2f0;
    --surface: #ffffff;
    --raised: #ececeb;
    --ink: #16181a;
    --ink-2: #4d545c;
    --muted: #666d76;
    --grid: #e0e0dd;
    --baseline: #c2c2be;
    --border: rgba(22, 24, 26, 0.12);
    --accent: #e39418;
    --accent-strong: #8a5200;
    --on-accent: #17130a;
    --wash: rgba(227, 148, 24, 0.16);
    --good: #0f7b4f;
    --danger: #c0392b;
    --shadow: 0 1px 2px rgba(22, 24, 26, 0.07);
    --data: #c8102e;
    --data-wash: rgba(200, 16, 46, 0.12);
    --series-1: #c8102e;
    --series-2: #0057b8;
    --series-3: #a87c00;
    --series-4: #007a2f;
  }
  :root[data-theme="dark"] {
    --page: #0b0d0f;
    --surface: #15181c;
    --raised: #22272f;
    --ink: #f5f7f8;
    --ink-2: #96a0ac;
    --muted: #8a939f;
    --grid: #262b33;
    --baseline: #39414c;
    --border: rgba(255, 255, 255, 0.11);
    --accent: #f2a93b;
    --accent-strong: #ffc163;
    --on-accent: #0b0d0f;
    --wash: rgba(242, 169, 59, 0.14);
    --good: #3f9e6c;
    --danger: #e5645c;
    --shadow: none;
    --data: #e8384f;
    --data-wash: rgba(232, 56, 79, 0.16);
    --series-1: #e8384f;
    --series-2: #3d8bff;
    --series-3: #f2c200;
    --series-4: #2fbf62;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .layout {
    max-width: 980px; margin: 0 auto; padding: 0 16px;
    display: grid; grid-template-columns: 230px minmax(0, 1fr);
    gap: 28px; align-items: start;
  }
  #side { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; padding-bottom: 24px; }
  #app { max-width: 640px; padding-bottom: 96px; min-width: 0; }
  @media (max-width: 759px) {
    .layout { display: block; }
    #side { position: static; max-height: none; border-bottom: 1px solid var(--grid); padding-bottom: 4px; margin-bottom: 4px; }
  }

  .nav-search { width: 100%; margin: 0 0 10px; padding: 7px 10px; font-size: 14px; }
  .brand-row { padding: 14px 0 10px; border-bottom: 1px solid var(--grid); margin-bottom: 10px; }
  .nav-search { width: 100%; margin: 0 0 10px; padding: 7px 10px; font-size: 14px; }
  .brand-row a { text-decoration: none; }
  .navgrp { margin-bottom: 6px; }
  .navgrp summary {
    cursor: pointer; list-style: none; user-select: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 8px; border-radius: 8px;
    font-size: 12px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted);
  }
  .navgrp summary::-webkit-details-marker { display: none; }
  .navgrp summary:hover { background: var(--wash); }
  .navgrp summary .count { font-weight: 600; font-variant-numeric: tabular-nums; }
  .navgrp summary .chev { transition: transform 120ms ease; }
  .navgrp[open] summary .chev { transform: rotate(180deg); }
  .navlink {
    display: block; padding: 8px 10px; border-radius: 8px;
    color: var(--ink); text-decoration: none; font-size: 15px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .navlink:hover { background: var(--wash); }
  .navlink.active { background: var(--wash); color: var(--accent-strong); font-weight: 600; }
  .navlink.add { color: var(--accent-strong); font-size: 14px; }

  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 0 10px;
    position: sticky; top: 0; z-index: 5;
    background: var(--page);
    border-bottom: 1px solid var(--grid);
    margin-bottom: 16px;
  }
  .topbar h1 { font-size: 18px; font-weight: 650; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brand { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }

  .eyebrow {
    font-size: 12px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); margin: 24px 0 8px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 14px;
    margin-bottom: 10px;
  }
  .card.tappable { cursor: pointer; }
  .card.tappable:hover { border-color: var(--accent); }

  .row { display: flex; align-items: center; gap: 10px; }
  .row .grow { flex: 1; min-width: 0; }
  .title { font-weight: 650; }
  .sub { color: var(--ink-2); font-size: 14px; }
  .mut { color: var(--muted); font-size: 13px; }

  button {
    font: inherit; cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface); color: var(--ink);
    border-radius: 8px; padding: 9px 14px;
  }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  button.ghost { background: transparent; }
  button.danger { color: var(--danger); }
  button.small { padding: 5px 10px; font-size: 14px; border-radius: 7px; }
  button.wide { width: 100%; padding: 12px; font-size: 16px; }
  button.back { padding: 6px 10px; font-size: 15px; }

  input, select, textarea {
    font: inherit; color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--baseline);
    border-radius: 8px; padding: 9px 10px;
    width: 100%;
  }
  input[type="number"] { font-variant-numeric: tabular-nums; }
  label.field { display: block; margin-bottom: 10px; }
  label.field span { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }

  .seg { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 3px; }
  .seg button { flex: 1; border: none; background: transparent; padding: 7px 4px; font-size: 13px; border-radius: 6px; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--wash); color: var(--accent-strong); font-weight: 650; }

  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .stat .lbl { font-size: 12px; color: var(--muted); }
  .stat .val { font-size: 20px; font-weight: 650; margin-top: 2px; }
  .stat .delta { font-size: 13px; margin-top: 2px; }
  .delta.up { color: var(--good); }
  .delta.down { color: var(--danger); }

  .chart-wrap { position: relative; }
  .chart-wrap svg { display: block; width: 100%; height: auto; }
  .tooltip {
    position: absolute; pointer-events: none; display: none;
    background: var(--ink); color: var(--page);
    font-size: 13px; line-height: 1.35;
    padding: 6px 9px; border-radius: 7px;
    transform: translate(-50%, -110%);
    white-space: nowrap; z-index: 3;
  }
  .tooltip .tv { font-weight: 650; font-variant-numeric: tabular-nums; }

  .set-row { display: grid; grid-template-columns: 30px 1fr 1fr 58px 34px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .set-row.cardio { grid-template-columns: 30px 1fr 1fr 34px; }
  .set-row .n { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .set-row .n b { color: var(--accent-strong); font-weight: 700; }
  .set-more { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; margin: -2px 0 10px 30px; padding: 10px; border: 1px solid var(--grid); border-radius: 8px; }
  .set-more .lbl { font-size: 12px; color: var(--muted); }
  .pillbar { display: flex; flex-wrap: wrap; gap: 6px; }
  .pillbar button { padding: 5px 10px; font-size: 13px; border-radius: 99px; }
  .pillbar button[aria-pressed="true"] { background: var(--wash); border-color: var(--accent); color: var(--accent-strong); font-weight: 600; }

  #timer-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: var(--ink); color: var(--page);
    box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.18);
  }
  #timer-bar[hidden] { display: none; }
  #lock-screen { position: fixed; inset: 0; z-index: 50; background: var(--page); display: flex; align-items: center; justify-content: center; padding: 24px; }
  #lock-screen[hidden] { display: none; }
  .lock-box { width: 100%; max-width: 280px; text-align: center; }
  .lock-box .brand { font-size: 15px; margin-bottom: 12px; }
  .lock-box input { text-align: center; font-size: 22px; letter-spacing: 0.3em; margin-bottom: 10px; }
  body.timer-on #app { padding-bottom: 160px; }
  #timer-bar .t-label { flex: 1; min-width: 0; font-size: 14px; }
  #timer-bar .t-time { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  #timer-bar button { background: transparent; border-color: rgba(255, 255, 255, 0.35); color: var(--page); padding: 6px 10px; font-size: 14px; }
  #timer-bar button:hover { background: rgba(255, 255, 255, 0.12); }

  .tool-panel { border: 1px solid var(--accent); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: var(--surface); }
  .tool-panel .row + .row { margin-top: 8px; }
  .tool-out { font-weight: 650; margin-top: 8px; }
  .ss-mark { border-left: 3px solid var(--accent); padding-left: 9px; }
  .note-box { background: var(--wash); border-radius: 8px; padding: 8px 10px; font-size: 14px; color: var(--ink-2); margin-bottom: 8px; }
  .note-box strong { color: var(--accent-strong); }
  .info-panel { border: 1px solid var(--grid); border-radius: 8px; padding: 10px; margin-bottom: 10px; }

  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
  .legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }

  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-width: 320px; }
  .cal div { aspect-ratio: 1; border-radius: 4px; background: var(--grid); }
  .cal div.on { background: var(--accent); }
  .cal div.head { background: transparent; font-size: 11px; color: var(--muted); text-align: center; aspect-ratio: auto; }

  table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.data th, table.data td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--grid); }
  table.data th { font-size: 12px; color: var(--muted); font-weight: 600; }
  table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .table-wrap { overflow-x: auto; }

  .bar-row { display: grid; grid-template-columns: 110px 1fr 78px; gap: 10px; align-items: center; margin-bottom: 8px; font-size: 14px; }
  .bar-row .track { display: block; background: var(--grid); border-radius: 4px; height: 14px; overflow: hidden; }
  .bar-row .fill { display: block; background: var(--data); height: 100%; border-radius: 4px; min-width: 2px; }
  .ex-thumb { object-fit: cover; border-radius: 8px; background: var(--raised); flex: none; }
  .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .shots img { width: 100%; border-radius: 8px; display: block; background: var(--raised); }
  .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; margin-top: 10px; }
  .photo-pick { padding: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); text-align: left; }
  .photo-pick img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block; background: var(--raised); }
  .photo-pick span { display: block; padding: 6px 8px; font-size: 12px; line-height: 1.3; color: var(--ink-2); }
  .plate { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    border: 1px solid rgba(11, 13, 15, 0.22); font-variant-numeric: tabular-nums; }
  .bar-row .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }

  @media print {
    #side, #timer-bar, .topbar button, button, .no-print { display: none !important; }
    .layout { display: block; }
    #app { max-width: none; padding: 0; }
    .card { break-inside: avoid; box-shadow: none; }
    body { background: #fff; }
  }
  .prev-hint { margin: -4px 0 8px 32px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pr-live {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 650; color: var(--good);
    border: 1px solid var(--good); background: rgba(12, 163, 12, 0.10);
    border-radius: 99px; padding: 3px 12px; margin-bottom: 10px;
  }
  .pr-live[hidden] { display: none; }
  @media (prefers-reduced-motion: no-preference) {
    .pr-live { animation: pr-pop 300ms cubic-bezier(0.2, 1.4, 0.4, 1); }
    @keyframes pr-pop { from { transform: scale(0.7); opacity: 0; } }
  }
  .tgt-row { display: grid; grid-template-columns: 24px 1fr 1fr 34px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .tgt-row .n { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .col-head { font-size: 12px; color: var(--muted); }

  .empty { text-align: center; color: var(--ink-2); padding: 28px 12px; }
  .empty p { margin: 0 0 14px; }

  .divider { border: none; border-top: 1px solid var(--grid); margin: 24px 0; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { display: inline-block; font-size: 12px; color: var(--accent-strong); background: var(--wash); border-radius: 99px; padding: 2px 9px; font-weight: 600; }
  .badge.pr { color: var(--good); background: rgba(12, 163, 12, 0.10); border: 1px solid var(--good); }

  #app.wide { max-width: none; }
  .duo-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 0 20px; align-items: start; }
  /* on narrower screens (e.g. tablet portrait) hide the sidebar during duo screens so both columns fit */
  @media (max-width: 999px) {
    body.wide-page .layout { display: block; }
    body.wide-page #side { display: none; }
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border-radius: 99px; padding: 8px 14px; font-size: 14px; }
  .chip[aria-pressed="true"] { background: var(--wash); border-color: var(--accent); color: var(--accent-strong); font-weight: 600; }
  .cols2 { grid-template-columns: repeat(2, 1fr); }

  @media (prefers-reduced-motion: no-preference) {
    .card.tappable { transition: border-color 120ms ease; }
  }
</style>

<div class="layout">
  <aside id="side"></aside>
  <main id="app"></main>
</div>
<div id="lock-screen" hidden></div>
<div id="timer-bar" hidden>
  <span class="t-label"></span>
  <span class="t-time"></span>
  <button type="button" class="t-plus" aria-label="30 seconden erbij">+30s</button>
  <button type="button" class="t-pause" aria-label="Pauzeer timer">⏸</button>
  <button type="button" class="t-stop" aria-label="Stop timer">✕</button>
</div>

<script>
(() => {
  'use strict';
  const APP_VERSION = 28; // bump when publishing; shown on the home screen
  const KEY = 'coachlog-v1';
  const $app = document.getElementById('app');

  // ---------- data ----------
  const emptyDb = () => ({
    clients: [], schemas: [], workouts: [], duos: [], duoSchemas: [], templates: [], measurements: [],
    exercises: [], clientNotes: {}, appointments: [], packages: [],
    nutritionPlans: {}, meals: [], foods: [], water: {}, muscleGroups: {}, settings: { unit: 'kg', restSeconds: 90, autoRest: true, sound: true, barWeight: 20 }, updatedAt: 0,
  });
  let db = loadDb();
  function loadDb() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return normalizeDb(emptyDb());
      return normalizeDb(JSON.parse(raw));
    } catch { return normalizeDb(emptyDb()); }
  }
  function normalizeDb(d) {
    const out = {
      clients: d.clients || [], schemas: d.schemas || [], workouts: d.workouts || [], duos: d.duos || [],
      duoSchemas: d.duoSchemas || [], templates: d.templates || [], measurements: d.measurements || [],
      exercises: d.exercises || [], clientNotes: d.clientNotes || {},
      appointments: d.appointments || [], packages: d.packages || [],
      nutritionPlans: d.nutritionPlans || {}, meals: d.meals || [], foods: d.foods || [], water: d.water || {},
      muscleGroups: d.muscleGroups || {},
      settings: { unit: 'kg', restSeconds: 90, autoRest: true, sound: true, barWeight: 20, noShowCounts: true, currency: '€', theme: 'dark', pin: null, lockMinutes: 15, coachName: '', lastBackupAt: null,
        countTrainingBurn: true, kcalPerMin: 6, waterTargetMl: 2000, ...(d.settings || {}) },
      updatedAt: d.updatedAt || 0,
    };
    for (const c of out.clients) {
      c.phone = c.phone || '';
      c.email = c.email || '';
      c.injuries = c.injuries || '';
      c.medical = c.medical || '';
      c.intake = c.intake || '';
      c.goals = c.goals || [];
      c.photos = c.photos || [];
      c.archived = !!c.archived;
    }
    // dark is the standard now; switch existing installs over once
    if (out.settings.theme === 'system' && !out.settings.themePicked) {
      out.settings.theme = 'dark';
      out.settings.themePicked = true;
      out._needsSave = true;
    }
    // build the exercise registry from whatever names already exist
    const before = out.exercises.length;
    migrateExercises(out);
    if (out.exercises.length !== before) out._needsSave = true;
    // migrate uniform sets/reps/weight to per-set targets
    for (const s of out.schemas) {
      for (const e of s.exercises || []) {
        if (!e.targets || !e.targets.length) {
          e.targets = Array.from({ length: e.sets || 3 }, () => ({ reps: e.reps || 10, weight: e.weight || 0 }));
        }
      }
    }
    return out;
  }
  function save() {
    db.updatedAt = Date.now();
    localStorage.setItem(KEY, JSON.stringify(db));
    scheduleSync();
  }

  // ---------- cloud accounts (Supabase REST, no SDK) ----------
  const cloud = (() => {
    const CFG_KEY = 'coachlog-cloud';
    const SESSION_KEY = 'coachlog-session';
    let cfg = null;
    let session = null;
    // Project Settings shows the REST endpoint too; accept either form
    const baseUrl = (url) => String(url).trim().replace(/\/+$/, '').replace(/\/(rest|auth)\/v1$/, '');
    try { cfg = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch { cfg = null; }
    if (cfg && cfg.url) cfg.url = baseUrl(cfg.url);
    try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch { session = null; }

    const configured = () => !!(cfg && cfg.url && cfg.key);
    const signedIn = () => !!(session && session.access_token);
    const setConfig = (url, key) => {
      cfg = { url: baseUrl(url), key: String(key).trim() };
      localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
    };
    const clearConfig = () => { cfg = null; localStorage.removeItem(CFG_KEY); };
    const setSession = (s) => {
      session = s;
      if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
      else localStorage.removeItem(SESSION_KEY);
    };

    async function call(path, opts = {}, auth = true) {
      if (!configured()) throw new Error('cloud niet ingesteld');
      const headers = { apikey: cfg.key, 'Content-Type': 'application/json', ...(opts.headers || {}) };
      if (auth && session) headers.Authorization = 'Bearer ' + session.access_token;
      const res = await fetch(cfg.url + path, { ...opts, headers, signal: AbortSignal.timeout(15000) });
      if (res.status === 401 && auth && session && session.refresh_token) {
        await refresh();
        return call(path, opts, auth);
      }
      const text = await res.text();
      const body = text ? JSON.parse(text) : null;
      if (!res.ok) throw new Error((body && (body.msg || body.message || body.error_description)) || `fout ${res.status}`);
      return body;
    }

    async function refresh() {
      const body = await call('/auth/v1/token?grant_type=refresh_token', {
        method: 'POST', body: JSON.stringify({ refresh_token: session.refresh_token }),
      }, false);
      setSession(body);
    }

    // magic link: no passwords for clients to forget
    async function sendLink(email, redirectTo) {
      await call(`/auth/v1/otp?redirect_to=${encodeURIComponent(redirectTo)}`, {
        method: 'POST', body: JSON.stringify({ email, create_user: true }),
      }, false);
    }
    function captureSessionFromUrl() {
      const hash = location.hash.startsWith('#') ? location.hash.slice(1) : '';
      if (!hash.includes('access_token=')) return false;
      const params = new URLSearchParams(hash);
      setSession({
        access_token: params.get('access_token'),
        refresh_token: params.get('refresh_token'),
        expires_at: Date.now() + Number(params.get('expires_in') || 3600) * 1000,
      });
      history.replaceState(null, '', location.pathname + location.search);
      return true;
    }
    const signOut = () => setSession(null);
    const userId = () => {
      if (!signedIn()) return null;
      try { return JSON.parse(atob(session.access_token.split('.')[1])).sub; } catch { return null; }
    };
    const userEmail = () => {
      if (!signedIn()) return null;
      try { return JSON.parse(atob(session.access_token.split('.')[1])).email; } catch { return null; }
    };

    const select = (table, query) => call(`/rest/v1/${table}?${query}`, { method: 'GET' });
    const insert = (table, rows) => call(`/rest/v1/${table}`, {
      method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify(rows),
    });
    const upsert = (table, rows, onConflict) => call(`/rest/v1/${table}?on_conflict=${onConflict}`, {
      method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=representation' }, body: JSON.stringify(rows),
    });
    const remove = (table, query) => call(`/rest/v1/${table}?${query}`, { method: 'DELETE' });
    const rpc = (fn, args) => call(`/rest/v1/rpc/${fn}`, { method: 'POST', body: JSON.stringify(args || {}) });

    // make sure this account has a profile row
    async function ensureProfile(role, name) {
      const id = userId();
      if (!id) throw new Error('niet ingelogd');
      const rows = await select('profiles', `id=eq.${id}&select=*`);
      if (rows.length) {
        if (name && rows[0].name !== name) {
          await call(`/rest/v1/profiles?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ name }) });
          rows[0].name = name;
        }
        return rows[0];
      }
      const created = await insert('profiles', [{ id, role, name: name || (userEmail() || '').split('@')[0] }]);
      return created[0];
    }

    return {
      configured, signedIn, setConfig, clearConfig, config: () => cfg,
      sendLink, captureSessionFromUrl, signOut, userId, userEmail,
      select, insert, upsert, remove, rpc, ensureProfile,
    };
  })();

  // ---------- exercise registry ----------
  const EQUIPMENT = ['Onbekend', 'Barbell', 'Dumbbell', 'Machine', 'Kabel', 'Lichaamsgewicht', 'Kettlebell', 'Band', 'Cardio-apparaat'];

  function migrateExercises(d) {
    const byKey = new Map(d.exercises.map((e) => [e.name.trim().toLowerCase(), e]));
    const seen = (name, kind) => {
      const key = String(name || '').trim().toLowerCase();
      if (!key) return;
      let rec = byKey.get(key);
      if (!rec) {
        rec = {
          id: uid(), name: String(name).trim(), kind: kind || 'kracht',
          group: d.muscleGroups[key] || (kind === 'cardio' ? 'Cardio' : 'Overig'),
          equipment: 'Onbekend', restSeconds: null, notes: '', aliases: [], archived: false,
        };
        byKey.set(key, rec);
        d.exercises.push(rec);
      }
      if (kind && kind !== 'kracht') rec.kind = kind;
      if (d.muscleGroups[key]) rec.group = d.muscleGroups[key];
    };
    for (const w of d.workouts) for (const e of w.entries) seen(e.name, e.kind);
    for (const sc of d.schemas) for (const e of sc.exercises || []) seen(e.name, e.kind);
    for (const t of d.templates) for (const e of t.exercises || []) seen(e.name, e.kind);
    for (const ds of d.duoSchemas) for (const plan of Object.values(ds.plans || {})) for (const e of plan) seen(e.name, e.kind);
    for (const e of d.exercises) {
      e.aliases = e.aliases || [];
      e.equipment = e.equipment || 'Onbekend';
      e.group = e.group || 'Overig';
      e.kind = e.kind || 'kracht';
      // older records kept one free-text field; it becomes the execution description
      if (e.notes !== undefined) {
        if (e.notes && !e.instructions) e.instructions = e.notes;
        delete e.notes;
        d._needsSave = true;
      }
      e.instructions = e.instructions || '';
      e.cues = e.cues || '';
      e.videoUrl = e.videoUrl || '';
      e.imageUrl = e.imageUrl || '';
    }
  }

  const exKey = (name) => String(name || '').trim().toLowerCase();
  const exerciseById = (id) => db.exercises.find((e) => e.id === id);
  function exerciseByName(name) {
    const key = exKey(name);
    return db.exercises.find((e) => exKey(e.name) === key || (e.aliases || []).some((a) => exKey(a) === key)) || null;
  }
  function ensureExercise(name, kind) {
    const found = exerciseByName(name);
    if (found) return found;
    const rec = {
      id: uid(), name: String(name).trim(), kind: kind || 'kracht',
      group: kind === 'cardio' ? 'Cardio' : 'Overig', equipment: 'Onbekend',
      restSeconds: null, instructions: '', cues: '', videoUrl: '', imageUrl: '', aliases: [], archived: false,
    };
    db.exercises.push(rec);
    return rec;
  }
  const activeExercises = () => db.exercises.filter((e) => !e.archived);
  // usage of every exercise in a single pass over the workouts
  function usageMap() {
    const map = new Map();
    const get = (key) => {
      let u = map.get(key);
      if (!u) { u = { sessions: 0, sets: 0, volume: 0, clients: new Set(), firstDate: null, lastDate: null, best: 0 }; map.set(key, u); }
      return u;
    };
    for (const w of db.workouts) {
      for (const e of w.entries) {
        const u = get(exKey(e.name));
        u.sessions++;
        u.sets += e.sets.length;
        u.clients.add(w.clientId);
        if (!u.firstDate || w.date < u.firstDate) u.firstDate = w.date;
        if (!u.lastDate || w.date > u.lastDate) u.lastDate = w.date;
        const m = exerciseMetrics(e);
        if (m) {
          u.volume += m.kind === 'kracht' ? m.volume : 0;
          u.best = Math.max(u.best, m.top || 0);
        }
      }
    }
    return map;
  }
  const emptyUsage = () => ({ sessions: 0, sets: 0, volume: 0, clients: new Set(), firstDate: null, lastDate: null, best: 0 });
  function exerciseUsage(name) {
    return usageMap().get(exKey(name)) || emptyUsage();
  }

  // rewrite every reference to an exercise name (history, schemas, templates)
  function rewriteExerciseName(oldName, newName, newId) {
    const from = exKey(oldName);
    for (const w of db.workouts) {
      for (const e of w.entries) {
        if (exKey(e.name) !== from && (!newId || e.exerciseId !== newId)) continue;
        if (exKey(e.name) === from) { e.name = newName; if (newId) e.exerciseId = newId; }
      }
    }
    for (const sc of db.schemas) for (const e of sc.exercises || []) if (exKey(e.name) === from) e.name = newName;
    for (const t of db.templates) for (const e of t.exercises || []) if (exKey(e.name) === from) e.name = newName;
    for (const ds of db.duoSchemas) {
      for (const plan of Object.values(ds.plans || {})) for (const e of plan) if (exKey(e.name) === from) e.name = newName;
    }
    if (db.muscleGroups[from]) {
      db.muscleGroups[exKey(newName)] = db.muscleGroups[from];
      if (exKey(newName) !== from) delete db.muscleGroups[from];
    }
  }

  function renameExercise(id, newName) {
    const rec = exerciseById(id);
    const name = String(newName).trim();
    if (!rec || !name) return { ok: false, reason: 'Geef een naam op.' };
    const clash = db.exercises.find((e) => e.id !== id && (exKey(e.name) === exKey(name) || (e.aliases || []).some((a) => exKey(a) === exKey(name))));
    if (clash) return { ok: false, reason: `"${clash.name}" bestaat al. Gebruik samenvoegen.` };
    const old = rec.name;
    rec.name = name;
    rewriteExerciseName(old, name, rec.id);
    save();
    return { ok: true };
  }

  // fold one exercise into another: history, schemas and templates follow
  function mergeExercises(sourceId, targetId) {
    const src = exerciseById(sourceId);
    const dst = exerciseById(targetId);
    if (!src || !dst || src.id === dst.id) return { ok: false, reason: 'Kies twee verschillende oefeningen.' };
    rewriteExerciseName(src.name, dst.name, dst.id);
    // a workout may now hold the same exercise twice: fold those entries together
    for (const w of db.workouts) {
      const seen = new Map();
      const merged = [];
      for (const e of w.entries) {
        const key = exKey(e.name);
        const first = seen.get(key);
        if (first) { first.sets = first.sets.concat(e.sets); continue; }
        seen.set(key, e);
        merged.push(e);
      }
      w.entries = merged;
    }
    dst.aliases = [...new Set([...(dst.aliases || []), ...(src.aliases || []), src.name])]
      .filter((a) => exKey(a) !== exKey(dst.name));
    db.exercises = db.exercises.filter((e) => e.id !== src.id);
    delete db.muscleGroups[exKey(src.name)];
    save();
    return { ok: true };
  }
  // library names for pickers: most used first, then alphabetical
  function libraryNames(extraFilter) {
    return activeExercises()
      .filter((e) => !extraFilter || extraFilter(e))
      .map((e) => ({ name: e.name, uses: exerciseUsage(e.name).sessions }))
      .sort((a, b) => (b.uses - a.uses) || byName(a.name, b.name))
      .map((e) => e.name);
  }
  const hasInfo = (rec) => !!(rec && (rec.instructions || rec.cues || rec.videoUrl || rec.imageUrl || rec.photoId));
  const clientNote = (clientId, name) => ((db.clientNotes[clientId] || {})[exKey(name)] || '');
  function setClientNote(clientId, name, text) {
    const notes = db.clientNotes[clientId] || (db.clientNotes[clientId] = {});
    if (text.trim()) notes[exKey(name)] = text.trim();
    else delete notes[exKey(name)];
    save();
  }
  const safeUrl = (u) => /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '';

  // read-only info block: library instructions plus this client's technique note
  function exerciseInfoHtml(name, clientId) {
    const rec = exerciseByName(name);
    const note = clientId ? clientNote(clientId, name) : '';
    if (!hasInfo(rec) && !note) return '<p class="mut">Nog geen uitleg. Vul die in via de bibliotheek.</p>';
    const shots = rec && rec.photoId ? (rec.photos || ['0.jpg']).map((_, n) => photoPath(rec, n)) : [];
    const img = safeUrl(rec && rec.imageUrl);
    const vid = safeUrl(rec && rec.videoUrl);
    return (note ? `<div class="note-box"><strong>Voor deze klant:</strong> ${esc(note)}</div>` : '') +
      (rec && rec.instructions ? `<p class="sub" style="white-space:pre-wrap;margin:0 0 8px">${esc(rec.instructions)}</p>` : '') +
      (rec && rec.cues ? `<div class="note-box"><strong>Aandachtspunten:</strong> ${esc(rec.cues)}</div>` : '') +
      (shots.length ? `<div class="shots">${shots.map((path) => photoImg(path)).join('')}</div>` : '') +
      (img ? `<img src="${esc(img)}" alt="" loading="lazy" style="max-width:100%;border-radius:8px;margin-top:8px">` : '') +
      (vid ? `<p style="margin:8px 0 0"><a href="${esc(vid)}" target="_blank" rel="noopener">Video bekijken ↗</a></p>` : '');
  }


  // ---------- exercise photos (Free Exercise DB, public domain) ----------
  // jsDelivr is the CDN for the same repo; raw.githubusercontent is the fallback
  const PHOTO_BASE = 'https://cdn.jsdelivr.net/gh/yuhonas/free-exercise-db@main/exercises/';
  const PHOTO_BASE_ALT = 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/';
  const photoPath = (rec, n = 0) => rec && rec.photoId ? `${rec.photoId}/${(rec.photos || ['0.jpg'])[n] || ''}` : '';
  const photoUrl = (rec, n = 0) => photoPath(rec, n) ? PHOTO_BASE + photoPath(rec, n) : '';
  const photoImg = (path, attrs = '') =>
    `<img src="${esc(PHOTO_BASE + path)}" data-fallback="${esc(PHOTO_BASE_ALT + path)}" alt="" loading="lazy" ${attrs}>`;
  const photoThumb = (rec, size = 44) => {
    const path = photoPath(rec);
    if (path) return photoImg(path, `class="ex-thumb" style="width:${size}px;height:${size}px"`);
    const url = safeUrl(rec && rec.imageUrl);
    return url ? `<img class="ex-thumb" src="${esc(url)}" alt="" loading="lazy" style="width:${size}px;height:${size}px">` : '';
  };
  // one listener beats an inline onerror on every tag
  document.addEventListener('error', (ev) => {
    const t = ev.target;
    if (t instanceof HTMLImageElement && t.dataset.fallback && t.src !== t.dataset.fallback) t.src = t.dataset.fallback;
  }, true);

  // the catalogue is english; map the dutch words a coach actually types
  const PHOTO_TERMS = {
    bankdrukken: 'bench press', schuinbankdrukken: 'incline bench press', roeien: 'row', roeimachine: 'rowing',
    kuitheffen: 'calf raise', schouderdrukken: 'shoulder press', zijwaartseheffing: 'lateral raise',
    optrekken: 'pull up', opdrukken: 'push up', hurkzit: 'squat', beenpers: 'leg press', beenstrekken: 'leg extension',
    beencurl: 'leg curl', buikspieren: 'crunch', planken: 'plank', hardlopen: 'running', fietsen: 'cycling',
    heupbrug: 'hip thrust', dips: 'dips', kniebuiging: 'squat', borst: 'chest', rug: 'back', benen: 'leg',
    schouders: 'shoulder', armen: 'arm', triceps: 'triceps', biceps: 'biceps', buik: 'abs', billen: 'glute',
  };
  const photoTokens = (text) => String(text || '').toLowerCase()
    .replace(/[^a-z0-9\s]/g, ' ')
    .split(/\s+/).filter(Boolean)
    .flatMap((w) => (PHOTO_TERMS[w] || w).split(' '));

  let photoCatalog = null;
  async function loadPhotoCatalog() {
    if (!photoCatalog) photoCatalog = await (await fetch('./oefeningen.json')).json();
    return photoCatalog;
  }
  // rank on how many of the typed words appear, then prefer the plainest name
  function searchPhotos(query, limit = 24) {
    if (!photoCatalog) return [];
    const words = photoTokens(query);
    if (!words.length) return photoCatalog.slice(0, limit);
    return photoCatalog
      .map((c) => {
        const name = c.n.toLowerCase();
        let score = 0;
        for (const w of words) if (name.includes(w)) score += w.length > 3 ? 3 : 1;
        if (name === words.join(' ')) score += 10;
        return { c, score };
      })
      .filter((x) => x.score > 0)
      .sort((a, b) => b.score - a.score || a.c.n.length - b.c.n.length)
      .slice(0, limit)
      .map((x) => x.c);
  }


  // ---------- photo picker ----------
  function photoCurrentHtml(rec) {
    return `${photoThumb(rec, 56)}
      <div class="grow ${rec.photoId ? 'sub' : 'mut'}">${rec.photoId ? esc(rec.photoName || rec.photoId) : 'Nog geen foto gekozen.'}</div>
      <button type="button" class="small" data-photo-find="${rec.id}">Foto zoeken</button>
      <button type="button" class="small ghost" data-photo-clear="${rec.id}" ${rec.photoId ? '' : 'hidden'}>Verwijderen</button>`;
  }
  function bindPhotoPicker() {
    const current = document.getElementById('photo-current');
    const box = document.getElementById('photo-box');
    if (!current || !box) return;
    const refresh = (rec) => {
      current.innerHTML = photoCurrentHtml(rec);
      bindPhotoPicker();
    };
    const findBtn = current.querySelector('[data-photo-find]');
    const clearBtn = current.querySelector('[data-photo-clear]');
    clearBtn.addEventListener('click', () => {
      const rec = exerciseById(clearBtn.dataset.photoClear);
      delete rec.photoId; delete rec.photos; delete rec.photoName;
      save();
      box.innerHTML = '';
      refresh(rec);
    });
    findBtn.addEventListener('click', async () => {
      const rec = exerciseById(findBtn.dataset.photoFind);
      box.innerHTML = '<p class="mut" style="margin:10px 0 0">Fotolijst laden…</p>';
      try {
        await loadPhotoCatalog();
      } catch {
        box.innerHTML = '<p class="mut" style="margin:10px 0 0">Fotolijst laden mislukt. Probeer het opnieuw met internet.</p>';
        return;
      }
      box.innerHTML = `<div class="row" style="margin-top:10px">
          <input id="photo-q" class="grow" value="${esc(rec.name)}" placeholder="Zoek op naam, bijv. bench press">
          <button type="button" class="small ghost" id="photo-close">Sluiten</button>
        </div>
        <p class="mut" style="margin:6px 0 0">Foto's uit Free Exercise DB (publiek domein). Zoeken gaat op Engelse namen; gangbare Nederlandse termen worden vertaald.</p>
        <div id="photo-results"></div>`;
      const results = document.getElementById('photo-results');
      const draw = (q) => {
        const hits = searchPhotos(q);
        results.innerHTML = hits.length
          ? `<div class="photo-grid">${hits.map((c) => `<button type="button" class="photo-pick" data-photo-id="${esc(c.i)}">
              ${photoImg(c.i + '/' + c.p[0])}
              <span>${esc(c.n)}<br><span class="mut">${esc(c.g)} · ${esc(c.e)}</span></span></button>`).join('')}</div>`
          : '<p class="mut" style="margin:10px 0 0">Niets gevonden. Probeer een Engelse term, bijvoorbeeld "bench press" of "row".</p>';
        results.querySelectorAll('[data-photo-id]').forEach((b) => b.addEventListener('click', () => {
          const pick = photoCatalog.find((c) => c.i === b.dataset.photoId);
          rec.photoId = pick.i; rec.photos = pick.p; rec.photoName = pick.n;
          save();
          box.innerHTML = '';
          refresh(rec);
        }));
      };
      const qIn = document.getElementById('photo-q');
      let t = null;
      qIn.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => draw(qIn.value), 150); });
      document.getElementById('photo-close').addEventListener('click', () => { box.innerHTML = ''; });
      draw(rec.name);
    });
  }

  const restFor = (name) => {
    const rec = exerciseByName(name);
    return (rec && rec.restSeconds) || db.settings.restSeconds || 90;
  };

  const STARTER_EXERCISES = [
    ['Squat', 'kracht', 'Benen', 'Barbell'], ['Front squat', 'kracht', 'Benen', 'Barbell'],
    ['Leg press', 'kracht', 'Benen', 'Machine'], ['Lunges', 'kracht', 'Benen', 'Dumbbell'],
    ['Bulgarian split squat', 'kracht', 'Benen', 'Dumbbell'], ['Leg extension', 'kracht', 'Benen', 'Machine'],
    ['Leg curl', 'kracht', 'Benen', 'Machine'], ['Hip thrust', 'kracht', 'Benen', 'Barbell'],
    ['Kuitheffen', 'kracht', 'Benen', 'Machine'], ['Deadlift', 'kracht', 'Rug', 'Barbell'],
    ['Romanian deadlift', 'kracht', 'Benen', 'Barbell'], ['Barbell row', 'kracht', 'Rug', 'Barbell'],
    ['Dumbbell row', 'kracht', 'Rug', 'Dumbbell'], ['Lat pulldown', 'kracht', 'Rug', 'Machine'],
    ['Seated row', 'kracht', 'Rug', 'Kabel'], ['Pull-up', 'lichaamsgewicht', 'Rug', 'Lichaamsgewicht'],
    ['Chin-up', 'lichaamsgewicht', 'Rug', 'Lichaamsgewicht'], ['Face pull', 'kracht', 'Schouders', 'Kabel'],
    ['Bankdrukken', 'kracht', 'Borst', 'Barbell'], ['Incline bankdrukken', 'kracht', 'Borst', 'Barbell'],
    ['Dumbbell press', 'kracht', 'Borst', 'Dumbbell'], ['Chest fly', 'kracht', 'Borst', 'Kabel'],
    ['Push-up', 'lichaamsgewicht', 'Borst', 'Lichaamsgewicht'], ['Dips', 'lichaamsgewicht', 'Borst', 'Lichaamsgewicht'],
    ['Overhead press', 'kracht', 'Schouders', 'Barbell'], ['Arnold press', 'kracht', 'Schouders', 'Dumbbell'],
    ['Lateral raise', 'kracht', 'Schouders', 'Dumbbell'], ['Reverse fly', 'kracht', 'Schouders', 'Dumbbell'],
    ['Shrugs', 'kracht', 'Schouders', 'Dumbbell'], ['Barbell curl', 'kracht', 'Armen', 'Barbell'],
    ['Dumbbell curl', 'kracht', 'Armen', 'Dumbbell'], ['Hammer curl', 'kracht', 'Armen', 'Dumbbell'],
    ['Triceps pushdown', 'kracht', 'Armen', 'Kabel'], ['Skull crusher', 'kracht', 'Armen', 'Barbell'],
    ['Triceps dip', 'lichaamsgewicht', 'Armen', 'Lichaamsgewicht'], ['Plank', 'lichaamsgewicht', 'Core', 'Lichaamsgewicht'],
    ['Hanging leg raise', 'lichaamsgewicht', 'Core', 'Lichaamsgewicht'], ['Russian twist', 'kracht', 'Core', 'Dumbbell'],
    ['Cable crunch', 'kracht', 'Core', 'Kabel'], ['Back extension', 'lichaamsgewicht', 'Core', 'Lichaamsgewicht'],
    ['Farmer walk', 'kracht', 'Core', 'Dumbbell'], ['Kettlebell swing', 'kracht', 'Benen', 'Kettlebell'],
    ['Roeien', 'cardio', 'Cardio', 'Cardio-apparaat'], ['Loopband', 'cardio', 'Cardio', 'Cardio-apparaat'],
    ['Hometrainer', 'cardio', 'Cardio', 'Cardio-apparaat'], ['Crosstrainer', 'cardio', 'Cardio', 'Cardio-apparaat'],
    ['Skierg', 'cardio', 'Cardio', 'Cardio-apparaat'], ['Assault bike', 'cardio', 'Cardio', 'Cardio-apparaat'],
    ['Touwtjespringen', 'cardio', 'Cardio', 'Lichaamsgewicht'], ['Wandelen', 'cardio', 'Cardio', 'Lichaamsgewicht'],
  ];
  function addStarterExercises() {
    let added = 0;
    for (const [name, kind, group, equipment] of STARTER_EXERCISES) {
      if (exerciseByName(name)) continue;
      db.exercises.push({
        id: uid(), name, kind, group, equipment,
        restSeconds: null, instructions: '', cues: '', videoUrl: '', imageUrl: '', aliases: [], archived: false,
      });
      added++;
    }
    save();
    return added;
  }

  // ---------- sync via private GitHub Gist ----------
  const SYNC_KEY = 'coachlog-sync';
  let syncCfg = null;
  try { syncCfg = JSON.parse(localStorage.getItem(SYNC_KEY) || 'null'); } catch { syncCfg = null; }
  let syncStatus = syncCfg ? 'nog niet gesynchroniseerd deze sessie' : '';
  let syncTimer = null;
  const syncTime = () => new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
  function scheduleSync() {
    if (!syncCfg || !syncCfg.gistId) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => { syncNow(); }, 2000);
  }
  async function gh(path, opts = {}) {
    const res = await fetch('https://api.github.com' + path, {
      ...opts,
      signal: AbortSignal.timeout(15000),
      headers: { Authorization: 'Bearer ' + syncCfg.token, Accept: 'application/vnd.github+json', ...(opts.headers || {}) },
    });
    if (!res.ok) throw new Error('GitHub antwoordde ' + res.status);
    return res.json();
  }
  async function connectSync(token) {
    syncCfg = { token, gistId: null };
    const gists = await gh('/gists?per_page=100');
    const found = gists.find((g) => g.description === 'Coachlog sync' && g.files['coachlog.json']);
    if (found) {
      syncCfg.gistId = found.id;
      localStorage.setItem(SYNC_KEY, JSON.stringify(syncCfg));
      await syncNow();
    } else {
      const g = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: 'Coachlog sync', public: false, files: { 'coachlog.json': { content: JSON.stringify(db) } } }) });
      syncCfg.gistId = g.id;
      localStorage.setItem(SYNC_KEY, JSON.stringify(syncCfg));
      syncStatus = 'gekoppeld en eerste back-up gemaakt · ' + syncTime();
    }
  }
  async function syncNow() {
    if (!syncCfg || !syncCfg.gistId) return;
    try {
      const g = await gh('/gists/' + syncCfg.gistId);
      let remote = null;
      try {
        const file = g.files['coachlog.json'];
        const content = file.truncated ? await (await fetch(file.raw_url)).text() : file.content;
        remote = normalizeDb(JSON.parse(content));
      } catch { remote = null; }
      const remoteAt = (remote && remote.updatedAt) || 0;
      const localAt = db.updatedAt || 0;
      if (remoteAt > localAt) {
        db = remote;
        localStorage.setItem(KEY, JSON.stringify(db));
        syncStatus = 'opgehaald van ander apparaat · ' + syncTime();
        render();
        return;
      }
      if (localAt > remoteAt) {
        const payload = JSON.stringify(db);
        if (payload.length > 900000) {
          syncStatus = `te groot om te synchroniseren (${Math.round(payload.length / 1024)} kB) — verwijder wat progressiefoto's`;
          const el0 = document.getElementById('sync-status');
          if (el0) el0.textContent = syncStatus;
          return;
        }
        const files = { 'coachlog.json': { content: payload } };
        const today = todayIso();
        if (db.settings.lastBackupAt !== today) {
          files[`backup-${today}.json`] = { content: payload };
          const old = Object.keys(g.files || {}).filter((n) => n.startsWith('backup-')).sort();
          for (const name of old.slice(0, Math.max(0, old.length - 6))) files[name] = null;
          db.settings.lastBackupAt = today;
          localStorage.setItem(KEY, JSON.stringify(db));
        }
        await gh('/gists/' + syncCfg.gistId, { method: 'PATCH', body: JSON.stringify({ files }) });
        syncStatus = 'opgeslagen naar cloud · ' + syncTime();
      } else {
        syncStatus = 'up-to-date · ' + syncTime();
      }
    } catch (e) {
      syncStatus = 'sync mislukt (' + e.message + ')';
    }
    const el = document.getElementById('sync-status');
    if (el) el.textContent = syncStatus;
  }
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

  const clientById = (id) => db.clients.find((c) => c.id === id);
  const duoById = (id) => db.duos.find((d) => d.id === id);
  const duoSchemaById = (id) => db.duoSchemas.find((s) => s.id === id);
  const duoSchemasOf = (duoId) => db.duoSchemas.filter((s) => s.duoId === duoId);
  const templateById = (id) => db.templates.find((t) => t.id === id);
  const copyExercises = (list) => list.map((e) => ({ id: uid(), name: e.name, targets: (e.targets || []).map((t) => ({ ...t })) }));
  const duoName = (d) => d.name || d.clientIds.map((id) => (clientById(id) || { name: '?' }).name).join(' & ');
  const byName = (a, b) => a.localeCompare(b, 'nl', { sensitivity: 'base' });
  const sortedClients = () => [...db.clients].sort((a, b) => byName(a.name, b.name));
  const sortedDuos = () => db.duos.filter((d) => d.clientIds.every(clientById)).sort((a, b) => byName(duoName(a), duoName(b)));
  const schemaById = (id) => db.schemas.find((s) => s.id === id);
  const schemasOf = (clientId) => db.schemas.filter((s) => s.clientId === clientId);
  const workoutsOf = (clientId) => db.workouts.filter((w) => w.clientId === clientId).sort((a, b) => a.date.localeCompare(b.date));

  // ---------- helpers ----------
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (v) => { const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : 0; };
  const todayIso = () => new Date().toISOString().slice(0, 10);
  const fmtDate = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
  const fmtDateFull = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'long' });
  const unitLbl = () => (db.settings && db.settings.unit) || 'kg';
  const fmtKg = (n) => (Math.round(n * 10) / 10).toLocaleString('nl-NL') + ' ' + unitLbl();

  // ---------- exercise kinds, set types ----------
  const KIND_LABELS = { kracht: 'Kracht', lichaamsgewicht: 'Lichaamsgewicht', cardio: 'Cardio' };
  const entryKind = (e) => e.kind || 'kracht';
  const SET_TYPES = { normaal: '', warmup: 'W', drop: 'D', falen: 'F' };
  const SET_TYPE_LABELS = { normaal: 'Normaal', warmup: 'Warming-up', drop: 'Dropset', falen: 'Tot falen' };
  const SIDE_LABELS = { beide: 'Beide', L: 'Links', R: 'Rechts' };
  const setType = (s) => s.type || 'normaal';
  const setSide = (s) => s.side || 'beide';
  const filledSet = (s, kind) => kind === 'cardio' ? (s.distance > 0 || s.minutes > 0) : (s.weight > 0 || s.reps > 0);
  const fmtNum = (n) => (Math.round(n * 10) / 10).toLocaleString('nl-NL');

  // known kind for an exercise name: from history, then schemas
  function kindFor(clientId, name) {
    const rec = exerciseByName(name);
    if (rec) return rec.kind;
    const key = name.trim().toLowerCase();
    const ws = workoutsOf(clientId);
    for (let i = ws.length - 1; i >= 0; i--) {
      const e = ws[i].entries.find((x) => x.name.trim().toLowerCase() === key);
      if (e) return entryKind(e);
    }
    for (const s of schemasOf(clientId)) {
      const e = s.exercises.find((x) => x.name.trim().toLowerCase() === key);
      if (e && e.kind) return e.kind;
    }
    return 'kracht';
  }

  // metrics per workout for one exercise name; warming-up sets never count
  function exerciseMetrics(entry) {
    const kind = entryKind(entry);
    const sets = entry.sets.filter((s) => setType(s) !== 'warmup' && filledSet(s, kind));
    if (!sets.length) return null;
    if (kind === 'cardio') {
      const distance = sets.reduce((t, s) => t + (s.distance || 0), 0);
      const minutes = sets.reduce((t, s) => t + (s.minutes || 0), 0);
      return { kind, distance, minutes, pace: distance > 0 ? minutes / distance : 0, top: distance, volume: minutes };
    }
    if (kind === 'lichaamsgewicht') {
      const extra = Math.max(...sets.map((s) => s.weight || 0));
      const bestReps = Math.max(...sets.map((s) => s.reps || 0));
      const totalReps = sets.reduce((t, s) => t + (s.reps || 0), 0);
      return { kind, extra, bestReps, totalReps, top: extra, volume: totalReps };
    }
    const top = Math.max(...sets.map((s) => s.weight));
    const volume = sets.reduce((t, s) => t + s.weight * s.reps, 0);
    const e1rm = Math.max(...sets.map((s) => s.reps > 0 ? s.weight * (1 + s.reps / 30) : s.weight));
    return { kind, top, volume, e1rm };
  }

  // one logged set as text, incl. type/side/note markers
  function setText(s, kind) {
    const marks = [SET_TYPES[setType(s)], setSide(s) !== 'beide' ? setSide(s) : ''].filter(Boolean).join(' ');
    const body = kind === 'cardio'
      ? `${fmtNum(s.distance || 0)} km in ${fmtNum(s.minutes || 0)} min`
      : kind === 'lichaamsgewicht'
        ? `${s.weight > 0 ? '+' + fmtKg(s.weight) + ' × ' : ''}${s.reps || 0}${s.weight > 0 ? '' : ' herh.'}`
        : `${fmtKg(s.weight || 0)} × ${s.reps || 0}`;
    return body + (marks ? ` <span class="mut">${esc(marks)}</span>` : '') + (s.note ? ` <span class="mut">(${esc(s.note)})</span>` : '');
  }

  function loggedExercises(clientId) {
    const seen = new Map();
    for (const w of workoutsOf(clientId)) {
      for (const e of w.entries) {
        const key = e.name.trim().toLowerCase();
        if (key && !seen.has(key)) seen.set(key, e.name.trim());
      }
    }
    return [...seen.values()];
  }

  // all exercise names known for this client: from schemas + logged workouts
  function knownExercises(clientId) {
    const seen = new Map();
    for (const s of schemasOf(clientId)) {
      for (const e of s.exercises) {
        const key = e.name.trim().toLowerCase();
        if (key && !seen.has(key)) seen.set(key, e.name.trim());
      }
    }
    for (const n of loggedExercises(clientId)) {
      const key = n.toLowerCase();
      if (!seen.has(key)) seen.set(key, n);
    }
    return [...seen.values()];
  }

  // most recent logged entry of an exercise, any workout (excludeId: skip the workout being edited)
  function lastEntryFor(clientId, name, excludeId) {
    const key = name.trim().toLowerCase();
    const ws = workoutsOf(clientId).filter((w) => w.id !== excludeId);
    for (let i = ws.length - 1; i >= 0; i--) {
      const entry = ws[i].entries.find((e) => e.name.trim().toLowerCase() === key);
      if (entry) return { entry, date: ws[i].date };
    }
    return null;
  }

  // per-set schema targets for an exercise name, null if not in any schema
  function targetsFor(clientId, name) {
    const key = name.trim().toLowerCase();
    for (const s of schemasOf(clientId)) {
      const e = s.exercises.find((x) => x.name.trim().toLowerCase() === key);
      if (e && e.targets && e.targets.length) return e.targets;
    }
    return null;
  }

  // best logged top weight for an exercise, null if never done
  function bestTopFor(clientId, name, excludeId) {
    const sessions = exerciseSessions(clientId, name, excludeId);
    return sessions.length ? Math.max(...sessions.map((s) => s.top)) : null;
  }

  // set input rows for workout logging: kind-specific fields, per-set options, previous-session hints
  function setRowsHtml(attr, idx, sets, prevSets, kind, openMore) {
    const isCardio = kind === 'cardio';
    const weightHead = kind === 'lichaamsgewicht' ? `Extra (${unitLbl()})` : `Gewicht (${unitLbl()})`;

    return header + sets.map((s, si) => {
      const key = `${idx}.${si}`;
      const p = prevSets && prevSets[si];

            <button type="button" class="small ghost" data-more-${attr}="${key}" aria-label="Meer opties">⋯</button>

            <input data-${attr}="${key}" data-f="rir" type="number" min="0" max="10" inputmode="numeric" value="${s.rir ?? ''}" placeholder="–" aria-label="Reps in reserve">

      const more = openMore === key ? `<div class="set-more">

          <span class="lbl">Kant</span>
          <div class="pillbar">${Object.keys(SIDE_LABELS).map((sd) =>
            `<button type="button" data-setside-${attr}="${key}.${sd}" aria-pressed="${setSide(s) === sd}">${SIDE_LABELS[sd]}</button>`).join('')}</div>
          <span class="lbl">Notitie</span>
          <input data-${attr}="${key}" data-f="note" type="text" value="${esc(s.note || '')}" placeholder="bijv. linkerknie zeurde">
          <span></span>
          <div class="pillbar"><button type="button" class="danger" data-rm-${attr}="${key}">Set verwijderen</button></div>
        </div>` : '';

      const hint = p ? `<div class="prev-hint">vorige keer: ${kind === 'cardio'
        ? `${fmtNum(p.distance || 0)} km in ${fmtNum(p.minutes || 0)} min`
        : `${esc(fmtKg(p.weight || 0))} × ${p.reps || 0}${p.rir != null ? ' · RIR ' + p.rir : ''}`}</div>` : '';

      return row + hint + more;

  }

  // target rows for schema editors (key = "i" or "mi.i"); rmAttr/addAttr are data-attribute names
  function targetRowsHtml(key, targets, kind, rmAttr) {
    const isCardio = kind === 'cardio';
    const head = isCardio
      ? `<div class="tgt-row"><span></span><span class="col-head">Afstand (km)</span><span class="col-head">Tijd (min)</span><span></span></div>`
      : `<div class="tgt-row"><span></span><span class="col-head">${kind === 'lichaamsgewicht' ? 'Extra' : 'Gewicht'} (${unitLbl()})</span><span class="col-head">Herh.</span><span></span></div>`;
    return head + targets.map((t, si) => `<div class="tgt-row">
      <span class="n">${si + 1}</span>
      ${isCardio
        ? `<input data-tgt="${key}.${si}" data-f="distance" type="text" inputmode="decimal" value="${t.distance || ''}" placeholder="km">
           <input data-tgt="${key}.${si}" data-f="minutes" type="text" inputmode="decimal" value="${t.minutes || ''}" placeholder="min">`
        : `<input data-tgt="${key}.${si}" data-f="weight" type="text" inputmode="decimal" value="${t.weight || ''}" placeholder="${unitLbl()}">
           <input data-tgt="${key}.${si}" data-f="reps" type="number" min="0" inputmode="numeric" value="${t.reps || ''}" placeholder="herh.">`}
      <button type="button" class="small danger ghost" data-${rmAttr}="${key}.${si}" aria-label="Verwijder set">✕</button>

  // wire up the per-set controls shared by solo and duo logging
  function bindSetControls(attr, o) {
    const camel = (p) => p + attr.charAt(0).toUpperCase() + attr.slice(1);
    document.querySelectorAll(`[data-more-${attr}]`).forEach((b) => b.addEventListener('click', () => {
      o.syncDraft();
      const key = b.dataset[camel('more')];
      o.setOpenMore(o.openMore() === key ? null : key);
      o.repaint();
    }));
    document.querySelectorAll(`[data-settype-${attr}]`).forEach((b) => b.addEventListener('click', () => {
      o.syncDraft();
      const raw = b.dataset[camel('settype')];
      const type = raw.slice(raw.lastIndexOf('.') + 1);
      o.getSet(raw.slice(0, raw.lastIndexOf('.'))).type = type;
      o.repaint();
    }));
    document.querySelectorAll(`[data-setside-${attr}]`).forEach((b) => b.addEventListener('click', () => {
      o.syncDraft();
      const raw = b.dataset[camel('setside')];
      const side = raw.slice(raw.lastIndexOf('.') + 1);
      o.getSet(raw.slice(0, raw.lastIndexOf('.'))).side = side;
      o.repaint();
    }));
    document.querySelectorAll(`[data-rm-${attr}]`).forEach((b) => b.addEventListener('click', () => {
      o.syncDraft();
      o.removeSet(b.dataset[camel('rm')]);
      o.setOpenMore(null);
      o.repaint();
    }));
    // rest timer: per-exercise button, plus auto-start once a set's reps/time is entered
    const restSecondsFor = (key) => (o.restFor && key ? o.restFor(key) : db.settings.restSeconds) || 90;
    document.querySelectorAll(`[data-rest-${attr}]`).forEach((b) => b.addEventListener('click', () => {
      const key = b.dataset[camel('rest')];
      startRest(restSecondsFor(key === 'all' ? null : key));
    }));
    if (db.settings.autoRest) {
      document.querySelectorAll(`[data-${attr}][data-f="reps"], [data-${attr}][data-f="minutes"]`).forEach((inp) => {
        inp.addEventListener('change', () => {
          const key = inp.dataset[attr] || '';
          if (num(inp.value) > 0) startRest(restSecondsFor(key.slice(0, key.lastIndexOf('.'))));
        });
      });
    }
  }

  // live PR badge: show while typed weight beats the client's best for that exercise
  function bindPrLive(attr, key, clientId, exName, excludeId) {
    const badge = document.querySelector(`[data-pr-live="${key}"]`);
    if (!badge) return;
    const best = bestTopFor(clientId, exName, excludeId);
    if (best == null) return;
    const inputs = [...document.querySelectorAll(`[data-${attr}^="${key}."][data-f="weight"]`)];
    const update = () => {
      const cur = Math.max(0, ...inputs.map((i) => num(i.value)));
      if (cur > best) {
        badge.hidden = false;
        badge.innerHTML = `🏆 Nieuw PR! ${esc(fmtKg(cur))} <span style="font-weight:400">(was ${esc(fmtKg(best))})</span>`;
      } else {
        badge.hidden = true;
      }
    };
    inputs.forEach((i) => i.addEventListener('input', update));
    update();
  }

  // all sessions of one exercise, chronological, with metrics and PR markers
  function exerciseSessions(clientId, name, excludeId) {
    const key = name.trim().toLowerCase();
    const sessions = [];
    for (const w of workoutsOf(clientId).filter((x) => x.id !== excludeId)) {
      for (const e of w.entries) {
        if (e.name.trim().toLowerCase() !== key) continue;
        const m = exerciseMetrics(e);
        if (m) sessions.push({ date: w.date, sets: e.sets, ...m });
      }
    }
    let best = -Infinity;
    for (let i = 0; i < sessions.length; i++) {
      sessions[i].isPr = i > 0 && sessions[i].top > best;
      if (sessions[i].top > best) best = sessions[i].top;
    }
    return sessions;
  }

  // ---------- clients: goals, photos, storage ----------
  const activeClients = () => db.clients.filter((c) => !c.archived);

  // a goal tracks an exercise towards a target; progress comes from the logged history
  function goalProgress(client, goal) {
    if (!goal.exercise || !(goal.target > 0)) return null;
    const sessions = exerciseSessions(client.id, goal.exercise);
    const current = sessions.length ? Math.max(...sessions.map((s) => s.top)) : 0;
    const start = goal.start != null ? goal.start : (sessions.length ? sessions[0].top : 0);
    const span = goal.target - start;
    const pct = span > 0 ? Math.round(((current - start) / span) * 100) : (current >= goal.target ? 100 : 0);
    return { current, start, pct: Math.max(0, Math.min(100, pct)), reached: current >= goal.target };
  }
  const daysUntil = (iso) => Math.ceil((new Date(iso + 'T12:00:00') - new Date()) / 86400000);

  // photos are stored inline, so shrink them hard before they hit local storage
  function readPhoto(file, maxSize = 640, quality = 0.55) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('kan bestand niet lezen'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('geen geldige afbeelding'));
        img.onload = () => {
          const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  const dbSizeKb = () => Math.round(JSON.stringify(db).length / 1024);

  // ---------- nutrition ----------
  const MOMENTS = ['Ontbijt', 'Lunch', 'Diner', 'Snack'];
  const MACROS = [
    { key: 'kcal', label: 'Calorieën', unit: 'kcal' },
    { key: 'protein', label: 'Eiwit', unit: 'g' },
    { key: 'carbs', label: 'Koolhydraten', unit: 'g' },
    { key: 'fat', label: 'Vet', unit: 'g' },
  ];
  const planOf = (clientId) => db.nutritionPlans[clientId] || null;
  const mealsOn = (clientId, date) => db.meals
    .filter((m) => m.clientId === clientId && m.date === date)
    .sort((a, b) => MOMENTS.indexOf(a.moment) - MOMENTS.indexOf(b.moment));
  const emptyTotals = () => ({ kcal: 0, protein: 0, carbs: 0, fat: 0 });
  function dayTotals(clientId, date) {
    return mealsOn(clientId, date).reduce((t, m) => {
      for (const { key } of MACROS) t[key] += m[key] || 0;
      return t;
    }, emptyTotals());
  }
  // averages over the days that actually have something logged
  function nutritionAverages(clientId, days = 7) {
    const today = todayIso();
    let logged = 0;
    const sum = emptyTotals();
    for (let i = 0; i < days; i++) {
      const date = addDays(today, -i);
      if (!mealsOn(clientId, date).length) continue;
      logged++;
      const t = dayTotals(clientId, date);
      for (const { key } of MACROS) sum[key] += t[key];
    }
    if (!logged) return null;
    const avg = emptyTotals();
    for (const { key } of MACROS) avg[key] = Math.round(sum[key] / logged);
    return { avg, days: logged };
  }
  // rough starting point; the coach adjusts from there
  function suggestPlan(clientId) {
    const meas = db.measurements.filter((m) => m.clientId === clientId && m.weight > 0).sort((a, b) => a.date.localeCompare(b.date));
    const weight = meas.length ? meas[meas.length - 1].weight : null;
    if (!weight) return null;
    const protein = Math.round(weight * 1.8);
    const kcal = Math.round(weight * 33);
    const fat = Math.round(weight * 0.9);
    const carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
    return { weight, kcal, protein, carbs, fat };
  }
  const foodByName = (name) => db.foods.find((f) => f.name.trim().toLowerCase() === String(name).trim().toLowerCase()) || null;
  const foodById = (id) => db.foods.find((f) => f.id === id) || null;

  // calories burned that day, estimated from logged training time
  function burnedOn(clientId, date) {
    if (!db.settings.countTrainingBurn) return 0;
    const perMin = db.settings.kcalPerMin || 6;
    return workoutsOf(clientId)
      .filter((w) => w.date === date)
      .reduce((t, w) => t + Math.round((w.durationMin || 0) * perMin), 0);
  }
  // the number MyFitnessPal leads with: target minus food plus exercise
  function remainingKcal(clientId, date) {
    const plan = planOf(clientId);
    if (!plan || !plan.kcal) return null;
    const eaten = dayTotals(clientId, date).kcal;
    const burned = burnedOn(clientId, date);
    return { target: plan.kcal, eaten: Math.round(eaten), burned, remaining: Math.round(plan.kcal - eaten + burned) };
  }
  const waterOn = (clientId, date) => ((db.water[clientId] || {})[date] || 0);
  function addWater(clientId, date, ml) {
    const perClient = db.water[clientId] || (db.water[clientId] = {});
    perClient[date] = Math.max(0, (perClient[date] || 0) + ml);
    if (!perClient[date]) delete perClient[date];
    save();
  }
  // foods used most often, for one-tap logging
  function frequentFoods(clientId, limit = 8) {
    const counts = new Map();
    for (const m of db.meals) {
      if (m.clientId !== clientId) continue;
      const key = m.name.trim().toLowerCase();
      const cur = counts.get(key) || { name: m.name, uses: 0, last: m, date: m.date };
      cur.uses++;
      if (m.date >= cur.date) { cur.last = m; cur.date = m.date; }
      counts.set(key, cur);
    }
    return [...counts.values()].sort((a, b) => (b.uses - a.uses) || b.date.localeCompare(a.date)).slice(0, limit);
  }
  function copyDay(clientId, fromDate, toDate) {
    const source = mealsOn(clientId, fromDate);
    for (const m of source) {
      db.meals.push({ ...m, id: uid(), date: toDate });
    }
    save();
    return source.length;
  }
  // macro targets from a percentage split, the way most nutrition apps do it
  function planFromPercents(kcal, pProtein, pCarbs, pFat) {
    return {
      kcal: Math.round(kcal),
      protein: Math.round((kcal * pProtein / 100) / 4),
      carbs: Math.round((kcal * pCarbs / 100) / 4),
      fat: Math.round((kcal * pFat / 100) / 9),
    };
  }

  // ---------- product lookup (Open Food Facts) ----------
  const OFF_FIELDS = 'code,product_name,brands,serving_size,nutriments';
  function offToFood(p) {
    const n = p.nutriments || {};
    const name = [p.product_name, p.brands ? p.brands.split(',')[0].trim() : ''].filter(Boolean).join(' — ');
    if (!name) return null;
    return {
      name, code: p.code || '', per: '100g', servingSize: p.serving_size || '',
      kcal: Math.round(n['energy-kcal_100g'] || (n.energy_100g ? n.energy_100g / 4.184 : 0)),
      protein: Math.round((n.proteins_100g || 0) * 10) / 10,
      carbs: Math.round((n.carbohydrates_100g || 0) * 10) / 10,
      fat: Math.round((n.fat_100g || 0) * 10) / 10,
    };
  }
  async function searchProducts(term) {
    const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(term)}` +
      `&search_simple=1&action=process&json=1&page_size=15&fields=${OFF_FIELDS}`;
    const res = await fetch(url, { signal: AbortSignal.timeout(12000) });
    if (!res.ok) throw new Error('zoeken mislukt (' + res.status + ')');
    const data = await res.json();
    return (data.products || []).map(offToFood).filter((f) => f && f.kcal > 0);
  }
  async function productByBarcode(code) {
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`, { signal: AbortSignal.timeout(12000) });
    if (!res.ok) throw new Error('product niet gevonden');
    const data = await res.json();
    if (!data.product) throw new Error('product niet gevonden');
    return offToFood(data.product);
  }
  const barcodeSupported = () => 'BarcodeDetector' in window;
  async function scanBarcode(videoEl) {
    const detector = new window.BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'] });
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    videoEl.srcObject = stream;
    await videoEl.play();
    const stop = () => stream.getTracks().forEach((t) => t.stop());
    const deadline = Date.now() + 20000;
    while (Date.now() < deadline) {
      try {
        const found = await detector.detect(videoEl);
        if (found.length) { stop(); return found[0].rawValue; }
      } catch { /* keep trying */ }
      await new Promise((r) => setTimeout(r, 300));
    }
    stop();
    throw new Error('geen barcode herkend');
  }
  // amount is grams for per-100g foods, or a number of portions
  function macrosFor(food, amount) {
    const factor = food.per === 'portie' ? amount : amount / 100;
    const out = {};
    for (const { key } of MACROS) out[key] = Math.round((food[key] || 0) * factor * 10) / 10;
    return out;
  }

  // ---------- backups and sharing ----------
  async function listBackups() {
    if (!syncCfg || !syncCfg.gistId) return [];
    const g = await gh('/gists/' + syncCfg.gistId);
    return Object.keys(g.files || {}).filter((n) => n.startsWith('backup-')).sort().reverse();
  }
  async function restoreBackup(name) {
    const g = await gh('/gists/' + syncCfg.gistId);
    const file = g.files[name];
    const content = file.truncated ? await (await fetch(file.raw_url)).text() : file.content;
    db = normalizeDb(JSON.parse(content));
    delete db._needsSave;
    save();
    render();
  }

  // a read-only snapshot for one client, published as a secret gist
  function clientSnapshot(clientId) {
    const c = clientById(clientId);
    const exercises = loggedExercises(clientId).map((name) => {
      const ss = exerciseSessions(clientId, name);
      const kind = ss[ss.length - 1].kind || 'kracht';
      return {
        name, kind,
        sessions: ss.map((x) => ({ date: x.date, top: x.top, volume: x.volume, sets: x.sets })),
      };
    });
    return {
      version: 1, generated: todayIso(), unit: unitLbl(), coach: db.settings.coachName || '',
      client: { name: c.name, goal: c.goal || '' },
      goals: (c.goals || []).map((g) => ({ text: g.text, exercise: g.exercise, target: g.target, date: g.date, done: g.done })),
      measurements: db.measurements.filter((m) => m.clientId === clientId),
      nutrition: (() => {
        const plan = planOf(clientId);
        const week = nutritionAverages(clientId, 7);
        return plan || week ? { plan, week } : null;
      })(),
      workouts: workoutsOf(clientId).map((w) => ({ date: w.date, durationMin: w.durationMin, entries: w.entries })),
      exercises,
    };
  }
  async function shareClient(clientId) {
    const c = clientById(clientId);
    const content = JSON.stringify(clientSnapshot(clientId));
    if (c.shareGistId) {
      await gh('/gists/' + c.shareGistId, { method: 'PATCH', body: JSON.stringify({ files: { 'client.json': { content } } }) });
    } else {
      const g = await gh('/gists', {
        method: 'POST',
        body: JSON.stringify({ description: `Coachlog inzage — ${c.name}`, public: false, files: { 'client.json': { content } } }),
      });

    c.sharedAt = todayIso();

  const shareLink = (c) => `${location.origin}${location.pathname.replace(/[^/]*$/, '')}klant.html#${c.shareGistId}`;
  async function stopSharing(clientId) {
    const c = clientById(clientId);
    if (!c.shareGistId) return;
    try { await gh('/gists/' + c.shareGistId, { method: 'DELETE' }); } catch { /* already gone */ }
    delete c.shareGistId;
    delete c.sharedAt;
